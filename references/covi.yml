          type: string
        ignore:
          description: a flag that may be set via Update Person API.
          type: boolean
        moniker:
          description: alernate name.
          type: string
        company:
          description: company which person is associated with.
          type: string
        tags:
          description: arbitrary tags that may be set via Update Person API.
          items:
            type: string
          type: array
        gender:
          description: gender of the identified face.
          type: string
        personType:
          description: person type assigned with the Update Person API.
          type: string
        age:
          description: estimated age of the person to whom this face belongs.
          type: number
          format: float
          example: 12.3456
        sentiment:
          description: 'estimated person sentiment. Populates range [-1, 1]'
          type: number
          format: float
          example: -0.12345
        smile:
          description: detects smile.
          type: boolean
        occurrence:
          description: count of the times this person has been recognized.
          type: number
        lastOccurrenceDate:
          description: Unix Epoch time in miliseconds that this person has been last seen.
          type: number
          format: int64
        mergedWith:
          description: personId of another person the identified person is merged with.
          type: string
        similarityScore:
          description: >-
            Match percentage. Range is from zero to above one. 100% (value 1.0)
            means that distance between face matches the threshold exactly.
            100.23% (value 1.0023) means distance between faces is smaller than
            the threshold. 97.63% (value 0.9763) means distance between faces is
            larger than the threshold.
          type: number
        hasMergedPeople:
          description: >-
            Indicator if the root person has merge people. This value is
            provided only when the verbose mode is used.
          type: boolean

  /rootpeople/inzone/request:
    post:
      tags:
      - People Zones Interface
      summary: Get Root People in Zones
      description: Query for person records belonging to any of the specified zone ids. <br><br>
        requires READ_PRIVILEGE
      operationId: getPeopleUsingPOST
      parameters:
      - $ref: '#/components/parameters/XRpcAuthorization'
      - name: startIndexState
        in: query
        description: Opaque index returned in the paging object (personCollectionResponse) from the previous call, i.e. personCollectionResponse.nextIndexState field. If startIndexState is provided, start-index will only be used to maintain proper count in paging object returned where the last page totalCount = start-index + count
        schema:
          type: string
      - description: Starting index of the query. This should be total count returned so far.
        in: query
        name: start-index
        required: false
        schema:
          type: number
          default: 0
      - description: Target number of records to return. The default is 100. Actual number of records returned could be lower if fewer records satisfying the query exist or could be higher due to records paging boundary.
        in: query
        name: count
        required: false
        schema:
          type: number
          default: 100
      - description: >-
          Supported values include name, create-date, update-date, home-location and last-name.
          By default, no sorting is applied and the default database order is returned.
        in: query
        name: sort
        required: false
        schema:
          type: string
      - description: >-
          Valid values for sort order are ascending and descending, when not
          specified the default is ascending.
        in: query
        name: sort-order
        required: false
        schema:
          type: string
          default: ascending
      - description: Regular expression used to search on persons name.
        in: query
        name: name-pattern
        required: false
        schema:
          type: string
      - description: Regular expression used to search on persons home location.
        in: query
        name: home-location-pattern
        required: false
        schema:
          type: string
      - description: >-
          Exact string used to search for persons home location. The special
          value $absent is used to find all people that do not have the home
          location set. The $present can be used to find all the people that
          have the home location set.
        in: query
        name: home-location
        required: false
        schema:
          type: string
      - description: >-
          String used to search for persons last name. The last name is
          extracted from the Person's name. The case is ignored.
        in: query
        name: last-name
        required: false
        schema:
          type: string
      - description: >-
          Exact string used to search for persons type. The special value
          $absent is used to find all people that do not have the person type
          set. The $present can be used to find all the people that have the
          person type set.
        in: query
        name: person-type
        required: false
        schema:
          type: string
      - description: >-
          Exact string used to search for moniker. The special value $absent
          is used to find all people that do not have the moniker set. The
          $present can be used to find all the people that have the moniker
          set.
        in: query
        name: moniker
        required: false
        schema:
          type: string
      - description: >-
          One of the following values: noconcern, concern, stranger, threat,
          unidentified. 'noconcern' includes people with id-class = noconcern
          or a person without an id-class that has previously been identified.
        in: query
        name: id-class
        required: false
        schema:
          type: string
      - description: >-
          Specifies if expired people should be return. Default is false, not
          returning expired people.
        in: query
        name: include-expired
        required: false
        schema:
          type: boolean
          default: false
      - description: >-
          Specfies list of groups to include in query.
        in: query
        name: groups
        required: false
        schema:
          type: array
          items:
            type: string
      - description: >-
          Specfies the facility access car id of person records to query.
        in: query
        name: access-card-id
        required: false
        schema:
          type: string
      - description: >-
          Specfies the facility id of person records to query.
        in: query
        name: access-facility-id
        required: false
        schema:
          type: string
      - description:  >-
          ShortID is a 4 byte (8 hex digit) prefix of full root person id GUID to include in query.
        in: query
        name: short-id
        required: false
        schema:
          type: string
      - description:  Specfies whether to query for persons that have a face identity associated.
        in: query
        name: face-id
        required: false
        schema:
          type: string
      - description: >-
          Specfies access clearance name to include in query.
        in: query
        name: access-clearance
        required: false
        schema:
          type: string
      - description: >-
          Specfies maximum access clearance for people queried.  Optional. Default = -1.
        in: query
        name: min-access-clearance-level
        required: false
        schema:
          type: integer
      - description: >-
          Specfies maximum access clearance for people queried. Optional. Default = Max Integer.
        in: query
        name: max-access-clearance-level
        required: false
        schema:
          type: integer
      - description: >-
          Specfies query for absence or presence of documents.
        in: query
        name: has-docs
        required: false
        schema:
          type: boolean
      - description: >-
          Specfies query for absence or presence of notes.
        in: query
        name: has-notes
        required: false
        schema:
          type: boolean
      - description:  >-
          Specfies role or list of roles to include in query, e.g. ?invite-account-role=user&invite-account-role=host <br/>When invite-account-role=none is provided, it includes person records without inviteAccountRole attribute set.
        in: query
        name: invite-account-role
        required: false
        schema:
          type: array
          items:
            type: string
      - description:  >-
          Specfies the access information system origin. access-origin="" matches people without access-origin set. Keyword $any can be used to specify any access-origin set.
        in: query
        name: access-origin
        required: false
        schema:
          type: string
      - name: zones
        in: query
        description: zones ids used to filter response; optional ids can by provided in request body
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        description: zoneRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootPeopleInZoneRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GetPaginatedPeopleResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
      x-codegen-request-body-name: zoneRequest
tags:
  - description: The Computer Vision REST API face detection and recognition interface.
    name: Facial Recognition Interface
  - description: The Computer Vision REST API object detection and recognition interface.
    name: Object Recogition Interface
  - description: >-
      The REST API that manages and retrieves peoples' metadata (e.g. names,
      ages and gender), external identities, merged identities, and face
      signatures.
    name: Recognized Person Interface
  - description: The REST API that manages and retrieves objects' metadata
    name: Recognized Object Interface
  - description: 'The REST API that manages Groups.'
    name: Groups Interface
  - description: 'The REST API that manages People and Zones membership'
    name: People Zones Interface  
  - description: 'The REST API that manages Access Clearances.'
    name: Access Clearance Interface
  - description: 'The REST API that manages Invitations.'
    name: Invitation Interface
  - description: 'The REST API that manages users, tenants and system configuration.'
    name: Admin Interface
components:
  parameters:
    XRpcAuthorization:
      description: Header containing the directory.
      name: X-RPC-DIRECTORY
      in: header
      required: true
      schema:
        type: string
        default: main
    XRpcSite:
      description: Header containing the site indicator.
      name: X-RPC-SITE
      in: header
      required: false
      schema:
        type: string
        default: main
    XRpcSiteBase64:
      description: Header containing the site indicator base64 encoded.
      name: X-RPC-SITE-BASE64
      in: header
      required: false
      schema:
        type: string
        default: main
    XRpcSource:
      description: Header containing the source indicator.
      name: X-RPC-SOURCE
      in: header
      required: false
      schema:
        type: string
        default: main
    XRpcSourceBase64:
      description: Header containing the source indicator base64 encoded.
      name: X-RPC-SOURCE-BASE64
      in: header
      required: false
      schema:
        type: string
        default: main
  securitySchemes:
    Authentication:
      description: >-
        Use your colon separated userID and password for authentication. e.g. \<userID\>:\<password\>
      type: apiKey
      in: header
      name: X-RPC-AUTHORIZATION
  schemas:
    ErrorResponse:
      title: ErrorResponse
      type: object
      properties:
        error:
          description: general error description
          type: string
        errorReason:
          description: specific error key used to create an i18n error message
          type: string
        message:
          description: default displayable message
          type: string
        path:
          description: HTTP path that generated the error
          type: string
        status:
          description: HTTP Status code
          type: integer
          format: int32
        timestamp:
          description: Milliseconds since the Epoch.
          type: integer
          format: int64
        verb:
          description: HTTP Method of the call that generated error
          type: string
    InvitationRequest:
      title: InvitationRequest
      type: object
      properties:
        inviteType:
          description: required. invitation type; valid values include 'mobileCredential'
          type: string
        inviteExpTime:
          description: 'required. milliseconds from posting of invitation when invite expires; min: 0,  max:  2592000000  (30 days)'
          type: integer
          format: int64
        inviteMobileCredentialFormats:
          description: optional. array of credential formats including 'PKOC' and 'FIDO'; if empty, default 'PKOC'
          type: array
          items:
            type: string
        inviteMobileCredentialDomainName:
          description: Required for 'FIDO', optional for 'PKOC'
          type: string
        inviteMobileCredentialSourceGUID:
          description: Required for 'PKOC', derived from inviteMobileCredentialDomainName when Domain Name is present. Not used for 'FIDO'.
          type: string
        inviteMobileCredentialObfuscationType:
          description: >-
            Optional, Default = "" which means no obfuscation is to be used.  Possible values: "", "JCI",  "Kastle Systems", "Last Lock", "SAFR", "Custom"
          type: string
        inviteMobileCredentialCustomObfuscationGUID:
          description: >-
            Required only if inviteMobileCredentialObfuscationType is set to "Custom"
          type: string
    InvitationResponse:
      title: InvitationResponse
      type:  object
      properties:
        inviteType:
          description: invitation type; valid values include 'mobileCredential'
          type: string
        inviteDate:
          description: milliseconds since the epoch indicating date-time of invitation creation
          type: integer
          format: int64
        inviteId:
          description: invitation identifier used to cancel invitation
          type: string
        inviteRootPersonId: 
          description: root person id for this invitation; may be different than person provided to the request if the person is merged.  The validationEmail of this person will receive an invitation.
          type: string
        inviteURL: 
          description:  a URL used to by mobile device to reply to the  invitation
          type: string
        inviteByCompanyName: 
          description:  the name of the company provided to SAFR Signup for the cloud connect userId provided.  See PUT /admin/system/config for details on configuring SAFR Cloud connection services.
          type: string
        inviteSubject:
          description:  formatted subject for an email invitation 
          type: string
        inviteText:
          description:  formatted email body used with an email invitation 
          type: string
    AccessClearance:
      title: AccessClearance
      type: object
      properties:
        accessClearance:
          description: unique name (per tenant) of the Access Clearance
          type: string
        accessClearanceLevel:
          description: >-
            Effective level of the access clearance ranging from -1 to 100. 
            <br/>-1, 0 and 100 are reserved by the system.
            <br/>-1 = Banned        (cannot be invited)
            <br/>0 = Guest         (can be invited)
            <br/>100 = Unlimited     (full access)
            <br/>Operator can set access clearance levels 1..99 when creating an access clearance.  The higher the clearance level, the less restrictive it is.
          type: integer
        accessMode:
          description: >-
            Access mode to used when accessForAllZonesAndTimesEnabled = true.
            <br> Optional.  Default = "" (use default set at the access reader).
            <br> accessMode does not take affect unless access reader is configured with
            <br> default accessMode including all factors of accessMode-s used here.
            <br> Thus, accessModes used here must use a subset of authentication factors
            <br> configured as the default on the access reader.
            <br> Possible values:
            <br>    "Face Recognition"
            <br>    "Face Recognition and Access Card"
            <br>    "Face Recognition and Mobile Credential"
            <br>    "Face Recognition and Mobile Credential / Access Card"
            <br>    "Face Recognition or Access Card"
            <br>    "Access Card"
          type: string
        accessForAllZonesAndTimesEnabled:
          description:  If set to true, access is enabled for all zones and all times.   If false, accessZoneGroups define specific locations and associated times for which access is allowed.
          type: boolean
        accessZoneGroups:
          description: Optional, default = [] (no access)
          type: array
          items:
            $ref: '#/components/schemas/AccessZoneGroup'
        canBeInvited:
          description: Indicates if person can receive additional access privileges through invitation.  Optional.  Default = true.
          type: boolean
          default: true
        enabled:
          description: Indicates if the entire access clearance definition is enabled or not. default = true.
          type: boolean
          default: true
        permanent:
          description: read-only field indicating whether this access clearance is modifiable.
          type: boolean
          default: false
        escortCountAllowed:
          description: >-
            Number of escorts allowed when accessForAllZonesAndTimesEnabled = true.  Optional.  Default = 0.  Unlimited = -1. If accessForAllZonesAndTimesEnabled = false, this property is ignored.  escortCountAllowed in accessZoneGroups is used instead. 
          type: integer
        guestCountAllowed:
          description: >-
            Number of overlapping guests allowed.  Optional.  Default = 0.  Unlimited = -1.
          type: integer
        guestInviteToSameZonesAndTimesEnabled:
          description: >-
            If set to true, guest invitations is enabled for all zones and all times this access clearance enables.  If false, guestInviteZoneGroups define specific locations and assoicated times for which guest invitation can be extended.
          type: boolean
        guestInviteZoneGroups:
          type: array
          items:
            $ref: '#/components/schemas/GuestInviteZoneGroup'
    GuestInviteZoneGroup:
      title: GuestInviteZoneGroup
      type: object
      properties:
        accessExclusionDaysOfYear:
          description: >-
            Days of year for which access is excluded. Optional. Default = none.
          type: array
          items:
            $ref: '#/components/schemas/DayOfYear'
          default: []
        accessForAllTimesEnabled:
          description: >-
            If set to true, access to the spcified zones is enabled for all times.  If false, accessTimes define specific times for which access is allowed.
          type: boolean
        accessForAllZonesEnabled:
          description:  >-
            If set to true, access is enabled for all zones.  If false, accessZones define specific zones for which access is allowed.
          type: boolean
        accessTimes:
          description: >-
            Access times during the week for which access is enabled. Optional. Default = none.
          type: array
          items:
            $ref: '#/components/schemas/AccessTime'
          default: []
        accessZones:
          description: >-
            Array of identifiers for zones person has access to.  Required.  Zones listed must NOT occur in any other guestInviteZoneGroups.
          type: array
          items:
            type: string
          default: []
        guestCountAllowed:
          description: >-
            Number of overlapping guests allowed.  Optional.  Default = 0.  Unlimited = -1.
          default: -1
          type: integer
    DayOfYear:
      title: DayOfYear
      type: object
      properties:
        day:
          description: day of month [1..31]
          type: integer
          format: int32
        month:
          description: month of year [1..12]
          type: integer
          format: int32
        year:
          type: integer
          format: int32
    AccessClearanceRequest:
      title: AccessClearanceRequest
      type: object
      properties:
        accessClearances:
          type: array
          items:
            $ref: '#/components/schemas/AccessClearance'
    AccessClearanceResponse:
      title: AccessClearanceResponse
      type: object
      properties:
        accessClearances:
          type: array
          items:
            $ref: '#/components/schemas/AccessClearance'
    AccessClearanceZonesRequest:
      title: AccessClearanceZonesRequest
      type: object
      properties:
        zones:
          type: array
          items:
            type: string
    AccessTime:
      title: AccessTime
      type: object
      properties:
        daysOfWeek:
          description: >-
            Array of one or more of the following: "Mon","Tue","Wed","Thu","Fri","Sat","Sun"
          type: array
          items:
            type: string
        timesOfDay:
          description:
            Array of times-of-day which include a start and end time.
          type: array
          items:
            $ref: '#/components/schemas/TimeOfDay'
    AccessZoneGroup:
      title: AccessZoneGroup
      type: object
      properties:
        accessExclusionDaysOfYear:
          description:  >-
            Days of year for which access is excluded. Optional. Default = none.
          type: array
          items:
            $ref: '#/components/schemas/DayOfYear'
          default: []
        accessForAllTimesEnabled:
          description: >-
            If set to true, access to the specified zones is enabled for all times.  If false, accessTimes define specific times for which access is allowed.
          type: boolean
        accessForAllZonesEnabled:
          description: >-
            If set to true, access is enabled for all zones.  If false, accessZones define specific zones for which access is allowed.
          type: boolean
        accessTimes:
          description: >-
            Access times during the week for which access is enabled. Optional. Default = none.
          type: array
          items:
            $ref: '#/components/schemas/AccessTime'
          default: []
        accessZones:
          description: >-
            Array of identifiers for zones person has access to.  Required.  Zones listed must NOT occur in any other accessZoneGroup.
          type: array
          items:
            type: string
          default: []
        escortCountAllowed:
          description: >-
            Number of escorts allowed.  Optional.  Default = 0.  Unlimited = -1.
          type: integer
          format: int64
    TimeOfDay:
      title: TimeOfDay
      type: object
      properties:
        endTime:
          description: >-
            local time of day string, e.g. '21:00'
          type: string
        startTime:
          description: >-
            local time of day string, e.g. '11:05'
          type: string
        accessMode:
          description: >-
            If set to other than "", defines access mode to be used for the access time.
            <br>Optional.  Default = "" (use default set at the access reader).
            <br>This accessMode does not take affect unless access reader is configure with default accessMode including all factors this access Mode.
            <br>Thus, accessModes used here must use a subset of authentication factors configured as the default on the access reader.
            <br>Possible values:
            <br>   "Face Recognition"
            <br>   "Face Recognition and Access Card"
            <br>   "Face Recognition and Mobile Credential"
            <br>   "Face Recognition and Mobile Credential / Access Card"
            <br>   "Face Recognition or Access Card"
            <br>   "Access Card"
          type: string
    AdminRolesRequest:
      type: object
      properties:
        roles:
          items:
            $ref: '#/components/schemas/Role'
          type: array
    AdminRolesResponse:
      type: object
      properties:
        roles:
          items:
            $ref: '#/components/schemas/Role'
          type: array
    Role:
      type: object
      properties:
        roleId:
          type: string
        privileges:
          type: array
          items:
            type: string
    AdminDirectoriesResponse:
      type: object
      properties:
        directories:
          type: array
          items:
            type: string
          description: list of directories active for tenant
    AdminSingleUserResponse:
      type: object
      properties:
        userId:
          type: string
          description: user id for login with X-RPC-AUTHORIZATION header
        tenantId:
          type: string
          description: tenant identifier
        licensor:
          type: boolean
          description: optional, field present and true when the user is licensor of the system and thus cannot be deleted.
        roles:
          type: array
          items:
            type: string
          description: roles assigned to user returned in descending order by the number of privileges contained in the role.
        privileges:
          type: array
          items:
            type: string
        whiteListDirectories:
          type: array
          items:
            type: string
          description: optional, list of directories to which the user has access.  No other directories are accessible.
    AdminUsersRequest:
      type: object
      properties:
        users:
          items:
            $ref: '#/components/schemas/AdminUserRequest'
          type: array
    AdminUsersResponse:
      type: object
      properties:
        users:
          items:
            $ref: '#/components/schemas/AdminUserResponse'
          type: array
    AdminUserResponse:
      type: object
      properties:
        userId:
          type: string
          description: user id for login with X-RPC-AUTHORIZATION header
        licensor:
          type: boolean
          description: optional, field present and true when the user is licensor of the system and thus cannot be deleted.
        tenantId:
          type: string
          description: 'tenant id used for grouping faces, data and configuration'
        roles:
          type: array
          items:
            type: string
          description: roles assigned to user returned in descending order by the number of privileges contained in the role.
        whiteListDirectories:
          type: array
          items:
            type: string
          description: optional, list of directories to which the user has access.  No other directories are accessible.
    AdminUserRequest:
      type: object
      properties:
        userId:
          type: string
          description: user id to used for login
        tenantId:
          type: string
          description: 'tenant id used for grouping faces, data and configuration'
        password:
          type: string
          description: >-
            plain text password to be used for login; will be hashed and stored
            in database.
        roles:
          type: array
          items:
            type: string
          description: optional, list roles assigned to user. ACCESS_PRIVILEGE required to modify this field.
        whiteListDirectories:
          type: array
          items:
            type: string
          description: optional, list of directories to which the user has access.  No other directories are accessible.  Provide an empty list to remove this property.  If null, ignored.  ACCESS_PRIVILEGE required to modify this field.
    AdminSystemConfigRequest:
      type: object
      properties:
        events:
          type: object
          properties:
            logRetentionDays:
              type: number
              format: int64
              description: >-
                Number of days to keep event logs
    AdminSystemConfigResponse:
      type: object
      properties:
        events:
          type: object
          properties:
            logRetentionDays:
              type: number
              format: int64
              description: >-
                Number of days to keep event logs
        cloudConnect:
          $ref: '#/components/schemas/CloudConnect'
    CloudConnect:
      type: object
      description: configuration of connection through cloud to SAFR Cloud services
      properties:
        enabled:
          description:  whether connection to SAFR Cloud is enabled
          type: boolean
        userId:
          description:  local userId enabled to connect to SAFR Cloud services.  Must be same userId in SAFR Signup.
          type: string
        password: 
          description:  password matching userId used for SAFR Signup.  Not present in GET /admin/system/config response; this may be set through PUT /admin/system/config.
          type: string
        cloudConnectServices:
          $ref: '#/components/schemas/CloudConnectServices'
    CloudConnectServices:
      type: object
      description: configuration of specific services connected through the SAFR Cloud
      properties:
        mobileCredentialInvites: 
          type: boolean
          description: enables or disables mobile credential invitations through SAFR Cloud services.
          default: false
    AdminUsageResponse:
      type: object
      properties:
        feeds:
          type: number
          format: int64
          description: >-
            Number of concurrent feeds used over the last hour.
        sites:
          type: number
          format: int64
          description: >-
            Number of concurrent sites used over the last hour.
        sources:
          type: number
          format: int64
          description: >-
            Number of concurrent sources used over the last hour.
        faces:
          type: number
          format: int64
          description: >-
            Number of faces in the db for this system.
        people:
          type: number
          format: int64
          description: >-
            Number of people in the db for this system.
        load:
          type: number
          format: float
          description: >-
            Recognitions per second over the last minute.
        latency:
          type: number
          format: int64
          description: >-
            Milliseconds of latency over the last minute for the system.
    AdminTenantUsageResponse:
      type: object
      properties:
        feeds:
          type: number
          format: int64
          description: >-
            Number of concurrent feeds used over the last hour.
        sites:
          type: number
          format: int64
          description: >-
            Number of concurrent sites used over the last hour.
        sources:
          type: number
          format: int64
          description: >-
            Number of concurrent sources used over the last hour.
        faces:
          type: number
          format: int64
          description: >-
            Number of faces in the db for this tenant.
        people:
          type: number
          format: int64
          description: >-
            Number of people in the db for this tenant.
        load:
          type: number
          format: float
          description: >-
            Recognitions per second over the last minute.
        latency:
          type: number
          format: int64
          description: >-
            Milliseconds of latency over the last minute for this tenant.
    AdminTenantLimitsRequest:
      type: object
      properties:
        maxSourcesAllowedPerHour:
          type: number
          format: int64
          description: >-
            Maximum number of sources allowed per hour.  0 means no limit.
        maxFacesAllowed:
          type: number
          format: int64
          description: >-
            Maximum number of recognized faces allowed stored in a tenant account.  0 means no limit.
        maxPersonsAllowed:
          type: number
          format: int64
          description: >-
            Maximum number of recognized people allowed stored in a tenant account.  0 means no limit.
        maxDirectoriesAllowed:
          type: number
          format: int64
          description: >-
            Maximum number of directories owned by a tenant.  0 means no limit.
        expDate:
          type: number
          format: int64
          description: >-
            Milliseconds since the epoch indicating date when license expires.  0 means no limit, 1 means revoked license.
    AdminTenantLimitsResponse:
      type: object
      properties:
        maxSourcesAllowedPerHour:
          type: number
          format: int64
          description: >-
            Maximum number of sources allowed per hour.  0 means no limit.
        maxFacesAllowed:
          type: number
          format: int64
          description: >-
            Maximum number of recognized faces allowed stored in a tenant account.  0 means no limit.
        maxPersonsAllowed:
          type: number
          format: int64
          description: >-
            Maximum number of recognized people allowed stored in a tenant account.  0 means no limit.
        maxDirectoriesAllowed:
          type: number
          format: int64
          description: >-
            Maximum number of directories owned by a tenant.  0 means no limit.
        expDate:
          type: number
          format: int64
          description: >-
            Milliseconds since the epoch indicating date when license expires.  0 means no limit, 1 means revoked license.
    ConfigTenantRequest:
      type: object
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantConfiguration'
    ConfigTenantResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantConfiguration'
    TenantConfiguration:
      type: object
      properties:
        tenantId:
          type: string
        eventArchiveTimeLimit:
          type: number
          format: int64
          description: >-
            deprecated. optional, life time of events in days.  Sets eventArchiveKnownIdentityTimeLimit and eventArchiveAnonymousTimeLimit if they're not passed.  Negative value
            indicates don't reap events.
        eventArchiveKnownIdentityTimeLimit:
          type: number
          format: int64
          description: >-
            optional, millisecond life time of events with a name.  Max(eventArchiveKnownIdentityTimeLimit, eventArchiveAnonymousTimeLimit) sets deprecated eventArchiveTimeLimit value.  Negative value
            indicates don't reap events.
        eventArchiveAnonymousTimeLimit:
          type: number
          format: int64
          description: >-
            optional, millisecond life time of events without a name.  Max(eventArchiveKnownIdentityTimeLimit, eventArchiveAnonymousTimeLimit) sets deprecated eventArchiveTimeLimit value.  Negative value
            indicates don't reap events.
        eventNotification:
          type: object
          properties:
            'type':
              type: string
              description: >-
                required. can be either 'sms' or 'centralSms'
            alertFrequencyInterval:
              type: number
              format: int64
              description: >-
                required. milliseconds between alerts
            phones:
              type: array
              items:
                type: string
              description: >-
                required. an array of at most 100 phone numbers in the E.164 format to be notified when a condition is met. e.g. "+12065551212", a valid phone number reachable from our AWS SNS service or client configured service.  See also CV Report Server documentation.
            enabled:
              type: boolean
              description: >-
                optional. defaults to true. setting to false keeps values in place but prevents alarms.
            conditions:
              type: array
              items:
                $ref: '#/components/schemas/EventNotificationCondition'
        operationSync:
          type: object
          description: >-
            Configures synchronization between a remote system's Virga and a the local Virga, allowing remote configuration and viewing of the local workers and their feeds
          properties:
            enabled:
              type: boolean
              description: >-
                whether to perform Operation Synchronization using the given configuration or skip it.
            videoViewingAllowed:
              type: boolean
              description: >-
                whether to allow remote system to view streams of local worker's feeds
            configAllowed:
              type:  boolean
              description: >-
                whether to allow remote systen to configure local worker processors and feeds
            host:
              type: string
              description: >-
                remote Virga host to which status will be relayed and from which configuration updates will be taken, e.g. virga.real.com.  https is assumed as the protocol scheme unless localhost is specified.  May be an ip address or dns name.
            port:
              type: number
              format: int32
              description: >-
                remote port used in sync.
            cvosHost:
              type: string
              description: >-
                remote object server ip address or hostname.
            coviPort:
              type: number
              format: int32
              description: >-
                remote port used in to connect to remote object server.
            userId:
              type: string
              description: >-
                remote user Id.
            password:
              type: string
              description: >-
                remote password, encrypted when stored; used internally and never returned in an API.
        peopleSync:
          type: object
          description: >-
            Configures synchronization of identities between a remote system and a local system.  Can be used  to copy identities between two tenants on the same system.  There are no safeguards in place to prevent copying onto to the source tenant-directory pair on this system. 
          properties:
            enabled:
              type: boolean
              description: >-
                whether to perform Identity Synchronization using the given configuration or skip it.
            host:
              type: string
              description: >-
                remote host from which identities will be pulled and to which identities will be pushed. e.g. covi.real.com.  https is assumed as the protocol scheme unless localhost is specified.  May be an ip address or dns name.
            port:
              type: number
              format: int32
              description: >-
                remote port used in sync.
            cvosHost:
              type: string
              description: >-
                remote object server ip address or hostname used for copying images associated with identities.
            coviPort:
              type: number
              format: int32
              description: >-
                remote port used in to connect to remote object server.
            userId:
              type: string
              description: >-
                remote user Id.
            password:
              type: string
              description: >-
                remote password, encrypted when stored; used internally and never returned in an API.
            mode:
              type: string
              description: >-
                valid values are 'bidirectional' and 'fromHostOnly'.  null or empty defaults to 'fromHostOnly'
            merge:
              type: boolean
              description: >-
                when true, identities without names will be merged with existing identities after sync
        eventSync:
          type: object
          description: >-
            Configures archiving of events to a remote directory from a local directory.  Events are pushed to the remote directory every 20 seconds unless expedited which are sent more frequently.  There are no safeguards in place to prevent copying onto to the source tenant-directory pair on this system. 
          properties:
            enabled:
              type: boolean
              description: >-
                whether to perform Event Archiving using the given configuration or skip it.
            personTypes:
              type: array
              items:
                type: string
              description: >-
                Person type attributes to include in archive sync, e.g. staff, guest, admin
            idClasses:
              type: array
              items:
                type: string
              description: >-
                Id Classes to include in archive sync, e.g. unidentified, stranger, noconcern, concern, threat
            sinceEventTime:
              type: number
              format: int64
              description: >-
                earliest since time; epoch time in milliseconds.
            expediteRecognizedEvents:
              type: boolean
              description: >-
                if true, send events where idClass field is concern, threat or noconcern; if the recognized person's idClass is noconcern either the name, groups or personType fields must be non-empty for the event to be included in the expedited events group that's synched more frequently.  Default value is false.     
            host:
              type: string
              description: >-
                remote host from which identities will be pulled and to which identities will be pushed. e.g. covi.real.com.  https is assumed as the protocol scheme unless localhost is specified.   May  be an ip address or dns name.
            port:
              type: number
              format: int32
              description: >-
                remote port used in sync.
            cvosHost:
              type: string
              description: >-
                remote object server ip address or hostname used for copying images associated with events.
            coviPort:
              type: number
              format: int32
              description: >-
                remote port used in to connect to remote object server.
            userId:
              type: string
              description: >-
                remote user Id.
            password:
              type: string
              description: >-
                remote password, encrypted when stored; used internally and never returned in an API.
        personRetentionLimits:
          type: array
          items:
            $ref: '#/components/schemas/PersonRetentionLimit'
        publicSharing:
          type: object
          description: >-
            Object holding collection of categories of public sharing and their parameters
          properties:
            categories:
              type: array
              items:
                $ref: '#/components/schemas/PublicSharingCategory'
    PublicSharingCategory:
      type: object
      properties:
        name:
          type: string
          description: >-
            name of the category
    EventNotificationCondition:
      type: object
      properties:
        field:
          type: string
          description: >-
            required. possible values include "measuredTemp", "actualTemp, "envTemp", "refEnvTemp", "rawMeasuredTemp", "measuredAltTemp", "rawMeasuredAltTemp", "objTemp", "refObjTemp", "mask", "actualMask"
        maxValue:
          type: number
          format: float
          description: >-
            optional.  if "field" is configured and is a floating point number, events with a field value greater than this will trigger an alert SMS to configured phone. e.g. this value would represent a max floating point Centigrade value if the "field" attribute was set to "measuredTemp".
        minValue:
          type: number
          format: float
          description: >-
            optional.  if "field" is configured and is a floating point number, events with a field value greater than this will trigger an alert SMS to configured phone. e.g. this value would represent a min floating point Centigrade value if the "field" attribute was set to "measuredTemp".
        bValue:
          type: boolean
          description: >-
            optional.  if "field" is configured and is a boolean, events with a field value matching this will trigger an alert SMS to configured phone.  e.g. if "field" is set to "mask" and this value "bValue" is set to false, events posted where "mask" is false will trigger an SMS alert.
        source:
          type: string
          description: >-
            optional. this field filters events to trigger events only on the configured source events.  Possible values include any valid source name, e.g. "Front Entrance"
        site:
          type: string
          description: >-
            optional. this field filters events to trigger events only on the configured site events.  Possible values include any valid site name, e.g. "RealNetworks Headquarters"
        message:
          type: string
          description: >-
            required. a message format to sent in SMS; this format may contain placeholders anchored by '#' symbol referencing any of the possible values for 'field' or site or source.  e.g. "An event
              at #site #source recorded #measuredTemp degrees Centigrade and mask was recorded as #mask"
    PersonRetentionLimit:
      type: object
      properties:
        retentionDuration:
          type: number
          format: int64
          description: 'required, time in milliseconds person will be retained in the DB'
        directories:
          type: array
          items:
            type: string
          description: >-
            optional, directories to which retentionDuration applies. If not
            specified, applies to all directories
        personTypes:
          type: array
          items:
            type: string
          description: >-
            optional, person types to which retentionDuration applies. If not
            specified, applies to all personTypes. "" indicates the without
            assigned personTypes
        hasName:
          type: boolean
          description: >-
            optional, indicates if retentionDuration applies to those with or
            without name. If not specified,  applies to those with and without
            names.
        hasExternalId:
          type: boolean
          description: >-
            optional, indicates if retentionDuration applies to those with or
            without externalId. If not specified, applies to those with and
            without exteralId
    PutObjectRequest:
      type: object
      properties:
        idClass:
          type: string
          description: >-
            case-sensitive, one of the following (noconcern, concern, stranger,
            threat, unidentified).
        enabled:
          type: boolean
          description: whether or not attribute is eligible for recognition.
    GetObjectTypesResponse:
      type: object
      required:
        - objectTypes
      properties:
        objectTypes:
          items:
            type: string
            description: >-
              Name of the object types, e.g. 'common' for common objects,
              'firearm' for objects that can be classified as firearms.
          type: array
    GetObjectResponse:
      type: object
      required:
        - objects
      properties:
        objects:
          items:
            $ref: '#/components/schemas/KnownObject'
          type: array
    KnownObject:
      type: object
      required:
        - objectId objectType
      properties:
        objectId:
          description: 'an object identifier, e.g. airplane, banana, cat'
          type: string
        objectType:
          description: >-
            an abstract classifier of an object, e.g. 'common' indicating a
            common object or 'firearm' indicating a type of firearm
          type: string
          default: common
        idClass:
          description: >-
            case-sensitive, one of the following (noconcern, concern, stranger,
            threat, unidentified).
          type: string
          default: noconcern
        enabled:
          description: whether recognition is enabled for this particular object
          type: boolean
          default: true
    PostObjectResponse:
      type: object
      required:
        - detectedObjects
      properties:
        detectedObjects:
          items:
            $ref: '#/components/schemas/DetectedObject'
          type: array
    DetectedObject:
      type: object
      properties:
        objectId:
          description: 'an object identifier, e.g. airplane, banana, cat'
          type: string
        objectType:
          description: >-
            an abstract classifier of an object, e.g. 'common' indicating a
            common object or 'firearm' indicating a type of firearm
          type: string
          default: common
        idClass:
          description: >-
            case-sensitive, one of the following (noconcern, concern, stranger, threat, unidentified).
          type: string
        confidence:
          description: >-
            Degree of certainty that face is correctly detected. Populates range
            [0, 1].
          type: number
          format: float
        offsetX:
          description: >-
            a number between 0 and 1 representing the horizontal position of the
            top-left corner of the detected face bounding box as a fraction of
            the provided image width.
          example: '0.1432'
          type: number
          format: float
        offsetY:
          description: >-
            a number between 0 and 1 representing the vertical position of the
            top-left corner of the detected face bounding box as a fraction of
            the provided image height.
          example: '0.5244'
          type: number
          format: float
        relativeWidth:
          description: >-
            a number between 0 and 1 representing the width of the detected face
            bounding box as a fraction of the provided image width.
          example: '0.2333'
          type: number
          format: float
        relativeHeight:
          description: >-
            a number between 0 and 1 representing the height of the detected
            face bounding box as a fraction of the provided image height.
          example: '0.1234'
          type: number
          format: float
        detectionVersion:
          description: ' Identifies face detection method used.'
          type: number
          format: int64
    GetImageKeyResponse:
      required:
        - key
      properties:
        key:
          description: >-
            base64 string representation of 256 bit key to be used to decrypt
            images with ehttps scheme in their urls.
          type: string
      type: object
    GetPersonResponse:
      description: >-
        List of identities returned from GET /people/{personId} that match the person with the {personId} in the path.
      required:
        - people
      properties:
        people:
          items:
            $ref: '#/components/schemas/PersonWithAttributes'
          type: array
      type: object
    GetPeopleResponse:
      description: >-
        List of identities returned from GET /people. Deprecated.
      required:
        - people
      properties:
        people:
          items:
            $ref: '#/components/schemas/Person'
          type: array
      type: object
    GetMergedPeopleResponse:
      description: >-
        List of identities returned from GET /mergedpeople/{personId} that match the person with the {personId} in the path.
      required:
        - people
      properties:
        people:
          items:
            $ref: '#/components/schemas/Person'
          type: array
      type: object
    GetExternalPeopleResponse:
      description: >-
        List of identities returned from GET /people/external/{externalId} that match the person with the {externalId} in the path.
      required:
        - people
      properties:
        people:
          items:
            $ref: '#/components/schemas/Person'
          type: array
      type: object
    GetPaginatedPeopleResponse:
      description: >-
        Paged response with a list of people and a paging info object returned from GET /rootpeople
      required:
        - people
      properties:
        people:
          items:
            $ref: '#/components/schemas/RootPerson'
          type: array
        personCollectionResponse:
          description: >-
            Object describing paging of people response
          properties:
            startIndex:
              description: Starting index of the persons in the response.
              type: number
            nextIndexState:
              description: Smart cursor to be used with subsequent queries passed as startIndexState.  See totalCount
              type: string    
            countReturned:
              description: Number of people returned in response.
              type: number
            totalCount:
              description: >-
                Total number of people available to be returned. If absent, continue callingAPI passing ?startIndexState=nextIndexState
              type: number
          type: object
      type: object
    ImageURIMixin:
      type: object
      properties:
        imageURI:
          description: a url to a best hosted image from all the merged person's representative faces.
          type: string
    UnmergedImageURIMixin:
      type: object
      properties:
        unmergedImageURI:
          description: a url to a hosted image of the person's representative
            face. Its provided only if it differs from the imageURI.
          type: string
    UnmergedImageURIRootMixin:
      type: object
      properties:
        unmergedImageURI:
          description: a url to a hosted image of the person's representative
            face.
          type: string
    Person:
      type: object
      allOf:
        - $ref: '#/components/schemas/ImageURIMixin'
        - $ref: '#/components/schemas/UnmergedImageURIMixin'
        - $ref: '#/components/schemas/RecognizedPerson'
    RecognizedPerson:
      required:
        - personId
      properties:
        personId:
          description: >-
            an identifier assigned when a person's face is first recognized for
            an account.
          type: string
        externalId:
          description: an id associated with a user through the Update Person API.
          type: string
        rootPersonId:
          description: Globally unique identifier associated with an identity represented by person record. If not present, it is implicitly equal to personId of the root person record. The personId of the root person record is equal to mergedWith value if set and to personId if mergedWith is not set.
          type: string
        idClass:
          type: string
          description: >-
            case-sensitive, one of the following (noconcern, concern, stranger, threat, unidentified).
        validationPhone:
          description: >-
            phone number that can be used to confirm identity of the person as a
            part of multi-factor identification scheme.
          type: string
        validationEmail:
          description: email used to validate the user.
          type: string
        homeLocation:
          description: identified person location information.
          type: string
        name:
          description: name of the person (deprecated , use firstName and lastName).
          type: string
        firstName:
          description: given first name of the person.
          type: string
        lastName:
          description: given last name of the person.
          type: string
        moniker:
          description: alernate name.
          type: string
        company:
          description: company which person is associated with.
          type: string
        groups:
          description: list of group names in which the person is a member.
          items:
            type: string
          type: array
        tags:
          description: arbitrary tags that may be set via Update Person API.
          items:
            type: string
          type: array
        ignore:
          description: >-
            a flag that may be set via Update Person API, also set when person's
            faces do not meet minimum criteria.
          type: boolean
        gender:
          description: gender of the identified face.
          type: string
        genderEstimated:
          description: indicates if the gender was estimated by the model or if entered explicitly.
          type: boolean
        personType:
          description: person type assigned with the Update Person API.
          type: string
        age:
          description: estimated age of the person to whom this face belongs.
          type: number
          format: float
          example: 12.3456
        dateOfBirth:
          description: date of birth of the person in format YYYY-MM-DD, YYYY-MM or YYYYY.
          type: string
          example: "1970-07-17"
        dateOfBirthEstimated:
          description: indicates if the date of birth was estimated by the model or if entered explicitly.
          type: boolean
        dateOfBirthAccuracy:
          description: D indicates YYYY-MM-DD, M indicates YYYY-MM Y indicates YYYYY and A indicates aproximate dateOfBirth accuracy.
          type: string
        occurrence:
          description: count of the times this person has been recognized.
          type: number
        lastOccurrenceDate:
          description: Unix Epoch time in milliseconds since person last seen.
          type: number
          format: int64
        rootPersonAddDate:
          description: >-
            Unix Epoch time in milliseconds since root person was added to the
            system.
          type: number
          format: int64
        expDate:
          description: >-
            Unix Epoch time in milliseconds identifying when person record is
            expiring  and will not be available for recognition. The date is
            Unix Epoch in miliseconds.
          type: number
          format: int64
        addDate:
          description: >-
            Unix Epoch time in milliseconds identifying when person record was created. The date is
            Unix Epoch in miliseconds.
          type: number
          format: int64
        modDate:
          description: >-
            Unix Epoch time in milliseconds identifying when person record was updated. The date is
            Unix Epoch in miliseconds.
          type: number
          format: int64
        addedByUserId:
          description: userId that added this person record.
          type: string
        modifiedByUserId:
          description: userId that last modified this person record.
          type: string
        addedAtSite:
          description: site where this person record was created.
          type: string
        modifiedAtSite:
          description: site where this person record was last modified.
          type: string
        addedAtSource:
          description: source where this person record was created.
          type: string
        modifiedAtSource:
          description: source where this person record was last modified.
          type: string
        mergedWith:
          description: personId of another person the identified person is merged with making this personId an alternate representation of mergedWith identity. This attribute is synonymous to rootPersonId present in newer APIs.
          type: string
        hasMergedPeople:
          description: >-
            Indicator if the root person has merge people. This value is
            provided only in the GET rootpeople API
          type: boolean
        similarityScore:
          description: >-
            Match percentage. Range is from zero to above one. 100% (value 1.0)
            means that distance between face matches the thershold exactly.
            100.23% (value 1.0023) means distance between faces is smaller than
            the threshold. 97.63% (value 0.9763) means distance between faces is
            larger than the threshold.
          type: number
        sentiment:
          description: 'estimated person sentiment. Populates range [-1, 1]'
          type: number
          format: float
          example: -0.12345
        hasInvalidSignature:
          description: >-
            Representative face has the same signature version if this is set to true.
          type: boolean
        hasFaceId:
          type: boolean
          description: >-
            Default value is null, equivelent with true.  Set to false if no faceId.  Read-only value
        inviteAccountRole:
          type: string
          description: >-
            "none", "User" or "Host".  Indicates the role given to the attached invite account. Optional. Default = "none".
            <br/>If set to other than "none", indicates that person has invite account attached to rootPersonId associated with this person record.
        accessCardId:
          type: string
          description: >-
            Physical Access Card System identifier - normally a number.
            <br/>This is encoded together with accessCardId to produce Wiegand access card data sent to Access Control System.
            <br/>Encoding can vary and is system dependent.
            <br/>Standard 26-bit encoding format is commonly used.
        accessFacilityId:
          type: string
          description: >-
            Physical Access Card System facility id - normally a number.
        accessCardFormat:
          type: string
          description: >-
            "Wiegand-26", optional, default="Wiegand-26"
            <br/> Defines method buy which accessCardId and accessFacilityId need to be encoded for sending to Access Control System
            <br/>"Wiegand-26" refers to standard 26-bit Wiegand format.
            <br/>Many other formats exist.  Some are individualized per corporation (e.g. Corporate 1000).
            <br/>This string will be structured to define specifics of the encoding.
        accessOrigin:
          type: string
          description: >-
            "lenel", "genetec", ... ; optional; When this property is not present, means SAFR is origin.
        accessOriginModDate:
          type: integer
          description: >-
            epoch time access information was last modified in the external Access Control System; optional
        accessOriginSyncDate:
          type: integer
          description: >-
            epoch time access information was last modified in the external Access Control System; optional
        accessClearance:
          type: string
          description: >-
            Access clearance name.
        accessClearanceLevel:
          type: integer
          format: int64
          description: >-
            Used for ordering clearance ids from most to least restrictive. In range from -1 to 100.
            <br/>-1 = Banned        (cannot be invited)
            <br/>0 = Guest         (can be invited)
            <br/>100 = Unlimited     (full access)
            <br/>Operator can set access clearance levels 1..99.
            <br/>The higher the clearance level, the less restrictive it is.
        accessActivatedUntil:
          type: integer
          format: int64
          description: >-
            epoch time until access is activated; 0 = indefinite (default), -1 = disabled, > 0 up to specified time; optional
        notes:
          description: 1000 unicode characters max
          type: string
        notesLastModDate:
          description: Epoch date time when notes were last modified
          type: integer
          format: int64
        notesLastModifiedBy:
          description: User Id which last edited notes
          type: string
        hasNotes:
          description: Indicates if person record has notes associated.
          type: boolean
        docs:
          type: array
          items:
            $ref: '#/components/schemas/AccessDocument'
        hasDocs:
          description: Indicates if person record has documents associated.
          type: boolean
        mobileCredentialId:
          description:  >-
              Holds mobile credential id. Default value is  ""; Interpretation of the string depends on the format.
              For PKOC format, mobile credential is standard base64 encoded 33 byte (257 bit) ECC (Eliptic Curve Cryptography) public key.
          type: string
        mobileCredentialFormat:
          description:   >-
              Indicates mobile credential format.  Default: "PKOC"  (if not set or set top "", PKOC is implied)
              <br>Defined values:
              <br>PKOC
              <br>FIDO
          type: string
        mobileCredentialInviteId:
          type: string
          description:   >-
            Pending mobile credential invitation id
        mobileCredentialInviteURL:
          type: string
          description:   >-
            Pending mobile credential invitation URL which can be used to respond to the invite
        mobileCredentialInviteDate:
          type: integer
          format: int64
          description:   >-
            Milliseconds since the epoch, indicating the date-time when the invitation was posted
        mobileCredentialInviteExpDate:
          type: integer
          format: int64
          description:   >-
            Milliseconds since the epoch, indicating the date-time when the invitation will expire
        mobileCredentialInviteByUserId:
          type: string
          description:   >-
            UserId of the configured user that posted the inviation
        mobileCredentialInviteResponse:
          type: string
          description:   >-
            Either 'accepted' or 'declined' if present, indicating  the response to the last mobile invitation
        mobileCredentialInviteRespDate:
          type: integer
          format: int64
          description:   >-
            Milliseconds since the epoch, indicating date-time of acceptance or decline of mobile invitation
    PersonWithAttributes:
      description: >-
        All the attributes of a recognized person with the attributes of the representative face concatenated under the attributes property.
      type: object
      allOf:
        - $ref: '#/components/schemas/Person'
      properties:
        attributes:
          $ref: '#/components/schemas/PersonFaceAttributes'
    SimilarPersonFaceAttributes:
      allOf:
        - $ref: '#/components/schemas/PersonFaceAttributesBase'
      description: Attributes of the similar face. Provided only when verbose mode used.
    PersonFaceAttributes:
      allOf:
        - $ref: '#/components/schemas/PersonFaceAttributesBase'
      description: Attributes of the representative face for this person.
    PersonFaceAttributesBase:
      type: object
      properties:
        centerPoseQuality:
          description: 'Center Pose Quality in representative image. Populates range [0, 1]'
          type: number
          format: float
          example: 0.12345
        sharpnessQuality:
          description: 'Sharpness Quality in representative image. Populates range [0, 1]'
          type: number
          format: float
          example: 0.12345
        contrastQuality:
          description: 'Contrast Quality in representative image. Populates range [0, 1]'
          type: number
          format: float
          example: 0.12345
        profilePoseConfidence:
          description: 'Confidence in the boolean setting profile pose in representative image. Populates range [0, 1]'
          type: number
          format: float
          example: 0.12345
        profilePose:
          description: >-
            Indicator whether face in the representative image is in profile.
          type: boolean
        occlusion:
          description: 'Confidence that the face in the representative image is occluded. Populates range [0, 1]'
          type: number
          format: float
          example: 0.12345
        mask:
          description: >-
            Indicator whether face in the representative has a mask.
          type: boolean
        faceConfirmed:
          description: >-
            Indicator whether face in the representative image is detected.
          type: boolean
    RootPerson:
      description: >-
        A root person with an unmergedImageURI.
      allOf:
        - $ref: '#/components/schemas/UnmergedImageURIRootMixin'
        - $ref: '#/components/schemas/RecognizedPerson'
        - type: object
          required:
            - personId
          properties:
            personId:
              description: >-
                an identifier assigned when a person's face is first recognized for
                an account.
              type: string
    AccessDocument:
      type: object
      properties:
        docId:
          type: string
          description: document GUID
        title:
          type: string
          description: name of the document
        fileName:
          type: string
          description: name of the file including extension
        contentType:
          type: string
          description: mime type of document stored in CVOS
        addDate:
          type: integer
          format: int64
          description: epoch date time when document was added
        addedBy:
          type: string
          description: identity of user that added document
    SubmitPhotoResponse:
      required:
        - identifiedFaces
      properties:
        identifiedFaces:
          items:
            $ref: '#/components/schemas/IdentifiedFace'
          type: array
        accountUpdated:
          description: indicator if account state has been changed.
          type: boolean
        detectionTime:
          description: indicates how long the face detection process took in miliseconds.
          type: number
      type: object
    IdentifiedFace:
      properties:
        personId:
          description: >-
            an identifier assigned when a person's face is first recognized for
            an account.
          type: string
        newId:
          description: True if the face belongs to a new person.
          type: boolean
        externalId:
          description: an id associated with a user through the Update Person API.
          type: string
        rootPersonId:
          description: Globally unique identifier associated with an identity represented by person record. If not present, it is implicitly equal to personId of the root person record; personId of the root person record is equal to mergedWith value if set and to personId if mergedWith is not set.
          type: string
        name:
          description: >-
            name of the person, returned if the face corresponds to an existing
            person with metadata.
          type: string
        firstName:
          description: given first name of the person.
          type: string
        lastName:
          description: given last name of the person.
          type: string
        gender:
          description: gender of the identified face.
          type: string
        genderEstimated:
          description: indicates if the gender was estimated by the model or if entered explicitly.
          type: boolean
        age:
          description: estimated age of the person to whom this face belongs.
          type: number
          format: float
          example: 12.3456
        dateOfBirth:
          description: date of birth of the person in format YYYY-MM-DD, YYYY-MM or YYYYY.
          type: string
          example: "1970-07-17"
        dateOfBirthEstimated:
          description: indicates if the date of birth was estimated by the model or if entered explicitly.
          type: boolean
        dateOfBirthAccuracy:
          description: >-
            'D' indicates YYYY-MM-DD, 'M' indicates YYYY-MM, 'Y' indicates YYYYY and 'A' indicates approximate dateOfBirth accuracy.
          type: string
        sentiment:
          description: 'estimated person sentiment. Populates range [-1, 1]'
          type: number
          format: float
          example: -0.12345
        smile:
          description: detects smile.
          type: boolean
        groups:
          description: list of group names in which the person is a member.
          items:
            type: string
          type: array
        tags:
          description: arbitrary tags that may be set via Update Person API.
          items:
            type: string
          type: array
        ignore:
          description: >-
            a flag that may be set via Update Person API, not used for
            processing at this time.
          type: boolean
        idClass:
          description: >-
            case-sensitive, one of the following (noconcern, concern, stranger,
            threat, unidentified).
          type: string
          default: noconcern
        mergedWith:
          description: personId of another person the identified person is merged with making this personId an alternate representation of mergedWith identity. This attribute is synonymous to rootPersonId present in newer APIs.
          type: string
        mediaId:
          description: an identifier for the given media.
          type: string
        offsetX:
          description: >-
            a number between 0 and 1 representing the horizontal position of the
            top-left corner of the detected face bounding box as a fraction of
            the provided image width.
          example: '0.1432'
          type: number
          format: float
        offsetY:
          description: >-
            a number between 0 and 1 representing the vertical position of the
            top-left corner of the detected face bounding box as a fraction of
            the provided image height.
          example: '0.5244'
          type: number
          format: float
        relativeWidth:
          description: >-
            a number between 0 and 1 representing the width of the detected face
            bounding box as a fraction of the provided image width.
          example: '0.2333'
          type: number
          format: float
        relativeHeight:
          description: >-
            a number between 0 and 1 representing the height of the detected
            face bounding box as a fraction of the provided image height.
          example: '0.1234'
          type: number
          format: float
        rootPersonAddDate:
          description: >-
            Unix Epoch time in milliseconds since root person was added to the
            system.
          type: number
          format: int64
        expDate:
          description: >-
            Unix Epoch time in milliseconds identifying when person record is
            expiring  and will not be available for recognition.
          type: number
          format: int64
        occurrence:
          description: count of the number of times this person has been seen.
          type: number
        lastOccurrenceDate:
          description: Unix Epoch date that this person has been last seen.
          type: number
          format: int64
        similarityScore:
          description: >-
            Match percentage. Range is from zero to above one. 100% (value 1.0)
            means that distance between face matches the thershold exactly.
            100.23% (value 1.0023) means distance between faces is smaller than
            the threshold. 97.63% (value 0.9763) means distance between faces is
            larger than the threshold.
          type: number
        attributes:
          $ref: '#/components/schemas/Attributes'
        similar:
          items:
            $ref: '#/components/schemas/SimilarMatch'
          type: array
      type: object
    Attributes:
      properties:
        provider:
          description: The internal image recognition provider technology.
          example: RCV
          type: string
        age:
          $ref: '#/components/schemas/Age'
        gender:
          $ref: '#/components/schemas/Gender'
        dimension:
          $ref: '#/components/schemas/Dimensions'
        landmarks:
          $ref: '#/components/schemas/Landmarks'
        confidence:
          description: >-
            Degree of certainty that face is correctly detected. Populates range
            [0, 1].
          type: number
          format: float
        detectionVersion:
          description: ' Identifies face detection method used.'
          type: number
          format: int64
        centerPoseQuality:
          description: >-
            Estimation of pose suitability for face recognition. Populates range
            [0, 1].
          type: number
          format: float
        sharpnessQuality:
          description: 'Face sharpness metric. Populates range [0, 1]'
          type: number
          format: float
        contrastQuality:
          description: ' Key face areas contrast metric. Populates range [0, 1]'
          type: number
          format: float
        occlusion:
          description: 'A value between zero and one [0.0 - 1.0] that indicates the certainty that face is occluded.  Occlusion constitutes covering of the facial features that prevent or diminish accurate recognition.  In general, greater the occlusion, the greater the occlusion confidence. '
          type: number
          format: float
        mask:
          description: >-
            Indicator whether face in the representative has a mask.
          type: boolean
        maskConfidence:
          description: 'confidence of mask detection result. Populates range [0, 1]'
          type: number
          format: float
          example: 0.95
        maskModel:
          description: identifies which mask model was used to detect mask.
          type: string
        profilePose:
          description: 'when true, indicates that the face is in profile, beyond a threshold.'
          type: boolean
        profilePoseConfidence:
          description: 'Degree of certrainty that the face is in profile; Populates range [0, 1]'
          type: number
          format: float
        faceConfirmed:
          description: 'Confirmation that the face detected is a face.  Guard against false positives.'
          type: boolean
        liveness:
          $ref: '#/components/schemas/Liveness'
      type: object
    Age:
      properties:
        age:
          type: number
          format: float
          description: 'Number representing detected age of the person detected.'
        confidence:
          description: >-
            Degree of certainty that age is correctly detected. Populates range
            [0, 1].
          type: number
          format: float
    Gender:
      properties:
        gender:
          description: 'String "male" or "female"'
          type: string
        confidence:
          description: >-
            Degree of certainty that gender is correctly detected. Populates range
            [0, 1].
          type: number
          format: float
    Landmarks:
      properties:
        right-eye-center:
          $ref: '#/components/schemas/Coordinates'
        nose-tip:
          $ref: '#/components/schemas/Coordinates'
        left-eye-center:
          $ref: '#/components/schemas/Coordinates'
        right-mouth-corner:
          $ref: '#/components/schemas/Coordinates'
        left-mouth-corner:
          $ref: '#/components/schemas/Coordinates'
      type: object
    Dimensions:
      properties:
        height:
          description: >-
            the height of the detected face bounding box in pixels as found in
            provided image.
          type: number
          format: int64
        width:
          description: >-
            the width of the detected face bounding box in pixels as found in
            provided image.
          type: number
          format: int64
      type: object
    Coordinates:
      properties:
        x:
          description: >-
            a number between 0 and 1 representing horizontal position relative
            to the upper-left corner of detected face bounding box as a fraction
            of detected face bounding box width.
          example: '0.1234'
          type: number
          format: float
        'y':
          description: >-
            a number between 0 and 1 representing vertical position relative to
            the upper-left corner of detected face bounding box as a fraction of
            detected face bounding box height.
          example: '0.4355'
          type: number
          format: float
      type: object
    Liveness:
      properties:
        livenessConfirmed:
          type: boolean
          description: 'Suggested conclusion of liveness based on server configured confidence threshold.'
        confidence:
          description: >-
            Degree of certainty that liveness is correctly detected. Populates range
            [0, 1].
          type: number
          format: float
    SimilarMatch:
      properties:
        personId:

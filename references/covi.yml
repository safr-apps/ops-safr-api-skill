          type: string
        age:
          description: >-
            age of the person set via the Update Person API and returned in the
            GetPeopleResponse via the Get People API.
          type: string
        dateOfBirth:
          description: >-
            date of birth of the person in format YYYY-MM-DD, YYYY-MM or YYYYY.
          type: string
          example: "1970-07-17"
        gender:
          description: >-
            gender of the person set via the Update Person API and returned in
            the GetPeopleResponse via the Get People API. The valid values are male, female or unknown.
          type: string
        externalId:
          description: >-
            external id of the person set via the Update Person API and returned
            in the GetPeopleResponse via the Get People API.
          type: string
        rootPersonId:
          description: Globally unique identifier associated with an identity represented by person record. If not present, it is implicitly equal to personId of the root person record; personId of the root person record is equal to mergedWith value if set and to personId if mergedWith is not set.
          type: string
        validationPhone:
          description: >-
            phone number that can be used to confirm identity of the person as a
            part of multi-factor identification scheme.
          type: string
        validationEmail:
          description: email used to validate the user.
          type: string
        homeLocation:
          description: identified person location information.
          type: string
        personType:
          description: >-
            personType of the person set via the Update Person API and returned
            in the GetPeopleResponse via the Get People API.
          type: string
        moniker:
          description: alernate name.
          type: string
        company:
          description: company which person is associated with.
          type: string
        idClass:
          description: >-
            case-sensitive, one of the following: noconcern, concern, stranger,
            threat, unidentified.
          type: string
        registrationSource:
          description: >-
            source associated with the person modification change.
          type: string
        registrationSite:
          description: >-
            site associated with the person modification change.
          type: string
        expDate:
          description: Expiration date of the person in Unix Epoch time in miliseconds.
          type: number
          format: int64
        groups:
          description: add this person to this list of groups
          type: array
          items:
            type: string
        inviteAccountRole:
          description: >-
            "none", "User" or "Host".  Indicates the role given to the attached invite account. Optional. Default = "none". If set to other than "none", indicates that person has invite account attached to rootPersonId associated with this person record.
          type: string
        hasFaceId:
          description: >-
            Ignored  when set to true.  When set to false, any face records associated with this person are deleted!
          type: boolean
        accessCardId:
          description: >-
            Physical Access Card System identifier - normally a number
            <br/>This is encoded together with accessFacilityId to produce Wiegand access card data sent to Access Control System.
            <br/>Encoding can vary and is system dependent.
            <br/>Standard 26-bit encoding format is commonly used.
          type: string
        accessFacilityId:
          description: Physical Access Card System facility id - normally a number.
          type: string
        accessCardFormat:
          description: >-
            "Wiegand-26", optional, default="Wiegand-26"
          type: string
          default: "Wiegand-26"
        accessOrigin:
          description: >-
            "lenel", "genetec"... ; optional; When this property is not present, means SAFR is origin.
            <br/>Identifier for Access Control System from which access control data was imported. 
            <br/>This identifier is normally present only when access information is synced from external Access Control System
            <br/>This property must be present when information is synced from external Access Comtrol System.
            <br/>Legacy sync integration with Genetec card holders uses tags to record origin of the record.
          type: string
        accessOriginModDate:
          description: >-
            Milliseconds since epoch, time access information was last modified in the external Access Control System; optional
          type: number
          format: int64
        accessOriginSyncDate:
          description: >-
            Milliseconds since epoch, time access information was last synced from the external Access Control System; optional
          type: number
          format: int64
        accessClearance:
          description: >-
            'Name of the access clearance assigned to this person.  One of "Unlimited", "Guest", "Banned" or configured custom clearance (e.g. "User"); optional; default = implies none set
            <br/>It must set to other other than "Banned" for access privileges to be honored.
            <br/>Person with "Banned" access clearance cannot be issued "Guest" access clearance through invitation.
            <br/>Even if person record has confirmed invitations, access per invitations will be only honored if access clearance is set to other than "Banned".'
          type: string
        accessActivatedUntil:
          description: >-
            Milliseconds since epoch, time until access is activated, 0 = indefinite (default), -1 = disabled, > 0 up to specified time; optional.
          type: number
          format: int64
        mobileCredentialId:
          description:  >-
            Holds mobile credential id. Default value is  ""; Interpretation of the string depends on the format.
            For PKOC format, mobile credential is standard base64 encoded 33 byte (257 bit) ECC (Eliptic Curve Cryptography) public key.
          type: string
        mobileCredentialFormat:
          description:   >-
            Indicates mobile credential format.  Default: "PKOC"  (if not set or set top "", PKOC is implied)
            <br>Defined values:
            <br>PKOC
            <br>FIDO
          type: string
        notes:
          description: >-
            1000 unicode characters max.  This property is returned only in person record details call for specific person id.  Notes are provided directly in the DB to facilitate seraching.
          type: string
        docs:
          description: >-
            Contains list of associated documents. 30 docs max. This property is returned only in person record details call for specific person id.
          type: array
          items:
            $ref: '#/components/schemas/AccessDocument'

openapi: 3.0.0
servers: []
info:
  description: >-
    The SAFR Computer Vision REST API enables face detection, face recognition and
    management of recognized persons and faces.  Additional interfaces provide object recognition,  configuration and user management.<br/><br/><h3>Definitions</h3>
    <li>Tenant: top level ownership entity. Multiple users and directories may exist within a tenant.</li>
    <li>Directory: a partition of data (faces, people, objects and events) within a tenant. The 'X-RPC-DIRECTORY' header specifies the directory.</li>
    <li>Site: a location where recognition occurs.</li>
    <li>Source: a camera, video stream, video file or image on which recognition occurs.</li>
  title: SAFR Computer Vision REST API
  contact:
    name: safr-feedback@realnetworks.com
    email: safr-feedback@realnetworks.com
  version: 3.21.1022
paths:
  /people:
    post:
      description: >-
        Upload and perform facial recognition operations, matching against a known person, providing summary information and similarity of faces to reference person.
        Note that the headers describing a person, (e.g. X-RPC-PERSON-TYPE, X-RPC-PERSON-NAME, X-RPC-PERSON-TAGS) are only applied if a new person is recognized.
        To update an existing person's metadata, use the PUT /people/{personId} API.
        <br/><br/>If insert, update, update-if-lower-quality or merge are true,  WRITE_PRIVILEGE is required.
        <br/><br/>Permissions required:  READ_PRIVILEGE, WRITE_PRIVILEGE
      summary: >-
        Submit photo for face detection & people identification.
      operationId: submitPhotoPOST
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - name: insert
          required: false
          in: query
          description: Indicates if the detected person should be inserted in the database.
          schema:
            type: boolean
            default: true
        - name: update
          required: false
          in: query
          description: If match is made, matching record will be updated with the supplied image if all of the insertion criteria are met.
          schema:
            type: boolean
            default: true
        - name: update-if-older-than
          required: false
          in: query
          description: >-
            Restricts the face update and updates only face in case the one
            currently saved is older than the value specified in days. Default
            is 0, which means this functionality is disabled.
          schema:
            type: number
            format: float
        - name: update-if-lower-quality
          required: false
          in: query
          description: >-
            Restricts the face update and updates only face in case the one
            currently saved is of lower quality (in all aspects) than new one
            being provided.
              Default is false, which means this functionality is disabled.
          schema:
            type: boolean
            default: false
        - name: merge
          required: false
          in: query
          description: >-
            If specified to false allows the merging to be skipped. Default is
            true.
          schema:
            type: boolean
            default: true
        - name: regroup
          required: false
          in: query
          description: >-
            If specified to false no face grouping is happening, only face
            matching is used. Default is false.
          schema:
            type: boolean
            default: false
        - name: merge-with
          required: false
          in: query
          description: >-
            Specifies the person's Id to merge with.  Merge is performed only when single face is detected in the provided image. 
            In case of multiple faces, face to merge must be specified via either largest-only or closest-only-* parameter.
          schema:
            type: string
        - name: detect-age
          required: false
          in: query
          description: >-
            If specified as true, age detection is turned on. Default is
            false.
          schema:
            type: boolean
            default: false
        - name: detect-gender
          required: false
          in: query
          description: >-
            If specified as true, gender detection is turned on. Default is
            false.
          schema:
            type: boolean
            default: false
        - name: detect-sentiment
          required: false
          in: query
          description: >-
            If specified as true, sentiment and smile detection is turned on.
            Default is false.
          schema:
            type: boolean
            default: false
        - name: detect-occlusion
          required: false
          in: query
          description: >-
            If specified as true, occlusion detection is turned on.
            Default is false.
          schema:
            type: boolean
            default: false
        - name: detect-mask
          required: false
          in: query
          description: >-
            If specified as true, mask detection is turned on.
            Default is false.
          schema:
            type: boolean
            default: false
        - name: differentiate
          required: false
          in: query
          description: >-
            If specified to false no face differentation is happening based on
            faces detected in same photo. Default is false.
          schema:
            type: boolean
            default: false
        - name: similar_limit
          required: false
          in: query
          description: >-
            If specified up to specified number similar matches are being found
            and reported as similar. Default is 0, which means no similar
            matches are returned.
          schema:
            type: number
            default: 0
        - name: linear-match
          required: false
          in: query
          description: >-
            If linear match is forced (set to true) linear search is performed instead of bucketized search. Default is false.
          schema:
            type: boolean
            default: false
        - name: site
          required: false
          in: query
          description: >-
            Specifies which site to use for account locking, by default the site
            is 'default'. This is used in case when we have multiple cameras for
            same account. Required when event is not 'none'.
          schema:
            type: string
            default: default
        - name: source
          required: false
          in: query
          description: >-
            Specifies which source to use for account locking, by default the
            source is 'default'. This is used in case when we have multiple
            cameras for same account. Required when event is not 'none'.
          schema:
            type: string
            default: default
        - name: provide-face-id
          required: false
          in: query
          description: >-
            If specified as false no personId will be provided in response.
            Default is true.
          schema:
            type: boolean
            default: true
        - name: min-cpq
          required: false
          in: query
          description: >-
            Minimum center pose quality value required for face to be inserted
            in the database. When not specified the default configured value is
            used. When 0 is specified no cpq filtering is applied and the
            default configuration is ignored. When -1 is set system configured
            value is used. The default system value is 0.59.
          schema:
            type: number
            format: float
            default: -1.0
        - name: min-fsq
          required: false
          in: query
          description: >-
            Minimum faces sharpness quality value required for face to be
            inserted in the database. When not specificed the default configured
            value is used. When 0 is specified no fsq filtering is applied and
            the default configuration is ignored. When -1 is set system
            configured value is used.  The default system value is 0.40.
          schema:
            type: number
            format: float
            default: -1.0
        - name: min-fcq
          required: false
          in: query
          description: >-
            Minimum faces contrast quality value required for face to be
            inserted in the database. When not specified the default configured
            value is used. When 0 is specified no fcq filtering is applied and
            the default configuration is ignored. When -1 is set system
            configured value is used.  The default system value is 0.45.
          schema:
            type: number
            format: float
            default: -1.0
        - name: insert-profile
          required: false
          in: query
          description: >-
            Indicates whether profile faces are to be inserted in the database.
            When not specified the default is false meaning the profile faces
            are not inserted in the database.
          schema:
            type: boolean
            default: false
        - name: max-occlusion
          required: false
          in: query
          description: >-
            Maximum occlusion value tolerated for face to be inserted in the database.
            When not specified the server default configured value is used.
            When 1 is specified no occlusion filtering is applied and the default configuration is ignored.
            When -1 is set system configured value is used.
            Possible values are -1, with a valid range [0.0 .. 1.0].
            The default system value is 0.5.
          schema:
            type: number
            format: float
            default: -1.0
        - name: event
          required: false
          in: query
          description: >-
            Specifies when to generate an event, by default the event reporting
            is disabled and the value is 'none'. Value 'id' is used to create
            event only if person id is available. The value 'any' indicates to
            create event when person is unidentified or identified (in any
            case).  When event is not 'none', site, source, start-time and end-time
            must also be provided.
          schema:
            type: string
            default: none
        - name: start-time
          required: false
          in: query
          description: >-
            Specifies event start in Unix Epoch time in miliseconds. Required
            when event is not 'none'.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: end-time
          required: false
          in: query
          description: >-
            Specifies event end in Unix Epoch time in miliseconds. Required when
            event is not 'none'.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: context
          required: false
          in: query
          description: >-
            Specifies context of event, allowed values are 'live' or 'media', by
            default the context is 'live'. Used only when event is not none.
          schema:
            type: string
            default: live
        - name: type
          required: false
          in: query
          description: >-
            Event type, by default is the type is 'person'. Valid values are
            'person','tag','object' or 'action'.
          schema:
            type: string
            default: person
        - name: event-id
          required: false
          in: query
          description: Event id. When not specified the event id is autogenerated.
          schema:
            type: string
        - name: include-expired
          required: false
          in: query
          description: >-
            If true is specified expired person is treated same as unexpired. If
            false is specified and expired person is detected, the expiration
            time and person type are reset, unless the X-RPC-EXP-DATE and/or
            X-RPC-PERSON-TYPE are supplied respecively. Default is false.
          schema:
            type: boolean
            default: false
        - name: match-unconfirmed
          required: false
          in: query
          description: Allows matching when a face isn't confirmed by face detection model, ie when the face includes an attribute 'faceConfirmed' set to false.  Defaults to false.
          schema:
            type: boolean
        - name: insert-unconfirmed
          required: false
          in: query
          description: Allows inserting a face that has not been confirmed by the recognition model.  The POST /people response contains a 'faceConfirmed' attribute indicating whether the model confirmed the face.  In order for 'insert-unconfirmed=true' to take effect, match-unconfirmed must also be set to true. Defaults to false.
          schema:
            type: boolean
        - name: larger-than
          required: false
          in: query
          description: If set to a value, only faces with higher or equal relative height will be considerd for processing. If not set, this filtering does not take place.
          schema:
            type: number
        - name: largest-only
          required: false
          in: query
          description: If set to true, only the largest face found in the image will be detected.
            Smaller faces will be ignored and not reported back. Defaults to false.
          schema:
            type: boolean
        - name: closest-only-x
          required: false
          in: query
          description: If set to a value, only the face with its center closest to the value will be used for processing. If not set, this filtering does not take place.
          schema:
            type: number
        - name: closest-only-y
          required: false
          in: query
          description: If set to a value, only the face with its center closest to the value will be used for processing. If not set, this filtering does not take place.
          schema:
            type: number
        - name: min-size
          required: false
          in: query
          description: Indicates minimum size of face in pixels to be inserted into the database.
            When not specified, or set to -1, the default server configured value is used.
            When set to 0, no minimum is applied (any size is acceptable).
          schema:
            type: number
            format: integer
        - name: update-person-id
          required: false
          in: query
          description: When the update-person-id is specified only the face of the specified person will be updated. If the face does not meet the positioning and quality criteria the update will not be performed. If face image is already present and new image does not match the existing one within the configured tolerance (grouping threshold), update will also not be performed.  To allow any image to replace the existing one, pass along value of 4 for X-RPC-FACES-GROUPING-THRESHOLD which will increase the match tolerance to the maximum.  When API is used with an insert flag set to true and previously a person without a face was stored a new face will be added to the person specified by update-person-id. When multiple faces meet the positioning and quality criteria in the posted source image, only one arbitrary image will be applied to the person specified via update-person-id.
          schema:
            type: string
        - name: detect-liveness
          required: false
          in: query
          description: >-
            Specifies if to use liveness detection for verifying the person's face, allowed values are '3d' or 'none', by
            default the detect-liveness is 'none' and turned off. When liveness detection is enabled only faces that pass the liveness
            test are inserted in the database. The input image should contain only one face and be and have a contet-type of
            application/vnd.rn-realchunk to signify multipart image format that contains one image section with face and one 3d section,
            otherwise an error is returned.
          schema:
            type: boolean
        - name: verbose
          required: false
          in: query
          description: >-
            Specifies if to return more complex person information. The default is false.
          schema:
            type: boolean
        - $ref: '#/components/parameters/XRpcSite'
        - $ref: '#/components/parameters/XRpcSiteBase64'
        - $ref: '#/components/parameters/XRpcSource'
        - $ref: '#/components/parameters/XRpcSourceBase64'
        - description: >-
            Access Clearance name to be set if a new person is created.  Access Clearance Level will be derived from the Access Clearance.
          in: header
          name: X-RPC-ACCESS-CLEARANCE
          required: false
          schema:
            type: string
        - description: >-
            Base64 encoded Access Clearance name to be set if a new person is created.  Access Clearance Level will be derived from the Access Clearance.
          in: header
          name: X-RPC-ACCESS-CLEARANCE-BASE64
          required: false
          schema:
            type: string
        - description: >-
            The expiration date of the access clearance applied to the recognized person in epoch time, ie milliseconds since the epoch.
          in: header
          name: X-RPC-ACCESS-ACTIVATED-UNTIL
          required: false
          schema:
            type: number
            format: int64
        - description: >-
            Overrides the default face detection threshold value. When set to
            zero the configured application default is ignored and no threshold
            is passed to detection service.
          in: header
          name: X-RPC-FACES-DETECT-THRESHOLD
          required: false
          schema:
            type: number
            format: float
        - description: Overrides the default grouping threshold value.
          in: header
          name: X-RPC-FACES-GROUPING-THRESHOLD
          required: false
          schema:
            type: number
            format: float
        - description: >-
            JSON, from detect call, that helps to speed up face detection and is
            needed when the face cutouts are tight.
          in: header
          name: X-RPC-FACES-DETECTED
          required: false
          schema:
            type: string
        - description: >-
            Overrides the default face proximity matching threshold value. If
            zero is specified the proximity threshold is not used.
          in: header
          name: X-RPC-FACES-PROXIMITY-THRESHOLD
          required: false
          schema:
            type: number
            format: float
        - description: Allows user to specify min size of the face detected.
          in: header
          name: X-RPC-MIN-SIZE
          required: false
          schema:
            type: integer
        - description: >-
            Allows caller to customize minimum face ratio allowed in suboptimal
            face.
          in: header
          name: X-RPC-MIN-SIZE-RATIO
          required: false
          schema:
            type: number
            format: float
        - description: >-
            Allows caller to specify mask detection threshold.
            The allowed values are from 0 to 1.
          in: header
          name: X-RPC-MASK-THRESHOLD
          required: false
          schema:
            type: number
            format: float
        - description: >-
            Allows caller to specify mask model. The supported values are sensitive, precise and and normal.
            The default model is normal. If the specified masked model is not available face service picks the best available.
          in: header
          name: X-RPC-MASK-MODEL
          required: false
          schema:
            type: string
        - description: Existing group or groups names to be applied to newly detected person formated as a JSON array of string values, e.g. ["Group1","Group-employees"]
          in: header
          name: X-RPC-GROUPS
          required: false
          schema:
            type: string
        - description: Same as X-RPC-GROUPS, but the entire JSON array including the [] and characters in based 64 encoded, e.g. WyJHcm91cDEiLCJHcm91cC1lbXBsb3llZXMiXQ==
          in: header
          name: X-RPC-GROUPS-BASE64
          required: false
          schema:
            type: string
        - description: Tags to be applied to newly detected person formatted as a JSON array of string values, e.g. ["centerPoseQuality=0.0","faceSharpnessQuality=0.7555168683488035","faceContrastQuality=0.6837500095367431"]
          in: header
          name: X-RPC-PERSON-TAGS
          required: false
          schema:
            type: string
        - description: First name to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-FIRST-NAME
          required: false
          schema:
            type: string
        - description: First name, that is base64 encocded, to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-FIRST-NAME-BASE64
          required: false
          schema:
            type: string
        - description: Last name to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-LAST-NAME
          required: false
          schema:
            type: string
        - description: Last name, that is base64 encocded, to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-LAST-NAME-BASE64
          required: false
          schema:
            type: string
        - description: Name to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-NAME
          required: false
          schema:
            type: string
        - description: Name, that is base64 encocded, to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-NAME-BASE64
          required: false
          schema:
            type: string
        - description: Person type to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-TYPE
          required: false
          schema:
            type: string
        - description: External id to be applied to newly detected person.
          in: header
          name: X-RPC-EXTERNAL-ID
          required: false
          schema:
            type: string
        - description: Root person id to be applied to newly detected person.
          in: header
          name: X-RPC-ROOT-PERSON-ID
          required: false
          schema:
            type: string
        - description: Date of birth to be applied to newly detected person in one of the following formats YYYY-MM-DD, YYYY-MM or YYYYY.
          in: header
          name: X-RPC-DATE-OF-BIRTH
          required: false
          schema:
            type: string
        - description: Age to be applied to newly detected person.
          in: header
          name: X-RPC-AGE
          required: false
          schema:
            type: string
        - description: Gender to be applied to newly detected person.
          in: header
          name: X-RPC-GENDER
          required: false
          schema:
            type: string
        - description: Id to identify camera source feed.
          in: header
          name: X-FEED-ID
          required: false
          schema:
            type: string
        - description: Expiration date of person in Unix Epoch time miliseconds.
          in: header
          name: X-RPC-EXP-DATE
          required: false
          schema:
            type: integer
        - description: Overrides the default liveness threshold value.
          in: header
          name: X-RPC-LIVENESS-THRESHOLD
          required: false
          schema:
            type: number
            format: float
      responses:
        '201':
          description: CREATED
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/SubmitPhotoResponse'
        '400':
          description: Invalid Request
        '401':
          description: >-
            Unauthorized, ensure the correct values for X-RPC-AUTHORIZATION and
            Authorization headers are used.
        '403':
          description: >-
            Forbidden, ensure the correct values for X-RPC-AUTHORIZATION and
            Authorization headers are used.
        '429':
          description: >-
            Retry the call later in specified time supplied in Retry-After
            HEADER
        '500':
          description: >-
            Unable to detect faces, unable to persist faces, unable to process
            request
        '503':
          description: >-
            The server is currently unable to handle the request due to a
            temporary overloading or maintenance of the server. Retry call after
            a delay.
      tags:
        - Facial Recognition Interface
      requestBody:
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: Image file with faces to be processed.
        required: true
    get:
      description: >-
        deprecated -- may be removed in a future release; use GET /rootpeople which supports paging results. <br/>
        Get data on people recognized in photos associated with this account.
        Note that this call will return all the people in the account up to 1000 and is not
        suitable to use on large accounts. Limited via property people.get.query.limit.
        <br/><br/>Permissions required:  READ_PRIVILEGE
      operationId: peopleGET
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - description: >-
            A minimum value of the face center pose quality required for getting
            faces for people. If not specified the default filtering is used.
          in: query
          name: minimum-center-pose-quality
          required: false
          schema:
            type: number
            format: float
        - description: >-
            Specifies if expired people should be returned. Default is false, not
            returning expired people.
          in: query
          name: include-expired
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GetPeopleResponse'
      summary: Get information associated with people recognized in photos.
      tags:
        - Recognized Person Interface
  '/verification/{personId}':
    post:
      description: >-
        Upload and perform facial recognition operations providing summary
        information of faces and persons identified.
        <br/><br/>Permissions required:  READ_PRIVILEGE
      summary: >-
        Submit photo for face detection and matching against a known person.
      operationId: submitVerificationPOST
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - name: personId
          required: true
          in: path
          description: >-
            Identifier of person to match against faces detected in the submitted photo.
          schema:
            type: string
        - name: recursive
          required: false
          in: query
          description: >-
            If this is true, it will locate all merged people for the
            specified personId. Default is false.
          schema:
            type: boolean
            default: false
        - name: verbose
          required: false
          in: query
          description: >-
            Specifies if to return more complex person information. The default is false.
          schema:
            type: boolean
        - description: Overrides the default face proximity matching threshold value. If zero is specified the proximity threshold is not used.
          in: header
          name: X-RPC-FACES-PROXIMITY-THRESHOLD
          required: false
          schema:
            type: number
            format: float
        - description: Overrides the default grouping threshold value.
          in: header
          name: X-RPC-FACES-GROUPING-THRESHOLD
          required: false
          schema:
            type: number
            format: float
        - description: Allows user to specify min size of the face detected.
          in: header
          name: X-RPC-MIN-SIZE
          required: false
          schema:
            type: integer
        - description: >-
            Allows caller to customize minimum face ratio allowed in suboptimal
            face.
          in: header
          name: X-RPC-MIN-SIZE-RATIO
          required: false
          schema:
            type: number
            format: float
      responses:
        '201':
          description: CREATED
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/SubmitPhotoResponse'
        '400':
          description: Invalid Request
        '401':
          description: >-
            Unauthorized, ensure the correct values for X-RPC-AUTHORIZATION and
            Authorization headers are used.
        '403':
          description: >-
            Forbidden, ensure the correct values for X-RPC-AUTHORIZATION and
            Authorization headers are used.
        '429':
          description: >-
            Retry the call later in specified time supplied in Retry-After
            HEADER
        '500':
          description: >-
            Unable to detect faces, unable to persist faces, unable to process
            request
        '503':
          description: >-
            The server is currently unable to handle the request due to a
            temporary overloading or maintenance of the server. Retry call after
            a delay.
      tags:
        - Facial Recognition Interface
      requestBody:
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: Image file with faces to be processed.
  '/verification/{firstPersonId}':
    get:
      description: >-
        Matches two known persons, providing summary
        information of faces and persons identified.
        <br/><br/>Permissions required:  READ_PRIVILEGE
      summary: >-
        Match a know person against another known person using their stored faces.
      operationId: submitVerificationGET
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - name: firstPersonId
          required: true
          in: path
          description: >-
            Identifier of known person to match against the person represented by 'personId' query parameter.
          schema:
            type: string
        - name: personId
          required: true
          in: query
          description: >-
            Identifier of second known person to match against person identifier 'firstPersonId' from url path.
          schema:
            type: string
        - name: recursive
          required: false
          in: query
          description: >-
            If this is true, it will locate all merged people for the
            specified personId1 and personId2. Default is false.
          schema:
            type: boolean
            default: false
        - name: verbose
          required: false
          in: query
          description: >-
            Specifies if to return more complex person information. The default is false.
          schema:
            type: boolean
      responses:
        '201':
          description: CREATED
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/SubmitPhotoResponse'
        '400':
          description: Invalid Request
        '401':
          description: >-
            Unauthorized, ensure the correct values for X-RPC-AUTHORIZATION and
            Authorization headers are used.
        '403':
          description: >-
            Forbidden, ensure the correct values for X-RPC-AUTHORIZATION and
            Authorization headers are used.
        '429':
          description: >-
            Retry the call later in specified time supplied in Retry-After
            HEADER
        '500':
          description: >-
            Unable to detect faces, unable to persist faces, unable to process
            request
        '503':
          description: >-
            The server is currently unable to handle the request due to a
            temporary overloading or maintenance of the server. Retry call after
            a delay.
      tags:
        - Facial Recognition Interface
  /signature:
    post:
      description: >-
        Upload person signature(s) with optional personal data.
        <br/><br/>Permissions required:  READ_PRIVILEGE
      summary: >-
        Submit person signature(s) for matching.
      operationId: submitSignaturePOST
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - $ref: '#/components/parameters/XRpcSite'
        - $ref: '#/components/parameters/XRpcSiteBase64'
        - $ref: '#/components/parameters/XRpcSource'
        - $ref: '#/components/parameters/XRpcSourceBase64'
        - name: insert
          required: false
          in: query
          description: >-
            Indicates if the detected person should be inserted in the database.
            Default is true.
          schema:
            type: boolean
            default: true
        - name: update
          required: false
          in: query
          description: >-
            If match is made, matching record will be updated with the supplied image if all of the insertion criteria are met.
            Default is true.
          schema:
            type: boolean
            default: true
        - name: update-if-older-than
          required: false
          in: query
          description: >-
            Restricts the face update and updates only face in case the one
            currently saved is older than the value specified in days. Default
            is 0, which means this functionality is disabled.
          schema:
            type: number
            format: float
            default: 0
        - name: merge
          required: false
          in: query
          description: >-
            If specified to false allows the merging to be skipped. Default is
            true.
          schema:
            type: boolean
            default: true
        - name: regroup
          required: false
          in: query
          description: >-
            If specified to false no face grouping is happening, only face
            matching is used. Default is false.
          schema:
            type: boolean
            default: false
        - name: merge-with
          required: false
          in: query
          description: >-
            Specifies the person's Id to merge with.  Merge is performed only when single face is detected in the provided image. 
            In case of multiple faces, face to merge must be specified via either largest-only or closest-only-* parameter.
          schema:
            type: string
        - name: similar_limit
          required: false
          in: query
          description: >-
            If specified up to specified number similar matches are being found
            and reported as similar. Default is 0, which means no similar
            matches are returned.
          schema:
            type: number
            default: 0
        - name: site
          required: false
          in: query
          description: >-
            Specifies which site to use for account locking, by default the site
            is 'default'. This is used in case when we have multiple cameras for
            same account. Required when event is not 'none'.
          schema:
            type: string
            default: default
        - name: source
          required: false
          in: query
          description: >-
            Specifies which source to use for account locking, by default the
            source is 'default'. This is used in case when we have multiple
            cameras for same account. Required when event is not 'none'.
          schema:
            type: string
            default: default
        - name: event
          required: false
          in: query
          description: >-
            Specifies when to generate an event, by default the event reporting
            is disabled and the value is 'none'. Value 'id' is used to create
            event only if person id is available. The value 'any' indicates to
            create event when person is unidentified or identified (in any
            case). When event is not 'none', site, source, start-time and end-time
            must also be provided.
          schema:
            type: string
            default: none
        - name: start-time
          required: false
          in: query
          description: >-
            Specifies event start time in Unix Epoch time in miliseconds.
            Required when event is not 'none'.
          schema:
            type: string
            format: int64
        - name: end-time
          required: false
          in: query
          description: >-
            Specifies event end time in Unix Epoch time in miliseconds. Required
            when event is not 'none'.
          schema:
            type: integer
            format: int64
        - name: context
          required: false
          in: query
          description: >-
            Specifies conext of event, allowed values are 'live' or 'media', by
            default the context is 'live'. Used only when event is not none.
          schema:
            type: string
            default: live
        - name: type
          required: false
          in: query
          description: >-
            Event type, by default is the type is 'person'. Valid values are
            'person','tag','object' or 'action'.
          schema:
            type: string
            default: person
        - name: include-expired
          required: false
          in: query
          description: >-
            If true is specified expired person is treated same as unexpired. If
            false is specified and expired person is detected, the expiration
            time and person type are reset, unless the X-RPC-EXP-DATE and/or
            X-RPC-PERSON-TYPE are supplied respecively. Default is false.
          schema:
            type: boolean
            default: false
        - name: event-id
          required: false
          in: query
          description: Event id. When not specified the event id is autogenerated.
          schema:
            type: string
        - description: >-
            Overrides the default face detection threshold value. When set to
            zero the configured application default is ignored and no threshold
            is passed to detection service.
          in: header
          name: X-RPC-FACES-DETECT-THRESHOLD
          required: false
          schema:
            type: number
            format: float
        - description: Overrides the default grouping threshold value.
          in: header
          name: X-RPC-FACES-GROUPING-THRESHOLD
          required: false
          schema:
            type: number
            format: float
        - description: >-
            Overrides the default face proximity matching threshold value. If
            zero is specified the proximity threshold is not used.
          in: header
          name: X-RPC-FACES-PROXIMITY-THRESHOLD
          required: false
          schema:
            type: number
            format: float
        - description: Existing group or groups names to be applied to newly detected person formated as a JSON array of string values, e.g. ["Group1","Group-employees"]
          in: header
          name: X-RPC-GROUPS
          required: false
          schema:
            type: string
        - description: Same as X-RPC-GROUPS, but the entire JSON array including the [] and characters in based 64 encoded, e.g. WyJHcm91cDEiLCJHcm91cC1lbXBsb3llZXMiXQ==
          in: header
          name: X-RPC-GROUPS-BASE64
          required: false
          schema:
            type: string
        - description: Tags to be applied to newly detected person.
          in: header
          name: X-RPC-PERSON-TAGS
          required: false
          schema:
            type: string
        - description: First name to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-FIRST-NAME
          required: false
          schema:
            type: string
        - description: First name, that is base64 encocded, to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-FIRST-NAME-BASE64
          required: false
          schema:
            type: string
        - description: Last name to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-LAST-NAME
          required: false
          schema:
            type: string
        - description: Last name, that is base64 encocded, to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-LAST-NAME-BASE64
          required: false
          schema:
            type: string
        - description: Name to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-NAME
          required: false
          schema:
            type: string
        - description: Name, that is base64 encocded, to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-NAME-BASE64
          required: false
          schema:
            type: string
        - description: Person type to be applied to newly detected person
          in: header
          name: X-RPC-PERSON-TYPE
          required: false
          schema:
            type: string
        - description: External id to be applied to newly detected person.
          in: header
          name: X-RPC-EXTERNAL-ID
          required: false
          schema:
            type: string
        - description: Date of birth to be applied to newly detected person in one of the following formats YYYY-MM-DD, YYYY-MM or YYYYY.
          in: header
          name: X-RPC-DATE-OF-BIRTH
          required: false
          schema:
            type: string
        - description: Age to be applied to newly detected person.
          in: header
          name: X-RPC-AGE
          required: false
          schema:
            type: string
        - description: Gender to be applied to newly detected person. Valid values are male, female or unknonwn.
          in: header
          name: X-RPC-GENDER
          required: false
          schema:
            type: string
        - description: Id to identify camera source feed.
          in: header
          name: X-FEED-ID
          required: false
          schema:
            type: string
        - description: Expiration date of person in Unix Epoch time in miliseconds.
          in: header
          name: X-RPC-EXP-DATE
          required: false
          schema:
            type: string
      responses:
        '201':
          description: CREATED
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/SubmitPhotoResponse'
        '400':
          description: Invalid Request
        '429':
          description: >-
            Retry the call later in specified time supplied in Retry-After
            HEADER
        '500':
          description: >-
            Unable to detect faces, unable to persist faces, unable to process
            request
        '503':
          description: >-
            The server is currently unable to handle the request due to a
            temporary overloading or maintenance of the server. Retry call after
            a delay.
      tags:
        - Facial Recognition Interface
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureAdditionRequest'
        description: Signature(s) associated with the person.
        required: true
  '/signature/{personId}':
    get:
      description: >-
        Get signature(s) associated with specified person.
        <br/><br/>Permissions required:  READ_PRIVILEGE
      operationId: signatureGET
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - description: Globally unique identfier associated with person record.
          in: path
          name: personId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/SignatureRetreivalResponse'
      summary: Gets person signatures.
      tags:
        - Recognized Person Interface
  /rootpeople:
    get:
      description: >-
        Get root people information recognized in photos associated with this
        account. The root person is is a parent with or without children, but
        cannot be a child of another person.
        <br/><br/>Permissions required:  READ_PRIVILEGE
      operationId: rootpeopleGET
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - name: startIndexState
          in: query
          description: Opaque index state returned in the paging object (personCollectionResponse) from the previous call, i.e. personCollectionResponse.nextIndexState field. If startIndexState is provided, start-index will only be used to maintain proper count in paging object returned where the last page totalCount = start-index + count
          schema:
            type: string
        - description: Starting index of the query.  
          in: query
          name: start-index
          required: false
          schema:
            type: number
            default: 0
        - description: Target number of records to return. The default is 100. Actual number of records returned could be lower if fewer records satisfying the query exist or could be higher due to records paging boundary.
          in: query
          name: count
          required: false
          schema:
            type: number
            default: 100
        - description: >-
            Supported values include name, create-date, update-date, home-location and last-name.
            By default, no sorting is applied and the default database order is returned.
          in: query
          name: sort
          required: false
          schema:
            type: string
        - description: >-
            Valid values for sort order are ascending and descending, when not
            specified the default is ascending.
          in: query
          name: sort-order
          required: false
          schema:
            type: string
            default: ascending
        - description: Regular expression used to search on persons name.
          in: query
          name: name-pattern
          required: false
          schema:
            type: string
        - description: Regular expression used to search on persons home location.
          in: query
          name: home-location-pattern
          required: false
          schema:
            type: string
        - description: >-
            Exact string used to search for persons home location. The special
            value $absent is used to find all people that do not have the home
            location set. The $present can be used to find all the people that
            have the home location set.
          in: query
          name: home-location
          required: false
          schema:
            type: string
        - description: >-
            String used to search for persons last name. The last name is
            extracted from the Person's name. The case is ignored.
          in: query
          name: last-name
          required: false
          schema:
            type: string
        - description: >-
            Exact string used to search for persons type. The special value
            $absent is used to find all people that do not have the person type
            set. The $present can be used to find all the people that have the
            person type set.
          in: query
          name: person-type
          required: false
          schema:
            type: string
        - description: >-
            Exact string used to search for moniker. The special value $absent
            is used to find all people that do not have the moniker set. The
            $present can be used to find all the people that have the moniker
            set.
          in: query
          name: moniker
          required: false
          schema:
            type: string
        - description: >-
            One of the following values: noconcern, concern, stranger, threat,
            unidentified. 'noconcern' includes people with id-class = noconcern
            or a person without an id-class that has previously been identified.
          in: query
          name: id-class
          required: false
          schema:
            type: string
        - description: >-
            Specifies if expired people should be return. Default is false, not
            returning expired people.
          in: query
          name: include-expired
          required: false
          schema:
            type: boolean
            default: false
        - description: >-
            Specfies list of groups to include in query.
          in: query
          name: groups
          required: false
          schema:
            type: array
            items:
              type: string
        - description: >-
            Specfies the facility access car id of person records to query.
          in: query
          name: access-card-id
          required: false
          schema:
            type: string
        - description: >-
            Specfies the facility id of person records to query.
          in: query
          name: access-facility-id
          required: false
          schema:
            type: string
        - description:  >-
            ShortID is a 4 byte (8 hex digit) prefix of full root person id GUID to include in query.
          in: query
          name: short-id
          required: false
          schema:
            type: string
        - description:  Specfies whether to query for persons that have a face identity associated.
          in: query
          name: face-id
          required: false
          schema:
            type: string
        - description: >-
            Specfies access clearance name to include in query.
          in: query
          name: access-clearance
          required: false
          schema:
            type: string
        - description: >-
            Specfies maximum access clearance for people queried.  Optional. Default = -1.
          in: query
          name: min-access-clearance-level
          required: false
          schema:
            type: integer
        - description: >-
            Specfies maximum access clearance for people queried. Optional. Default = Max Integer.
          in: query
          name: max-access-clearance-level
          required: false
          schema:
            type: integer
        - description: >-
            Specfies query for absence or presence of documents.
          in: query
          name: has-docs
          required: false
          schema:
            type: boolean
        - description: >-
            Specfies query for absence or presence of notes.
          in: query
          name: has-notes
          required: false
          schema:
            type: boolean
        - description:  >-
            Specfies role or list of roles to include in query, e.g. ?invite-account-role=user&invite-account-role=host <br/>When invite-account-role=none is provided, it includes person records without inviteAccountRole attribute set.
          in: query
          name: invite-account-role
          required: false
          schema:
            type: array
            items:
              type: string
        - description:  >-
            Specfies the access information system origin. access-origin="" matches people without access-origin set. Keyword $any can be used to specify any access-origin set.
          in: query
          name: access-origin
          required: false
          schema:
            type: string
        - name: zones
          in: query
          description: zones ids used to filter response; optional and these ids can by provided in request body
          style: form
          explode: true
          required: false
          schema:
            type: array
            items:
              type: string
        - name: external-id
          in: query
          description: one or more external Ids may be provided for query filter of identities, e.g. ?external-id=ID_ONE&external-id=ID_TWO&external-id=ID_THREE
          style: form
          explode: true
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GetPaginatedPeopleResponse'
      summary: Get information associated with root people recognized in photos.
      tags:
        - Recognized Person Interface
  '/mergedpeople/{personId}':
    get:
      description: >-
        Get people merged with a recognized root person.
        <br/><br/>Permissions required:  READ_PRIVILEGE
      operationId: getMergedPeopleByPersonId
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - description: Globally unique identfier associated with person record.
          in: path
          name: personId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GetMergedPeopleResponse'
      summary: Gets people that were merged with a specific root person.
      tags:
        - Recognized Person Interface
  '/people/new':
    post:
      summary: Create new person record without face image and without face signature.
      description: >-
        Posts a new person record with meta-data but without face image or signature.  Face image or signature can be posted and merged afterwards.
        <br/><br/>Permissions required:  WRITE_PRIVILEGE
      operationId: newPersonPOST
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonRequest'
        description: Data to be associated with the new person placeholder.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PersonCreationResponse'
      tags:
        - Recognized Person Interface
  '/people/{personId}':
    get:
      description: >-
        Get information associated with a recognized person.
        <br/><br/>Permissions required:  READ_PRIVILEGE
      operationId: getPersonByPersonId
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - description: Globally unique identfier associated with person record.
          in: path
          name: personId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GetPersonResponse'
      summary: Gets information associated with specific person.
      tags:
        - Recognized Person Interface
    delete:
      description: >-
        Delete recognized persons and request storage service provider removal
        of associated user faces.
        <br/><br/>Permissions required:  DELETE_PRIVILEGE
      operationId: deletePerson
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - $ref: '#/components/parameters/XRpcSite'
        - $ref: '#/components/parameters/XRpcSiteBase64'
        - $ref: '#/components/parameters/XRpcSource'
        - $ref: '#/components/parameters/XRpcSourceBase64'
        - description: Globally unique identfier associated with person record to be deleted.
          in: path
          name: personId
          required: true
          schema:
            type: string
        - name: recursive
          required: false
          in: query
          description: >-
            If this is true, it will first locate the root person for the
            specified personId and recursively delete all the merged people
            associated with this root person.  Default is false.
          schema:
            type: boolean
            default: false
        - name: async
          required: false
          in: query
          description: >-
            If this is true, the delete operation will be asynchronous.  Default is false.
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: No Content, success.
      summary: >-
        Delete data associated with a recognized person.
      tags:
        - Recognized Person Interface
    put:
      summary: Submit data to be associated with a recognized person.
      description: >-
        Submit data to be associated with a recognized person.  Update recognized persons with metadata such as name and tags.  Only fields provided will be added or updated.  If a field is omitted, it will not be removed.  If a field is present but blank, it will be removed.
        e.g.  "age" : "", will remove the field age from the person record.
        <br/><br/>Permissions required:  WRITE_PRIVILEGE
      operationId: updatePersonPUT
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - $ref: '#/components/parameters/XRpcSite'
        - $ref: '#/components/parameters/XRpcSiteBase64'
        - $ref: '#/components/parameters/XRpcSource'
        - $ref: '#/components/parameters/XRpcSourceBase64'
        - description: Globally unique identfier associated with person record to be modified.
          in: path
          name: personId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonRequest'
        description: Data to be associated with the recognized person.
        required: true
      responses:
        '202':
          description: ACCEPTED
      tags:
        - Recognized Person Interface
  '/people/external/{externalId}':
    get:
      description: >-
        Get person(s) information that have specific externalId.
        <br/><br/>Permissions required:  READ_PRIVILEGE
      operationId: getPeopleByExternalId
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - description: Person external identifier.
          in: path
          name: externalId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GetExternalPeopleResponse'
      summary: Gets person(s) information that has specific externalId.
      tags:
        - Recognized Person Interface
  /merge:
    put:
      summary: Merge specific people.
      operationId: mergePeoplePUT
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - $ref: '#/components/parameters/XRpcSite'
        - $ref: '#/components/parameters/XRpcSiteBase64'
        - $ref: '#/components/parameters/XRpcSource'
        - $ref: '#/components/parameters/XRpcSourceBase64'
      responses:
        '202':
          description: ACCEPTED
      description: >-
        Merges specified persons in the list. This non-recursive merge, hence it
        essentially rips out the person specified from the existing tree
        hierarchy and merges them together. It also keeps existing orphaned tree
        intact. If the name is not specified in JSON the parent or the oldest
        child name and tags will be projected on all the other children.
        <br/><br/>Permissions required:  WRITE_PRIVILEGE
      tags:
        - Recognized Person Interface
      requestBody:
        $ref: '#/components/requestBodies/PeopleMergeRequest'
  /mergerecursive:
    put:
      summary: Merge specific people recursively.
      operationId: recursiveMergePeoplePUT
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - $ref: '#/components/parameters/XRpcSite'
        - $ref: '#/components/parameters/XRpcSiteBase64'
        - $ref: '#/components/parameters/XRpcSource'
        - $ref: '#/components/parameters/XRpcSourceBase64'
      responses:
        '202':
          description: ACCEPTED
      description: >-
        Merges specified persons in the list and all their relatives. This a
        recursive merge, hence the effected tree hierarchies are completely
        merged. If the name is not specified in JSON the parent or the oldest
        child name and tags will be projected on all the other children.
        <br/><br/>Permissions required:  WRITE_PRIVILEGE
      tags:
        - Recognized Person Interface
      requestBody:
        $ref: '#/components/requestBodies/PeopleMergeRequest'
  /unmerge:
    put:
      summary: Unmerge specific people.
      operationId: UnMergePeoplePUT
      parameters:
        - $ref: '#/components/parameters/XRpcAuthorization'
        - $ref: '#/components/parameters/XRpcSite'
        - $ref: '#/components/parameters/XRpcSiteBase64'

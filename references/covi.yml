><span style="color: rgb(0,0,0);">DELETE_PRIVILEGE</span></td><td class="confluenceTd"><span style="color: rgb(0,0,0);">Allows deletion of&nbsp;<span style="color: rgb(0,0,0);">recognized</span> people and faces across within the user's tenant.</span></td></tr><tr role="row"><td class="confluenceTd"><span style="color: rgb(0,0,0);"><span style="color: rgb(0,0,0);">CONFIG_PRIVILEGE</span></span></td><td class="confluenceTd"><span style="color: rgb(0,0,0);">Allows changes to configurations (e.g. event archive cleanup parameter) within the user's tenant. </span></td></tr><tr role="row"><td colspan="1" class="confluenceTd">ACCOUNT_PRIVILEGE</td><td colspan="1" class="confluenceTd">Allows changes to a user's own account properties, such as setting password, but doesn't allow changing other user's account</td></tr><tr role="row"><td class="confluenceTd"><span style="color: rgb(0,0,0);">ACCESS_PRIVILEGE</span></td><td class="confluenceTd">Allows making changes to users, addition and deletion of users within the user's tenant. &nbsp; APIs that require ACCOUNT_PRIVILEGE accept&nbsp;<span style="color: rgb(0,0,0);">ACCESS_PRIVILEGE as well.</span></td></tr><tr role="row"><td class="confluenceTd"><span style="color: rgb(0,0,0);">SUPER_READ_PRIVILEGE</span></td><td class="confluenceTd">Allows viewing recognized people and faces, reading virgo configurations, etc. across tenants.</td></tr><tr role="row"><td class="confluenceTd"><span style="color: rgb(0,0,0);">SUPER_WRITE_PRIVILEGE</span></td><td class="confluenceTd">Allows making changes to <span style="color: rgb(0,0,0);">recognized</span> people and faces properties, changes to virgo configurations, etc. across tenants.</td></tr><tr role="row"><td class="confluenceTd"><span style="color: rgb(0,0,0);">SUPER_DELETE_PRIVILEGE</span></td><td class="confluenceTd">Allows deletion of&nbsp;<span style="color: rgb(0,0,0);">recognized</span> people and faces across across tenants.</td></tr><tr role="row"><td class="confluenceTd"><span style="color: rgb(0,0,0);">SUPER_CONFIG_PRIVILEGE</span></td><td class="confluenceTd">Allows changes to configurations (e.g. event archive cleanup parameter) across tenants.</td></tr><tr role="row"><td class="confluenceTd"><span style="color: rgb(0,0,0);">SUPER_ACCESS_PRIVILEGE</span></td><td class="confluenceTd">Allows admin of users across tenants.</td></tr><tr role="row"><td colspan="1" class="confluenceTd"><span style="color: rgb(0,0,0);">LICENSE_RETRIEVAL_PRIVILEGE</span></td><td colspan="1" class="confluenceTd">Allows licensing the server.&nbsp;&nbsp; Sole role of a FOUNDER in its cloud projection.&nbsp; In cloud config.clients collection belongs only to ROLE_SUPER_ADMIN</td></tr></tbody></table>

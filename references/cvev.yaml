  /queueStats:
    get:
      tags:
      - Event Query Interfaces
      summary: Get queue stats.
      description: "Get statistics for a queue defined by fromSource (entrance), toSource\
        \ (exit).Also required are intervalTime and maxWaitTime parameters which set\
        \ a reporting interval and wait cutoff value respectively.<br/><br/>Requires\
        \ READ_PRIVILEGE or READ_EVENT_PRIVILEGE."
      operationId: getQueueStatsUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: actionDirection
        in: query
        description: (optional) Action direction when using secondary card reader
        allowEmptyValue: false
        schema:
          type: string
      - name: actionId
        in: query
        description: "(optional) Action identifier; used when the event type is 'action'.\
          \ For query parameters, this can be a comma separated list, e.g. ?action=checkedIn,checkedInOut\
          \ or a repeated parameter, e.g. ?action=checkedIn&action=checkedOut"
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: actionType
        in: query
        description: (optional) Type of the action; used when the event type is 'action'.
        allowEmptyValue: false
        schema:
          type: string
      - name: company
        in: query
        description: (optional) Company name of recognized person.
        allowEmptyValue: false
        schema:
          type: string
      - name: context
        in: query
        description: " (optional) if not specified, assumed to be all contexts; commonly\
          \ used values include 'live' and 'media.'"
        allowEmptyValue: false
        schema:
          type: string
      - name: count
        in: query
        description: "(optional) Limit on the number of events returned.  The events\
          \ returned will be the most recent in ascending chronological order.This\
          \ parameter is different than limiting the number of events queried which\
          \ is effected by the queryLimit parameter.  When events are coalesced through\
          \ the minSeparation or minUnidentifiedSeparation parameter, the actual number\
          \ of events returned will likely be less than either limit."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: endOnAppearance
        in: query
        description: "optional (default = false, ie. end on disappearance from to\
          \ source) If set to true and coalesced event spans toSource, endTime of\
          \ coalesced event is set to startTime of toSource and coalesced event is\
          \ ended (thus no longer active)"
        allowEmptyValue: false
        schema:
          type: boolean
      - name: eventId
        in: query
        description: " (optional) if not specified, assumed all eventsIds.  If specified\
          \ in a query or deletion query, all other parameters are ignored."
        allowEmptyValue: false
        schema:
          type: string
      - name: eventType
        in: query
        description: "(optional) Type of the event, e.g. 'person', 'object', 'action',\
          \ 'tag'."
        allowEmptyValue: false
        schema:
          type: string
      - name: externalId
        in: query
        description: " (optional) if not specified, assumed all externalIds."
        allowEmptyValue: false
        schema:
          type: string
      - name: fifo
        in: query
        description: "optional (default = true, meaning that the expectation is that\
          \ recognized people exit in same order they enter)"
        allowEmptyValue: false
        schema:
          type: boolean
          default: true
      - name: fromSource
        in: query
        description: (required) Starting point of the queue.
        required: true
        allowEmptyValue: false
        schema:
          type: string
      - name: gender
        in: query
        description: " (optional) if not specified, assumed to be all genders."
        allowEmptyValue: false
        schema:
          type: string
      - name: homeLocation
        in: query
        description: (optional) Location name that is home or base of recognized person.
        allowEmptyValue: false
        schema:
          type: string
      - name: idClass
        in: query
        description: "(optional) One or more types of identification, typically one\
          \ of 'unidentified', 'stranger', 'threat', 'noconcern', 'concern'.  These\
          \ can be specified in a query parameter as a single item, comma-separated\
          \ list or repeated items, e.g. 'idClass=unidentified,threat' or 'idClass=stranger&idClass=noconcern'.\
          \  A single value of 'noconcern' will trigger legacy behavior, returning\
          \ events where idClass isn't set and personId exists.  A single value of\
          \ 'stranger' will trigger legacy behavior, returning events where idClass\
          \ isn't set and personId doesn't exist in the event.  See also 'source'\
          \ query parameter for similar direction on passing a list of parameter values."
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: ignoreMaxWaitTimes
        in: query
        description: optional (default = false = include maxWaitTimes into stats)
        allowEmptyValue: false
        schema:
          type: boolean
      - name: ignorePersonTypes
        in: query
        description: "(optional) list of person types to ignore; default=null, don't\
          \ ignore any person types. See 'idClass' parameter for details of passing\
          \ more than one value.for a description of how to pass list."
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: intervalTime
        in: query
        description: "(required) Interval length in milliseconds over which queue\
          \ statistics are calculated (max interval length=31 days, min interval length\
          \ = 1ms)"
        required: true
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: maxAge
        in: query
        description: " (optional) in years; if not specified, assumed no maximum age."
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: maxAvgSentiment
        in: query
        description: (optional) Maximum average sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: maxDirectGazeDuration
        in: query
        description: "(optional) Direct gaze duration in milliseconds, matching events\
          \ with a direct gaze duration shorter than the parameter value; inclusive\
          \ of the parameter value."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: maxMaxSentiment
        in: query
        description: (optional) Maximum minimum sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: maxMinSentiment
        in: query
        description: (optional) Maximum minimum sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: maxOcclusion
        in: query
        description: (optional) include events with an occlusion less than than this
          value; A value between 0.0 and 1.0.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: maxRootPersonAddDate
        in: query
        description: (optional) The maximum epoch timestamp (in milliseconds) at which
          the root person record was enrolled. The root person is defined as the original
          (first) enrolled record for a given identity. This value is inclusive.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: maxSimilarityScore
        in: query
        description: (optional) maximum similarity score of recognized person in the
          event; inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: maxSmileDuration
        in: query
        description: (optional) Max smile duration in an event in milliseconds inclusive
          of the parameter value..
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: maxWaitTime
        in: query
        description: "(required) Max time a queue wait event can exist; (max=31 days,\
          \ min=1ms)"
        required: true
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: minAge
        in: query
        description: " (optional) in years; if not specified, assumed no minimum age."
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: minAvgSentiment
        in: query
        description: (optional) Minimum average sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: minDirectGazeDuration
        in: query
        description: "(optional) Direct gaze duration in milliseconds, matching events\
          \ with a direct gaze duration longer than the parameter value; inclusive\
          \ of the parameter value."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: minMaxSentiment
        in: query
        description: (optional) Minimum maximum sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: minMinSentiment
        in: query
        description: (optional) Minimum minimum sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: minOcclusion
        in: query
        description: (optional) include events with an occlusion greater than this
          value; a value between 0.0 and 1.0.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: minRootPersonAddDate
        in: query
        description: (optional) The minimum epoch timestamp (in milliseconds) at which
          the root person record was enrolled. The root person is defined as the original
          (first) enrolled record for a given identity. This value is inclusive.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: minSimilarityScore
        in: query
        description: (optional) minimum similarity score of recognized person in the
          event; inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: minSmileDuration
        in: query
        description: (optional) Min smile duration in an event in milliseconds inclusive
          of the parameter value.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: moniker
        in: query
        description: (optional) Identification moniker of recognized person.
        allowEmptyValue: false
        schema:
          type: string
      - name: name
        in: query
        description: "(optional) name of person in event.  If $absent or $present\
          \ are passed, events without or with name set will be included respectively.\
          \ Otherwise, a regular expressionis applied to return all events where the\
          \ name provided matches case-insensitive.e.g. 'George', or 'wash' will match\
          \ 'George Washington Carver'.  Non-latin character sets are also supported,\
          \ e.g. 李 will match 李丽"
        allowEmptyValue: false
        schema:
          type: string
      - name: objectId
        in: query
        description: "(optional) The object identified in the event, e.g. 'bicycle',\
          \ which would be a common object."
        allowEmptyValue: false
        schema:
          type: string
      - name: objectType
        in: query
        description: "(optional) Classification of object identified, e.g. 'common'\
          \ or 'firearm'.  Only valid when event type = 'object'."
        allowEmptyValue: false
        schema:
          type: string
      - name: personId
        in: query
        description: " (optional) if not specified, assumed all personIds."
        allowEmptyValue: false
        schema:
          type: string
      - name: personType
        in: query
        description: "(optional) if not specified, assumed to be all person types.\
          \  In queries, can be specified as multiple values separated by '|'.  Keywords\
          \ '$present' or '$absent' indicate person type is or isn't set.  e.g. query\
          \ parameter may be &personType=Employee|Customer|$absent. If $present is\
          \ specified, other personType values passed are ignored as they are redundant."
        allowEmptyValue: false
        schema:
          type: string
      - name: region
        in: query
        description: (optional) Text label of a defined polygon within the camera's
          view. e.g. 'top-left' or 'restricted-area'.
        allowEmptyValue: false
        schema:
          type: string
      - name: rootEventId
        in: query
        description: (optional) return child events of the parameter rootEventId.
        allowEmptyValue: false
        schema:
          type: string
      - name: rootEventsOnly
        in: query
        description: "(optional) if false, include child events; when true only include\
          \ root events; defaults to true."
        allowEmptyValue: false
        schema:
          type: boolean
          default: true
      - name: rootPersonId
        in: query
        description: " (optional) if not specified, assumed all rootPersonId.  In\
          \ queries, can be specified as multiple values separated by '|'.  Also,\
          \ may provide keyword '$absent' to indicate rootPersonId isn't set or '$present'\
          \ to indicate it is set.  e.g. query parameter may be &rootPersonId=$absent"
        allowEmptyValue: false
        schema:
          type: string
      - name: sinceAddDate
        in: query
        description: "(optional) epoch time <= recorded event date (epoch time when\
          \ event was added to the event archive); if not specified, it is assumed\
          \ to be 0 (since start of archive); inclusive of the parameter value."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: sinceModDate
        in: query
        description: (optional) Epoch time in milliseconds. Filters out events with
          mod date prior OR EQUAL TO this parameter.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: sinceTime
        in: query
        description: "(optional) Epoch time in milliseconds. Includes all events that\
          \ did not yet complete or completed after the specified time and excludes\
          \ all others if not specified, assumed to be present time the default time\
          \ is 'now' and thus by includes only events that are currently not completed\
          \ (no endTime)."
        required: true
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: site
        in: query
        description: (optional) site id where the event occurred.  deprecated in favor
          of 'sites'
        allowEmptyValue: false
        schema:
          type: string
      - name: tagId
        in: query
        description: (optional) Tag identifier; used when the event type is 'tag'.
        allowEmptyValue: false
        schema:
          type: string
      - name: tagType
        in: query
        description: (optional) Type of tag in the event; used when the event type
          is 'tag'.
        allowEmptyValue: false
        schema:
          type: string
      - name: tenant
        in: query
        description: "(optional) for admin purposes, the tenant (aka partner) on behalf\
          \ of whom the query is made."
        allowEmptyValue: false
        schema:
          type: string
      - name: toSource
        in: query
        description: (required) Ending point of the queue.
        required: true
        allowEmptyValue: false
        schema:
          type: string
      - name: untilAddDate
        in: query
        description: "(optional) epoch time > recorded event date; if not specified,\
          \ it is assumed to be open ended (infinite); inclusive of the parameter\
          \ value."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: untilTime
        in: query
        description: "(optional)  Epoch time in milliseconds. includes all events\
          \ that started before specified time and excludes all others. if not specified,\
          \ assumed to be present time. Default time 'now' includes all events"
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/QueueStatsResponse'
        "400":
          description: Bad Request
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global

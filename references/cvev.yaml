          type: string
          description: name of the person that was tailgated
        tailgatedPersonId:
          type: string
          description: personId of the person that was tailgated
        tailgatedPersonType:
          type: string
          description: personType of the person that was tailgated
        tailgatedRootPersonId:
          type: string
          description: rootPersonId of the person that was tailgated
        tempCalibration:
          type: boolean
          description: If true indicates this event represents performed temperature
            calibration.
        top:
          type: number
          description: "A value between zero and one [0.0 - 1.0] that indicates latest\
            \ position of the top of the object bounding rect from the top edge of\
            \ the view frame as a factor of frame height."
          format: float
        topAtStart:
          type: number
          description: "A value between zero and one [0.0 - 1.0] that indicates starting\
            \ position of the top of the object bounding rect from the top edge of\
            \ the view frame as a factor of frame height."
          format: float
        topOfBest:
          type: number
          description: Y relative coordinate of the detected face frame top edge in
            reported event image.
          format: float
        type:
          type: string
          description: "(required) Event type, e.g. 'person', 'recognizedObject',\
            \ 'action', 'tag'"
        validationEmail:
          type: string
          description: Email of recognized person to be used for identity validation.
        validationPhone:
          type: string
          description: "Phone # of recognized person to be used for identity validation."
        width:
          type: number
          description: "A value between zero and one  [0.0 - 1.0] that indicates latest\
            \ width of the object bounding rect as a factor of frame width."
          format: float
        widthAtStart:
          type: number
          description: "A value between zero and one [0.0 - 1.0] that indicates starting\
            \ width of the object bounding rect as a factor of frame width."
          format: float
        widthOfBest:
          type: number
          description: Relative width of the detected face frame in reported event
            image.
          format: float
        yaw:
          type: number
          description: "The yaw value [-1.0  1.0]  is the left / right turning of\
            \ the face/head: -1.0 = facing left …  0.0 = facing center  …  1.0 = facing\
            \ right"
          format: float
        yawOfBest:
          type: number
          description: "Yaw recorded during a recognition event; the yaw value [-1.0\
            \  1.0]  is the left / right turning of the face/head: -1.0 = facing left\
            \ …  0.0 = facing center  …  1.0 = facing right"
          format: float
        zip:
          type: string
          description: Field added to public benefit data sharing to anonymous events
            representing the zip code where event occurred
      description: Response object used to convey event information.
    EventStatusResponse:

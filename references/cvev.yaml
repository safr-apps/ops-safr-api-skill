  /eventTypes:
    get:
      tags:
      - Event Query Interfaces
      summary: Get Event Types.
      description: Get all events types for a specified event set.  See POST /event
        for more information.<br/><br/>Requires READ_PRIVILEGE or READ_EVENT_PRIVILEGE.
      operationId: getEventTypesUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: context
        in: query
        description: " (optional) if not specified, assumed to be all contexts; commonly\
          \ used values include 'live' and 'media.'"
        allowEmptyValue: false
        schema:
          type: string
      - name: sinceModDate
        in: query
        description: (optional) Epoch time in milliseconds. Filters out events with
          mod date prior OR EQUAL TO this parameter.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: sinceTime
        in: query
        description: "(optional) Epoch time in milliseconds. Includes all events that\
          \ did not yet complete or completed after the specified time and excludes\
          \ all others if not specified, assumed to be present time the default time\
          \ is 'now' and thus by includes only events that are currently not completed\
          \ (no endTime)."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: site
        in: query
        description: (optional) site id where the event occurred.  deprecated in favor
          of 'sites'
        allowEmptyValue: false
        schema:
          type: string
      - name: source
        in: query
        description: (optional) source Id where the event occurred.
        allowEmptyValue: false
        schema:
          type: string
      - name: untilTime
        in: query
        description: "(optional)  Epoch time in milliseconds. includes all events\
          \ that started before specified time and excludes all others. if not specified,\
          \ assumed to be present time. Default time 'now' includes all events"
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/EventTypesResponse'
        "400":
          description: Bad Request
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
  /events:
    get:
      tags:
      - Event Query Interfaces
      summary: Get events.
      description: "Get events for the given query information.  Query parameters\
        \ generally act as filters; e.g. adding rootPersonId=1234-5678-abcdef will\
        \ limit the response to events where the rootPersonId is '1234-5678-abcdef'.\
        \ See individual parameters for more details.  In particular, the 'name' parameter\
        \ implements a greedy match that's exceptional to the other string type query\
        \ parameters.  'idClass' and 'source' query parameters describe generally\
        \ how to provide a list of values for API parameters that take either zero\
        \ or many values.  See 'personType' parameter for a description of how to\
        \ query for the absence or presence of a value. <br/><br/><b>Event Time Parameters</b>\
        \ 'sinceTime' and 'untilTime' are crucial to controlling event query responses.\
        \  If neither parameter is included, only open events (events without an end\
        \ time) will be returned.  If both parameters are included, events that span\
        \ either parameter or are wholly between both parameters will be included.\
        \  For both parameters, events that span the parameter will be included. \
        \ Put another way, events that begin and end before the 'sinceTime' parameter\
        \ will be excluded; likewise, events that begin and end after the 'untilTime'\
        \ parameter will be excluded.  Open events will be included  if their start\
        \ was before a non-null until time.  Including only sinceTime=0 will get all\
        \ events since the epoch and is not recommended for large event directory\
        \ repositories. <br/>NOTE: If event id is specified, all other parameters\
        \ are ignored.<br/><br/><b>Result Set Limits and Paging</b> The result will\
        \ be limited to 15,000 records from the database before coalescing. If this\
        \ limit is reached, the last event time will be recorded in an optional 'paging'\
        \ object; re-query with this epoch timestamp   set to the until parameter\
        \ re-using the previous sinceTime parameter.  This limit is not to be confused\
        \ with the 'count' parameter which is available in some APIs to limit the\
        \ number of events returned.<br/><br/>Requires READ_PRIVILEGE or READ_EVENT_PRIVILEGE."
      operationId: getEventsUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: accessClearance
        in: query
        description: "(optional) an access clearance name to match in events, e.g.\
          \ the built-in clearance 'Guest'.  See 'personType' parameter for details\
          \ of querying for the absence of an access clearance or the presence of\
          \ any access clearance using the keywords $absent or $present."
        allowEmptyValue: false
        schema:
          type: string
      - name: actionDirection
        in: query
        description: (optional) Action direction when using secondary card reader
        allowEmptyValue: false
        schema:
          type: string
      - name: actionId
        in: query
        description: "(optional) Action identifier; used when the event type is 'action'.\
          \ For query parameters, this can be a comma separated list, e.g. ?action=checkedIn,checkedInOut\
          \ or a repeated parameter, e.g. ?action=checkedIn&action=checkedOut"
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: actionType
        in: query
        description: (optional) Type of the action; used when the event type is 'action'.
        allowEmptyValue: false
        schema:
          type: string
      - name: actualMask
        in: query
        description: "if set to 'present' matches events with actualMask attribute\
          \ set to true.<br/>if set to 'missing' matches events with actualMask attribute\
          \ set to false (does not include those with mask attribute missing).<br/>if\
          \ set to 'unknown' matches events with actualMask attribute missing (null,\
          \ not set to any value).<br/>if not set matches all events regardless of\
          \ actualMask attribute presence or setting; this is the default.<br/>"
        allowEmptyValue: false
        schema:
          type: string
      - name: combineActiveEvents
        in: query
        description: "(optional) if true, includes open (currently active) events\
          \ with other events when minSeparation or minInidentifiedSeparation are\
          \ specified.  Default value is false which means that open events won't\
          \ coalesce"
        allowEmptyValue: false
        schema:
          type: boolean
          default: false
        example: false
      - name: company
        in: query
        description: (optional) Company name of recognized person.
        allowEmptyValue: false
        schema:
          type: string
      - name: context
        in: query
        description: " (optional) if not specified, assumed to be all contexts; commonly\
          \ used values include 'live' and 'media.'"
        allowEmptyValue: false
        schema:
          type: string
      - name: count
        in: query
        description: "(optional) Limit on the number of events returned.  The events\
          \ returned will be the most recent in ascending chronological order.This\
          \ parameter is different than limiting the number of events queried which\
          \ is effected by the queryLimit parameter.  When events are coalesced through\
          \ the minSeparation or minUnidentifiedSeparation parameter, the actual number\
          \ of events returned will likely be less than either limit."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: eventCategory
        in: query
        description: "(optional) String value may be either 'all' or 'person'; if\
          \ set to 'all' no filters are applied; if set to person, events of type\
          \ 'person' or type 'recognizedObject' with objectId set to 'person' are\
          \ returned. Default value is 'all'."
        allowEmptyValue: false
        schema:
          type: string
      - name: eventId
        in: query
        description: " (optional) if not specified, assumed all eventsIds.  If specified\
          \ in a query or deletion query, all other parameters are ignored."
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: eventType
        in: query
        description: "(optional) Type of the event, e.g. 'person', 'object', 'action',\
          \ 'tag'."
        allowEmptyValue: false
        schema:
          type: string
      - name: externalId
        in: query
        description: " (optional) if not specified, assumed all externalIds."
        allowEmptyValue: false
        schema:
          type: string
      - name: fromActualTemperature
        in: query
        description: (optional) the minimum Celsius actual temperature recorded in
          events.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: fromMeasuredTemperature
        in: query
        description: (optional) the minimum Celsius measured temperature recorded
          in events.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: fromMeasuredTemperatureDifference
        in: query
        description: (optional) the minimum absolute value of temperature difference
          between actual and measured temperatures in event result set.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: gender
        in: query
        description: " (optional) if not specified, assumed to be all genders."
        allowEmptyValue: false
        schema:
          type: string
      - name: group
        in: query
        description: (optional) a group or list of groups to match against events.
          Multiple group values may be specified as repeated name-value pairs or a
          comma separated list; See 'idClass' parameter for details of passing more
          than one value.  See 'personType' parameter for details of querying for
          the absence of a group name or the presence of any group name using the
          keywords $absent or $present.
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: homeLocation
        in: query
        description: (optional) Location name that is home or base of recognized person.
        allowEmptyValue: false
        schema:
          type: string
      - name: idClass
        in: query
        description: "(optional) One or more types of identification, typically one\
          \ of 'unidentified', 'stranger', 'threat', 'noconcern', 'concern'.  These\
          \ can be specified in a query parameter as a single item, comma-separated\
          \ list or repeated items, e.g. 'idClass=unidentified,threat' or 'idClass=stranger&idClass=noconcern'.\
          \  A single value of 'noconcern' will trigger legacy behavior, returning\
          \ events where idClass isn't set and personId exists.  A single value of\
          \ 'stranger' will trigger legacy behavior, returning events where idClass\
          \ isn't set and personId doesn't exist in the event.  See also 'source'\
          \ query parameter for similar direction on passing a list of parameter values."
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: ignorePersonTypes
        in: query
        description: "(optional) list of person types to ignore; default=null, don't\
          \ ignore any person types. See 'idClass' parameter for details of passing\
          \ more than one value.for a description of how to pass list."
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: mask
        in: query
        description: "if set to 'present' matches events with mask attribute set to\
          \ true.<br/>if set to 'missing' matches events with mask attribute set to\
          \ false (does not include those with mask attribute missing).<br/>if set\
          \ to 'unknown' matches events with mask attribute missing (null, not set\
          \ to any value).<br/>if not set matches all events regardless of mask attribute\
          \ presence or setting; this is the default."
        allowEmptyValue: false
        schema:
          type: string
      - name: maxAge
        in: query
        description: " (optional) in years; if not specified, assumed no maximum age."
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: maxAvgSentiment
        in: query
        description: (optional) Maximum average sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: maxDirectGazeDuration
        in: query
        description: "(optional) Direct gaze duration in milliseconds, matching events\
          \ with a direct gaze duration shorter than the parameter value; inclusive\
          \ of the parameter value."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: maxMaxSentiment
        in: query
        description: (optional) Maximum minimum sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: maxMinSentiment
        in: query
        description: (optional) Maximum minimum sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: maxOcclusion
        in: query
        description: (optional) include events with an occlusion less than than this
          value; A value between 0.0 and 1.0.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: maxRootPersonAddDate
        in: query
        description: (optional) The maximum epoch timestamp (in milliseconds) at which
          the root person record was enrolled. The root person is defined as the original
          (first) enrolled record for a given identity. This value is inclusive.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: maxSimilarityScore
        in: query
        description: (optional) maximum similarity score of recognized person in the
          event; inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: maxSmileDuration
        in: query
        description: (optional) Max smile duration in an event in milliseconds inclusive
          of the parameter value..
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: maxStartDate
        in: query
        description: (optional) limits query to events where the start date is less
          than the provided value.  Used in paging to return next page of events until
          no events are returned.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: minAge
        in: query
        description: " (optional) in years; if not specified, assumed no minimum age."
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: minAvgSentiment
        in: query
        description: (optional) Minimum average sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: minDirectGazeDuration
        in: query
        description: "(optional) Direct gaze duration in milliseconds, matching events\
          \ with a direct gaze duration longer than the parameter value; inclusive\
          \ of the parameter value."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: minDuration
        in: query
        description: "(optional) Minimum duration in milliseconds of events after\
          \ combination.  If not specified, events of any duration are returned; inclusive\
          \ of the parameter value."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: minMaxSentiment
        in: query
        description: (optional) Minimum maximum sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: minMinSentiment
        in: query
        description: (optional) Minimum minimum sentiment in an event; a number between
          -1.0 and 1.0 inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: minOcclusion
        in: query
        description: (optional) include events with an occlusion greater than this
          value; a value between 0.0 and 1.0.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: minRootPersonAddDate
        in: query
        description: (optional) The minimum epoch timestamp (in milliseconds) at which
          the root person record was enrolled. The root person is defined as the original
          (first) enrolled record for a given identity. This value is inclusive.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: minSeparation
        in: query
        description: (optional) Distance in milliseconds between similar events ending
          and starting used to combine events.  Default value is zero which means
          don't coalesce events; inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: minSimilarityScore
        in: query
        description: (optional) minimum similarity score of recognized person in the
          event; inclusive of the parameter value.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: minSmileDuration
        in: query
        description: (optional) Min smile duration in an event in milliseconds inclusive
          of the parameter value.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: minStartDate
        in: query
        description: (optional) limits query to events where the start date is greater
          than provided value.  Used in paging to return next page of events until
          no events are returned.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: minUnidentifiedSeparation
        in: query
        description: (optional) Distance in milliseconds between similar events ending
          and starting used to combine events for events with unidentified persons.  Defaults
          to same value as minSeparation.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: moniker
        in: query
        description: (optional) Identification moniker of recognized person.
        allowEmptyValue: false
        schema:
          type: string
      - name: name
        in: query
        description: "(optional) name of person in event.  If $absent or $present\
          \ are passed, events without or with name set will be included respectively.\
          \ Otherwise, a regular expressionis applied to return all events where the\
          \ name provided matches case-insensitive.e.g. 'George', or 'wash' will match\
          \ 'George Washington Carver'.  Non-latin character sets are also supported,\
          \ e.g. 李 will match 李丽"
        allowEmptyValue: false
        schema:
          type: string
      - name: objectId
        in: query
        description: "(optional) The object identified in the event, e.g. 'bicycle',\
          \ which would be a common object."
        allowEmptyValue: false
        schema:
          type: string
      - name: objectType
        in: query
        description: "(optional) Classification of object identified, e.g. 'common'\
          \ or 'firearm'.  Only valid when event type = 'object'."
        allowEmptyValue: false
        schema:
          type: string
      - name: peerEventId
        in: query
        description: (optional) filters on a particular peer event id.
        allowEmptyValue: false
        schema:
          type: string
      - name: personId
        in: query
        description: " (optional) if not specified, assumed all personIds."
        allowEmptyValue: false
        schema:
          type: string
      - name: personType
        in: query
        description: "(optional) if not specified, assumed to be all person types.\
          \  In queries, can be specified as multiple values separated by '|'.  Keywords\
          \ '$present' or '$absent' indicate person type is or isn't set.  e.g. query\
          \ parameter may be &personType=Employee|Customer|$absent. If $present is\
          \ specified, other personType values passed are ignored as they are redundant."
        allowEmptyValue: false
        schema:
          type: string
      - name: queryLimit
        in: query
        description: "(optional) limits database query if less than system max query,\
          \ which is 15 thousand events.  This is different than eventCount parameter\
          \ which only limits the result set. When events are coalesced through the\
          \ minSeparation or minUnidentifiedSeparation parameter, the actual number\
          \ of events returned will likely be less than either limit."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: region
        in: query
        description: (optional) Text label of a defined polygon within the camera's
          view. e.g. 'top-left' or 'restricted-area'.
        allowEmptyValue: false
        schema:
          type: string
      - name: rootEventId
        in: query
        description: (optional) return child events of the parameter rootEventId.
        allowEmptyValue: false
        schema:
          type: string
      - name: rootEventsOnly
        in: query
        description: "(optional) if false, include child events; when true only include\
          \ root events; defaults to true."
        allowEmptyValue: false
        schema:
          type: boolean
          default: true
      - name: rootPersonId
        in: query
        description: " (optional) if not specified, assumed all rootPersonId.  In\
          \ queries, can be specified as multiple values separated by '|'.  Also,\
          \ may provide keyword '$absent' to indicate rootPersonId isn't set or '$present'\
          \ to indicate it is set.  e.g. query parameter may be &rootPersonId=$absent"
        allowEmptyValue: false
        schema:
          type: string
      - name: sinceAddDate
        in: query
        description: "(optional) epoch time <= recorded event date (epoch time when\
          \ event was added to the event archive); if not specified, it is assumed\
          \ to be 0 (since start of archive); inclusive of the parameter value."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: sinceModDate
        in: query
        description: (optional) Epoch time in milliseconds. Filters out events with
          mod date prior OR EQUAL TO this parameter.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: sinceTime
        in: query
        description: "(optional) Epoch time in milliseconds. Includes all events that\
          \ did not yet complete or completed after the specified time and excludes\
          \ all others if not specified, assumed to be present time the default time\
          \ is 'now' and thus by includes only events that are currently not completed\
          \ (no endTime)."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: site
        in: query
        description: (optional) site id where the event occurred.  deprecated in favor
          of 'sites'
        allowEmptyValue: false
        schema:
          type: string
      - name: sites
        in: query
        description: (optional) a site Id or list of source ids where an event occurred.
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: sortOrder
        in: query
        description: '(optional) String value either ''ascending'' or ''descending'';
          after limiting the result set this sort order is applied before returning
          the remaining result.  Defaults to ascending. '
        allowEmptyValue: false
        schema:
          type: string
      - name: source
        in: query
        description: "(optional) a source Id or list of source ids where an event\
          \ occurred.  A single source id may be provided as a single query parameter,\
          \ e.g. source=front%20entrance.  Multiple source ids can be provided by\
          \ repeating the source query parameter, e.g. source=front%20entrance&source=back%20entrance&source=kitchen%20door,\
          \ or by specifying a comma-separated list, e.g. source=front%20entrance,back%20entrance,kitchen%20door.\
          \  See also 'idClass' query parameter for similar direction on passing a\
          \ list of parameter values."
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: spanSources
        in: query
        description: "(optional) When true, allows event coalescing across multiple\
          \ sources.  Default value is false."
        allowEmptyValue: false
        schema:
          type: boolean
          default: false
        example: false
      - name: spanUnidentifiedSources
        in: query
        description: "(optional) When true, allows event coalescing across multiple\
          \ sources for unidentified persons.   Defaults to the same value as spanSources."
        allowEmptyValue: false
        schema:
          type: boolean
      - name: srcUserId
        in: query
        description: (optional)
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: tagId
        in: query
        description: (optional) Tag identifier; used when the event type is 'tag'.
        allowEmptyValue: false
        schema:
          type: string
      - name: tagType
        in: query
        description: (optional) Type of tag in the event; used when the event type
          is 'tag'.
        allowEmptyValue: false
        schema:
          type: string
      - name: tenant
        in: query
        description: "(optional) for admin purposes, the tenant (aka partner) on behalf\
          \ of whom the query is made."
        allowEmptyValue: false
        schema:
          type: string
      - name: toActualTemperature
        in: query
        description: (optional) the maximum Celsius actual temperature recorded in
          events.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: toMeasuredTemperature
        in: query
        description: (optional) the maximum Celsius measured temperature recorded
          in events.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: toMeasuredTemperatureDifference
        in: query
        description: (optional) the maximum absolute value of temperature difference
          between actual and measured temperatures in event result set.
        allowEmptyValue: false
        schema:
          type: number
          format: float
      - name: untilAddDate
        in: query
        description: "(optional) epoch time > recorded event date; if not specified,\
          \ it is assumed to be open ended (infinite); inclusive of the parameter\
          \ value."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: untilTime
        in: query
        description: "(optional)  Epoch time in milliseconds. includes all events\
          \ that started before specified time and excludes all others. if not specified,\
          \ assumed to be present time. Default time 'now' includes all events"
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/EventQueryResponse'
        "400":
          description: Bad Request
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":

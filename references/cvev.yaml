          format: int64
        outboundWithoutResets:
          type: integer
          description: Total outbound events without reset adjustments applied.
          format: int64
        peakOccupancy:
          type: integer
          description: Max occupancy.
          format: int64
        startTime:
          type: integer
          description: Start time in epoch milliseconds.
          format: int64
      description: Aggregate occupancy statistics.

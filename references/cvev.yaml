    OccupancyStatSource:
      title: OccupancyStatSource
      required:
      - inOutCalibration
      - inboundDirectionId
      - outboundDirectionId
      type: object
      properties:
        inOutCalibration:
          type: number
          description: (optional) default value  is 0.0.  This is provided as rate
            proportion (not a percent):inOutCalibration = (Inbound Detection Rate
            / Outbound Detection Rate) - 1.0.
          format: float
        inboundDirectionId:
          type: string
          description: "(optional) possible values are 'left', 'right', 'up' and 'down'.\
            \ default value is 'none'"
        outboundDirectionId:
          type: string
          description: "(optional) possible values are 'left', 'right', 'up' and 'down'.\
            \ default value is 'none'"
        sourceId:
          type: string
      description: Description of a source via sourceId used to count entries and
        exits to a given site.

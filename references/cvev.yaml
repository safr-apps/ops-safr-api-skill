      properties:
        accessActivatedUntil:
          type: integer
          description: Date time when access expires; Epoch time in milliseconds
          format: int64
        accessCardFormat:
          type: string
          description: '(optional) default=''Wiegand-26''<br>Defines method by which
            accessCardId and accessFacilityId need to be encoded for sending to Access
            Control System. ''Wiegand-26'' refers to standard 26-bit Wiegand format.
            Many other formats exist.  Some are individualized per corporation (e.g.
            Corporate 1000). This string will be structured to define specifics of
            the encoding.  '
        accessCardId:
          type: string
          description: Physical Access Card System identifier - normally a number.
            This is encoded together with accessCardId to produce Wiegand access card
            data sent to Access Control System.  Encoding can vary and is system dependent.
            Standard 26-bit encoding format is commonly used.
        accessCardUID:
          type: string
          description: "Card UID, usually a serial Id composed of card Id and facility\
            \ id encoded or encrypted depending on card format."
        accessClearance:
          type: string
          description: "Access clearance given to person referenced by the event via\
            \ personId.One of: \"none\", \"root\", \"resident\", \"guest\" or configured\
            \ custom clearance; optional; default = \"none\"It must be other than\
            \ \"none\" for access privileges to be honored. "
        accessClearanceLevel:
          type: integer
          description: "Required when accessClearance is set.Used for ordering clearance\
            \ ids from most to least restrictive.  In range from -1 to 100.The higher\
            \ the clearance level, the less restrictive it is."
          format: int64
        accessClearanceName:
          type: string
          description: "Optional, set when available."
        accessClearanceType:
          type: string
          description: "Optional, set when available; valid values are null and 'zone'"
        accessFacilityId:
          type: string
          description: Physical Access Card System facility id - normally a number.
        accessType:
          type: string
          description: "Possible values include face “card”, “faceAndCard”, “keypad”\
            , “faceAndKeypad”, “mobileCredential”, “faceAndMobileCredential”"
        actionDirection:
          type: string
          description: "Direction of action when secondary card reader is enabled.\
            \  Possible values include 'In', 'Out'"
        actionId:

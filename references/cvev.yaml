openapi: 3.0.1
info:
  title: SAFR Computer Vision Event Server API
  description: "<H4>An API to publish, query, modify and delete Computer Vision recognition\
    \ events.</H4><p>See <a href=\"/docs/index.html#/Event%20Query%20Interfaces/getEventsUsingGET\"\
    \ target=\"_self\">GET /events API</a> for general information on querying for\
    \ events and the importance of sinceTime and untilTime parameters.</p><p>See <a\
    \ href=\"/docs/index.html#/Event%20Update%20Interfaces/eventUsingPOST\" target=\"\
    _self\">POST /event API</a> for details about event types and required fields.\
    \  <p>For GET /events and DELETE /events, if event id is specified, all other\
    \ parameters are ignored.</p><p><b>Database Limits and Result Set Limits</b> Query\
    \ APIs generally enforce a limit of 15 thousand records.  This limit can be extended\
    \ in applications.properties (not recommended) or reduced using the 'queryLimit'\
    \ parameter.  The 'count' parameters only effects the number of events returned\
    \ from the server, not the underlying query result.The database limit is applied\
    \ prior to event coalescing, so the actual number of events returned may be fewer\
    \ than 15 thousand.  See GET /events API for more details.</p><p><b>Automatic\
    \ Ending of Events</b> Every five minutes, Event Server will check to see that\
    \ all events started within four hours of current server time and unmodified in\
    \ the last five minutes have a non-zero end time. Events matching this criteria\
    \ will have their end time set to the current server time. In order to allow for\
    \ maintenance and downtime, every twelve hours, any events within an hour and\
    \ a week old as measured by start time will have their end time set to the current\
    \ server time.</p><br/><H5>Calling APIs</H5><p>In order to use the 'Try it out'\
    \ feature of APIs below, click the Authorize button and enter your user id and\
    \ base64 of your password separated by a colon, i.e. userId:<i>base64</i>(password).</p>"
  contact:
    name: safr-feedback@realnetworks.com
    email: safr-feedback@realnetworks.com
  version: 3.34.830
servers: []
tags:
- name: Event Query Interfaces
  description: Interfaces to query events in the database
- name: Event Update Interfaces
  description: "Interfaces to save, update and remove events in event database"
- name: Temperature Query Interfaces
  description: Interfaces to query temperature information from events in the database
- name: Long Polling Interfaces
  description: Used to wait on events to occur.
- name: Alarm Interfaces
  description: Interfaces to set alarms triggered by posted events
- name: Event Archiving Interfaces
  description: Interfaces to set up and manage the archiving of events in a remote
    account
- name: Biometric Indexing Interfaces
  description: Interfaces to add biometric data to events and search events by biometric
    data
paths:
  /alarm/{alarmName}:
    delete:
      tags:
      - Alarm Interfaces
      summary: Delete Alarm
      description: Delete existing alarms.<br/><br/>Requires CONFIG_PRIVILEGE.
      operationId: deleteAlarmUsingDELETE
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: alarmName
        in: path
        description: alarmName
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
  /alarms:
    get:
      tags:
      - Alarm Interfaces
      summary: Get Alarms
      description: Get Alarms set to trigger on matching posted events.<br/><br/>Requires
        READ_PRIVILEGE or SUPER_READ_PRIVILEGE.
      operationId: getAlarmsUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GetAlarmsResponse'
        "400":
          description: Bad Request
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
    post:
      tags:
      - Alarm Interfaces
      summary: Post Alarm
      description: Post Alarm to trigger on matching posted event.<br/><br/>Requires
        CONFIG_PRIVILEGE.
      operationId: postAlarmsUsingPOST
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      requestBody:
        description: request
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/PostAlarmsRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: object
        "400":
          description: Bad Request
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
      x-codegen-request-body-name: request
  /event:
    post:
      tags:
      - Event Update Interfaces
      summary: Create or update an event.
      description: Report new event or update an existing event. Fields not present
        in a request will not be removed.  <br/><br/>Requires WRITE_PRIVILEGE.
      operationId: eventUsingPOST
      parameters:
      - name: X-Forwarded-For
        in: header
        description: X-Forwarded-For
        schema:
          type: string
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: sigFaceMaskVersion
        in: query
        description: (optional) model version of the sigFaceMask and sigFaceNoMask
          fields provided in the event
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: sigFaceVersion
        in: query
        description: (optional) model version of the sigFace field provided in the
          event
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: sync
        in: query
        description: (optional) Ensure we store the person Id in the POST /event request
          XOR'd with tenantId and directory to match original id in db.
        allowEmptyValue: false
        schema:
          type: boolean
      requestBody:
        description: eventRequest
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/EventBioRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: object
        "400":
          description: Bad Request
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
      x-codegen-request-body-name: eventRequest
  /event/status:
    get:
      tags:
      - Long Polling Interfaces
      summary: Poll for changes for a particular directory.
      description: Poll for changes on a particular site.
      operationId: pollStatusUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: activity
        in: query
        description: "(optional) Default value is 'all', matching past events.  When\
          \ set to 'added', returns new events that match 'site', 'source' and 'since'\
          \ parameters."
        allowEmptyValue: false
        schema:
          type: string
      - name: since
        in: query
        description: "(optional) Epoch date in milliseconds to consider when looking\
          \ at next event modDate.  If omitted, the lastModDate for this directory\
          \ will be returned and should be used as the basis for the next call."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Success -- last event mod date returned.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/EventStatusResponse'
        "204":
          description: No Content -- no new events.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/EventStatusResponse'
        "400":
          description: Bad Request
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
  /event/status/{site}:
    get:
      tags:
      - Long Polling Interfaces
      summary: Poll for changes on a particular site.
      description: Poll for changes on a particular site and source.
      operationId: pollSiteUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: activity
        in: query
        description: "(optional) Default value is 'all', matching past events.  When\
          \ set to 'added', returns new events that match 'site', 'source' and 'since'\
          \ parameters."
        allowEmptyValue: false
        schema:
          type: string
      - name: since
        in: query
        description: "(optional) Epoch date in milliseconds to consider when looking\
          \ at next event modDate.  If omitted, the lastModDate for this directory\
          \ will be returned and should be used as the basis for the next call."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: site
        in: path
        description: (optional) site id where the event occurred.  deprecated in favor
          of 'sites'
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success -- last event mod date returned.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/EventStatusResponse'
        "204":
          description: No Content -- no new events.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/EventStatusResponse'
        "400":
          description: Bad Request
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
  /event/status/{site}/{source}:
    get:
      tags:
      - Long Polling Interfaces
      summary: Poll for changes on a particular site and source.
      description: Poll for changes on a particular site and source.
      operationId: pollSiteAndSourceUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: activity
        in: query
        description: "(optional) Default value is 'all', matching past events.  When\
          \ set to 'added', returns new events that match 'site', 'source' and 'since'\
          \ parameters."
        allowEmptyValue: false
        schema:
          type: string
      - name: since
        in: query
        description: "(optional) Epoch date in milliseconds to consider when looking\
          \ at next event modDate.  If omitted, the lastModDate for this directory\
          \ will be returned and should be used as the basis for the next call."
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: site
        in: path
        description: (optional) site id where the event occurred.  deprecated in favor
          of 'sites'
        required: true
        schema:
          type: string
      - name: source
        in: path
        description: (optional) source Id where the event occurred.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success -- last event mod date returned.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/EventStatusResponse'
        "204":
          description: No Content -- no new events since provided last since.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/EventStatusResponse'
        "400":
          description: Bad Request
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
  /eventBioindex/configuration:
    put:
      tags:
      - Biometric Indexing Interfaces
      summary: Post Bio-Indexing configuration change
      description: Post Bio-Indexing configuration change which forces.reconciliation
        between configuration and any running indexing processes.  Generally called
        by system.<br/><br/>Requires SUPER_CONFIG_PRIVILEGE.
      operationId: updatedBioIndexConfigurationUsingPUT
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      requestBody:
        description: body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BioIndexConfigurationChange'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BioIndexConfigurationChangeResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
      x-codegen-request-body-name: body
  /eventBioindex/event/{eventId}:
    put:
      tags:
      - Biometric Indexing Interfaces
      summary: Put Bio-Indexing Request
      description: Put request to create biometric data index for a single event.Generally
        called by the system when balancing an ongoing indexing operation across servers.<br/><br/>Requires
        WRITE_PRIVILEGE or SUPER_WRITE_PRIVILEGE.
      operationId: putIndexForEventUsingPUT
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: eventId
        in: path
        description: eventId
        required: true
        schema:
          type: string
      - name: tenant
        in: query
        description: tenant
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
    delete:
      tags:
      - Biometric Indexing Interfaces
      summary: Delete Bio-Indexing Request
      description: Delete biometric data for a particular event.<br/><br/>Requires
        DELETE_PRIVILEGE or SUPER_DELETE_PRIVILEGE.
      operationId: deleteIndexForEventUsingDELETE
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: eventId
        in: path
        description: eventId
        required: true
        schema:
          type: string
      - name: tenant
        in: query
        description: tenant
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
  /eventBioindex/faceSearch:
    post:
      tags:
      - Biometric Indexing Interfaces
      summary: Post new search request
      description: "Post new search request with a face image to search in events\
        \ described by parameters. Returns searchId to be used in GET /search/{searchId}\
        \ and DELETE /search/{searchId} API calls.<br/>NOTE: after two hours, search\
        \ results are cleaned up automatically<br/><br/>Requires READ_PRIVILEGE."
      operationId: postSearchUsingPOST
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: X-RPC-FACES-GROUPING-THRESHOLD
        in: header
        description: X-RPC-FACES-GROUPING-THRESHOLD
        schema:
          type: number
          format: float
      - name: maxAge
        in: query
        description: maxAge
        schema:
          type: integer
          format: int32
      - name: minAge
        in: query
        description: minAge
        schema:
          type: integer
          format: int32
      - name: similarLimit
        in: query
        description: similarLimit
        schema:
          type: integer
          format: int32
      - name: sinceTime
        in: query
        description: sinceTime
        schema:
          type: integer
          format: int64
      - name: site
        in: query
        description: site
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: source
        in: query
        description: source
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: untilTime
        in: query
        description: untilTime
        schema:
          type: integer
          format: int64
      requestBody:
        description: image
        content:
          application/octet-stream:
            schema:
              type: string
              format: byte
          image/jpeg:
            schema:
              type: string
              format: byte
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BioIndexSearchIdResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
      x-codegen-request-body-name: image
  /eventBioindex/faceSearch/{searchId}:
    get:
      tags:
      - Biometric Indexing Interfaces
      summary: Get face search results
      description: "Get face search results from a previously initiated search request.<br/>NOTE:\
        \ after two hours, search results are cleaned up automatically<br/><br/>Requires\
        \ READ_PRIVILEGE."
      operationId: getSearchUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: searchId
        in: path
        description: searchId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BioIndexSearchResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
      security:
      - Authentication:
        - global
    delete:
      tags:
      - Biometric Indexing Interfaces
      summary: Delete face search
      description: "Delete previously posted search request and results.<br/>NOTE:\
        \ after two hours, search results are cleaned up automatically<br/><br/>Requires\
        \ DELETE_PRIVILEGE."
      operationId: deleteSearchUsingDELETE
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: searchId
        in: path
        description: searchId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":

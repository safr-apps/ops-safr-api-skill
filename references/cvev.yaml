          format: double
        duration:
          type: integer
          description: Duration in  milliseconds.
          format: int64
        endOccupancy:
          type: integer
          description: Occupancy at the end of the last interval.
          format: int64
        inbound:
          type: integer
          description: Total inbound events.
          format: int64
        inboundWithoutResets:

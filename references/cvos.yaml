openapi: 3.0.1
info:
  title: SAFR Object Server API
  description: '<H4>An API to publish, query and modify objects in a store.</H4> <H5>Summary</H5>Objects
    are stored and queried using the Object Storage Interface below.  They are available
    by tenant and directory as specified by the user credentials and X-RPC-DIRECTORY
    header respectively. <br/>Streams, Preferences and Logs are stored and queried
    per tenant and ignore the X-RPC-DIRECTORY header. <br/>Common objects are system
    wide read-only objects managed by system administrators, available to all tenants.
    <br/>Objects stored by SAFR Desktop and other SAFR client applications include
    identity reference images, recognition event scene images and tracking results.  For
    detailed information on images stored by SAFR applications see the following appendix:<H5>Appendix
    A: <a href="/docs/appendix.html">SAFR System Stored Objects</a></H5><H5>Calling
    APIs</H5><p>In order to use the ''Try it out'' feature of APIs below, click the
    ''Authorize'' button and enter your user id and base64 of your password separated
    by a colon, i.e. userId:<i>base64</i>(password).</p>'
  contact:
    name: safr-feedback@realnetworks.com
    email: safr-feedback@realnetworks.com
  version: 3.0.297.1
servers: []
tags:
- name: Person Object Interface
  description: Interface to get person face images
- name: Object Storage Interfaces
  description: Store, fetch and delete objects.
- name: Stream Interfaces
  description: Store, fetch and delete transient stream objects.
- name: Admin Object Storage Interfaces
  description: APIs available to administrators only.
- name: Common Object Interfaces
  description: Fetch objects common to all tenants and directories
- name: Preferences Interfaces
  description: Store, fetch and delete preferences objects shared by all directories
    within a tenant.
- name: Logs Interfaces
  description: Store, fetch and delete log objects shared by all directories within
    a tenant.
- name: Map Storage and Searching Interfaces
  description: Interface to store and search maps and coordinates

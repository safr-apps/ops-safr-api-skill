components:
  schemas:
    CopyDestination:
      title: CopyDestination
      type: object
      properties:
        directory:
          type: string
        password:
          type: string
        path:
          type: string
        userId:
          type: string
    CopyRequest:
      title: CopyRequest
      type: object
      properties:
        destination:
          $ref: '#/components/schemas/CopyDestination'
    ErrorResponse:
      title: ErrorResponse
      type: object
      properties:
        error:
          type: string
        errorReason:
          type: string
        message:
          type: string
        path:
          type: string
        status:
          type: integer
          format: int32
        timestamp:
          type: integer
          format: int64
        verb:
          type: string
    ListResponse:
      title: ListResponse
      type: object
      properties:
        id:
          type: string
        names:
          type: array
          items:
            type: string
    MapDetails:
      title: MapDetails
      type: object
      properties:
        area:
          type: number
          description: in kilometers squared, 100.0 = 100km2<br/> if this is not provided
            when map is posted, <br/>it is computed based on map coordinates if they
            are provided.
          format: double
        bottomLatitude:
          type: number
          description: Optional floating point min latitude of the bottom edge of
            the map.<br/>Valid latitude values are between -90 and 90, both inclusive.
          format: double
        centerLatitude:
          type: number
          description: Computed value generated from input latitude
          format: double
        centerLongitude:
          type: number
          description: Computed value generated from input latitude
          format: double
        id:
          type: string
          description: Map object id unique within a tenant
        leftLongitude:
          type: number
          description: Optional floating point max longitude of the left edge of the
            map<br/>Valid longitude values are between -180 and 180, both inclusive.
          format: double
        name:
          type: string
          description: Optional, friendly map name
        rightLongitude:
          type: number
          description: Optional floating point max longitude of the right edge of
            the map<br/>Valid longitude values are between -180 and 180, both inclusive.
          format: double
        topLatitude:
          type: number
          description: Optional floating point max latitude of the top edge of the
            map<br/>Valid latitude values are between -90 and 90, both inclusive.
          format: double
        type:
          type: string
          description: Map object type.  One of:<br/>"satellite", <br/>"street", <br/>"terrain",
            <br/>"labeledSatellite"
    ModDateResponse:
      title: ModDateResponse
      type: object
      properties:
        modDate:
          type: integer
          format: int64
    Response object:
      title: Response object
      type: object
      properties:
        maps:
          type: array
          items:
            $ref: '#/components/schemas/MapDetails'
    ResponseEntity:
      title: ResponseEntity
      type: object
      properties:
        body:
          type: object
          properties: {}
        statusCode:
          type: string
          enum:
          - 100 CONTINUE
          - 101 SWITCHING_PROTOCOLS
          - 102 PROCESSING
          - 103 CHECKPOINT
          - 200 OK
          - 201 CREATED
          - 202 ACCEPTED
          - 203 NON_AUTHORITATIVE_INFORMATION
          - 204 NO_CONTENT
          - 205 RESET_CONTENT
          - 206 PARTIAL_CONTENT
          - 207 MULTI_STATUS
          - 208 ALREADY_REPORTED
          - 226 IM_USED
          - 300 MULTIPLE_CHOICES
          - 301 MOVED_PERMANENTLY
          - 302 FOUND
          - 302 MOVED_TEMPORARILY
          - 303 SEE_OTHER
          - 304 NOT_MODIFIED
          - 305 USE_PROXY
          - 307 TEMPORARY_REDIRECT
          - 308 PERMANENT_REDIRECT
          - 400 BAD_REQUEST
          - 401 UNAUTHORIZED
          - 402 PAYMENT_REQUIRED
          - 403 FORBIDDEN
          - 404 NOT_FOUND
          - 405 METHOD_NOT_ALLOWED
          - 406 NOT_ACCEPTABLE
          - 407 PROXY_AUTHENTICATION_REQUIRED
          - 408 REQUEST_TIMEOUT
          - 409 CONFLICT
          - 410 GONE
          - 411 LENGTH_REQUIRED
          - 412 PRECONDITION_FAILED
          - 413 PAYLOAD_TOO_LARGE
          - 413 REQUEST_ENTITY_TOO_LARGE
          - 414 URI_TOO_LONG
          - 414 REQUEST_URI_TOO_LONG
          - 415 UNSUPPORTED_MEDIA_TYPE
          - 416 REQUESTED_RANGE_NOT_SATISFIABLE
          - 417 EXPECTATION_FAILED
          - 418 I_AM_A_TEAPOT
          - 419 INSUFFICIENT_SPACE_ON_RESOURCE
          - 420 METHOD_FAILURE
          - 421 DESTINATION_LOCKED
          - 422 UNPROCESSABLE_ENTITY
          - 423 LOCKED
          - 424 FAILED_DEPENDENCY
          - 426 UPGRADE_REQUIRED
          - 428 PRECONDITION_REQUIRED
          - 429 TOO_MANY_REQUESTS
          - 431 REQUEST_HEADER_FIELDS_TOO_LARGE
          - 451 UNAVAILABLE_FOR_LEGAL_REASONS
          - 500 INTERNAL_SERVER_ERROR
          - 501 NOT_IMPLEMENTED
          - 502 BAD_GATEWAY
          - 503 SERVICE_UNAVAILABLE
          - 504 GATEWAY_TIMEOUT
          - 505 HTTP_VERSION_NOT_SUPPORTED
          - 506 VARIANT_ALSO_NEGOTIATES
          - 507 INSUFFICIENT_STORAGE
          - 508 LOOP_DETECTED
          - 509 BANDWIDTH_LIMIT_EXCEEDED
          - 510 NOT_EXTENDED
          - 511 NETWORK_AUTHENTICATION_REQUIRED
        statusCodeValue:
          type: integer
          format: int32
    StreamingResponseBody:
      title: StreamingResponseBody
      type: object
  securitySchemes:
    Authentication:
      type: apiKey
      name: X-RPC-AUTHORIZATION
      in: header

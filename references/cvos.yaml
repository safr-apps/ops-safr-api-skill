  /sharedstream/{id}:
    get:
      tags:
      - Stream Interfaces
      summary: Get a shared stream
      description: Returns a last posted stream packet. After the retrieval the packet
        is not removed.<br/>When packet is returned, X-RPC-STREAM-TIME response header
        is also returned. The X-RPC-STREAM-TIME response header indicates the time
        when the stream packet was posted. The value of the X-RPC-STREAM-TIME header
        is in milliseconds and can be used in the since query parameter in the subsequent
        calls. When since query parameter is specified, the stream packet is returned
        only when stream packet is posted more recently than the time in the since
        query parameter. When no since parameter is specified, latest stream packet
        is returned if present even if returned in prior call.<br/><br/>Requires READ_PRIVILEGE.

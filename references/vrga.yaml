openapi: 3.0.1
info:
  title: SAFR VIRGA Server API
  description: "<H4>An API to Publish and Query Worker and Feed configuration and\
    \ status.</H4><H5>Summary</H5>Worker instances (usually a Virgo instance) manage\
    \ feeds. They report status and receive configuration updates via POST /status\
    \ API; they are identified by client id.  All other APIs should only be called\
    \ by an administrative client application. Feeds process video streams, making\
    \ calls to CoVi for recognition, calls to Event Server to post recognition events\
    \ and calls to CVOS to deposit stream captures. Both worker and feed configuration\
    \ is inherited from a tenant configuration and root configuration; taken together,\
    \ root and tenant configuration are referred to as Master configurations.  Tenant\
    \ configuration overrides root configuration and instance configuration overrides\
    \ tenant configuration.  System admins  (with SUPER_CONFIG_PRIVILEGE) can modify\
    \ root configurations and configurations for other tenants. Tenant admins (with\
    \ CONFIG_PRIVILEGE) can modify configurations shared by all workers created for\
    \ that tenant. A worker instance or individual feed can have its configuration\
    \ modified to override the default values or assign a stream for processing. \
    \ Through the  tasks API, a user without configuration privileges can assign a\
    \ stream to an available feed. <br/><H5>Calling APIs</H5><p>In order to use the\
    \ 'Try it out' feature of APIs below, click the Authorize button and enter your\
    \ user id and base64 of your password separated by a colon, i.e. userId:<i>base64</i>(password).</p>"
  contact:
    name: safr-feedback@realnetworks.com
    email: safr-feedback@realnetworks.com
  version: 3.34.816
servers: []
tags:
- name: Configuration Query Interfaces
  description: Interfaces to Query Configuration Settings
- name: Configuration Update Interfaces
  description: Interfaces to save and update configuration settings
- name: Status Interfaces
  description: Interfaces get and set status on Worker video stream processors.
- name: Stream Interfaces
  description: Interfaces to Create and Assign Stream Urls and Extend their Leases.
- name: Task Interfaces
  description: "Interfaces to Assign, Remove and View Processing Tasks to Available\
    \ Feeds."
- name: Zones Interfaces
  description: Interfaces to save and update Zones
- name: Zones Sync Interfaces
  description: Interfaces to save and update Zones from a remote system
paths:
  /config/master:
    get:
      tags:
      - Configuration Query Interfaces
      summary: Gets master configuration for tenant or the root master configuration
      description: Gets master configuration for tenant or the root master configuration
        <br/><br/>Requires READ_PRIVILEGE.
      operationId: getMasterConfigurationUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: root
        in: query
        description: "(optional) defaults to true.  If false, excludes root configuration."
        allowEmptyValue: false
        schema:
          type: boolean
      - name: tenant
        in: query
        description: (optional) tenant or list of tenants for whom to get configuration.
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: tenants
        in: query
        description: "(optional) defaults to true.  If false, excludes tenant configurations."
        allowEmptyValue: false
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/MasterConfigsResponse'
      deprecated: false
      security:
      - Authentication:
        - global
    put:
      tags:
      - Configuration Update Interfaces
      summary: Update the master configuration for a tenant
      description: "Update the master instance and feed configuration for a tenant.With\
        \ SUPER_CONFIG_PRIVILEGE, user may update configurations of different tenants\
        \ or the root configuration.In order to specify ROOT configuration, leave\
        \ the request 'tenant' field blank.<br/></br>Requires CONFIG_PRIVILEGE."
      operationId: putMasterConfigurationUsingPUT
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      requestBody:
        description: request
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/MasterConfigsRequest'
        required: true
      responses:
        "204":
          description: No Content
          content: {}
      deprecated: false
      security:
      - Authentication:
        - global
      x-codegen-request-body-name: request
  /config/master/{tenantId}:
    delete:
      tags:
      - Configuration Update Interfaces
      summary: Delete the master configuration for a tenant
      description: "Delete the master configuration for a tenant. With SUPER_CONFIG_PRIVILEGE,\
        \ user may delete configurations of different tenants<br/></br>Requires CONFIG_PRIVILEGE."
      operationId: deleteMasterConfigurationUsingDELETE
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: tenantId
        in: path
        description: tenant configuration. to delete
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
          content: {}
      deprecated: false
      security:
      - Authentication:
        - global
  /config/worker:
    get:
      tags:
      - Configuration Query Interfaces
      summary: Get instance configuration state.
      description: "Get configuration for worker instances and its feeds. With SUPER_CONFIG_PRIVILEGE,\
        \ user can obtain configuration for instances across tenants. <br/><br/>Requires\
        \ CONFIG_PRIVILEGE."
      operationId: getWorkerConfigurationUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: array
        in: query
        description: "(optional) defaults to false. If true, returns feeds as a list\
          \ rather than a name-keyed dictionary."
        allowEmptyValue: false
        schema:
          type: boolean
      - name: client-id
        in: query
        description: (optional) client or list of clients for whom to get configuration.
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: resourceType
        in: query
        description: (optional) list of client resource types for which to get configuration.
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: site
        in: query
        description: "(optional) site id, identifier of the site where sources exist."
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: source
        in: query
        description: "(optional) source Id, identifier of the image source."
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: tenant
        in: query
        description: (optional) tenant or list of tenants for whom to get configuration.
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: zone
        in: query
        description: (optional) zone or zones used to filter returned worker configurations.
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/WorkerConfigsResponse'
      deprecated: false
      security:
      - Authentication:
        - global
    put:
      tags:
      - Configuration Update Interfaces
      summary: Update instance configuration state.
      description: "Update the instance configuration. With SUPER_CONFIG_PRIVILEGE,\
        \ user may update configurations of different tenants. <br/></br>Requires\
        \ CONFIG_PRIVILEGE."
      operationId: putWorkerConfigurationUsingPUT
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      requestBody:
        description: request
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/WorkerConfigsRequest'
        required: true
      responses:
        "204":
          description: No Content
          content: {}
      deprecated: false
      security:
      - Authentication:
        - global
      x-codegen-request-body-name: request
  /config/worker/partial_update:
    put:
      tags:
      - Configuration Update Interfaces
      summary: putWorkerPartialConfigurationUpdate
      operationId: putWorkerPartialConfigurationUpdateUsingPUT
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      requestBody:

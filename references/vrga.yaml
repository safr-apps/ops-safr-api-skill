    '[optional] Specifies the capabilities of the client. If this is not specified then the default values are used.':
      title: "[optional] Specifies the capabilities of the client. If this is not\
        \ specified then the default values are used."
      type: object
      properties:
        access-control-level:
          type: integer
          description: "[optional][default=0] If config is > 0, indicates device providing\
            \ the feed is capable of access control<br/>level 1  = NFC card<br/>level\
            \ 2  = Face Recognition<br/>level 4  = IR Face Detection<br/>level 8 \
            \ = 3d Liveness<br/>level 16 = IR Liveness<br/>level 32 = Mobile Credential"
          format: int32
        attendance-level:
          type: integer
          description: "[optional][int][default=0] If config is > 0, indicates device\
            \ providing the feed is capable of attendance control<br>level 1  = Wiegand\
            \ check in and out"
          format: int32
        camera-control-level:
          type: integer
          description: "[optional][default=0] If config is > 0, indicates device providing\
            \ the feed is capable of camera control"
          format: int32
        capture:
          type: boolean
          description: "[optional][default=true] Indicates whether viewing of streams\
            \ from this client is allowed.  If not present the default value is used."
        config:
          type: boolean
          description: "[optional][default=true] Indicates whether configuration of\
            \ this client is allowed.  If not present the default value is used."
        display-control-level:
          type: integer
          description: "[optional][int][default=0] If config is > 0, indicates device\
            \ providing the feed is capable of display control<br>level 1   = display\
            \ on/off/auto<br>level 2   = display brightness level<br>level 4   = display\
            \ access/factor granted light settings<br>level 8   = display access denied\
            \ light settings<br>level 16  = display tailgating detected light settings"
          format: int32
        dvr-level:
          type: integer
          description: "[optional][int][default=0] If config is > 0, indicates device\
            \ providing the feed is capable of dvr control<br>level 1  = live video<br>level\
            \ 2  = video recording 720p with overlays<br>level 4  = video recording\
            \ 4K  "
          format: int32
        dynamic-feeds:
          type: boolean
          description: "optional][default=true] If config is true, indicates if feeds\
            \ can be dynamically added, removed and their input (URL) changed."
        image-control-level:
          type: integer
          description: "[optional][default=0] If config is > 0, indicates device providing\
            \ the feed is capable of image processing control"
          format: int32
        intercom-level:
          type: integer
          description: "[optional][int][default=0] If config is > 0, indicates device\
            \ providing the feed is capable of intercom control<br>level 1  = audio\
            \ intercom<br>level 2  = video intercom<br>level 4  = webRTC via AWS KVS\
            \ support<br>level 8  = SIP support<br>level 16 = webRTC UNLOCK message\
            \ support<br>level 23 = 1+2+4+16<br>level 32 = SIP DTMF unlock support<br>level\
            \ 64 = webRTC CLRID message support<br>level 87 = 1+2+4+16+64<br>level\
            \ 128= SIP caller id support<br>level 256= Call directory support"
          format: int32
        overlay-level:
          type: integer
          description: "[optional][default=1] Indicates overlay is supported in viewing\
            \ streams follows:<br/>level 0 = overlays configuration is not supported<br/>level\
            \ 1 = overlay meta-data is provided as separate stream to be rendered\
            \ by the client<br/>level 2 = overlay is rendered directly into the video<br/>level\
            \ 3 = both level 1 and level 2 are supported"
          format: int32
        sound-control-level:
          type: integer
          description: "[optional][int][default=0] If config is > 0, indicates device\
            \ providing the feed is capable of sound control<br>level 1   = sound\
            \ on/off<br>level 2   = sound volume<br>level 4   = access/factor granted\
            \ sound settings<br>level 8   = access denied sound settings<br>level\
            \ 16  = tailgating detected sound settings<br>level 32  = prompt sound\
            \ settings<br>level 64  = keypad sound settings"
          format: int32
        system-config-level:
          type: integer
          description: "[optional][int][default=1] If config is > 0, indicates processor\
            \ host system configuration is supported as follows:<br/>level 1  = identity\
            \ sync ON/OFF is supported<br/>level 2  = identity event ON/OFF is supported<br/>level\
            \ 3  = level 1 + level 2<br/>level 4  = download images on sync ON/OFF\
            \ configurability is available<br/>level 5  = level 4 + level 1<br/>level\
            \ 6  = level 4 + level 2<br/>level 7  = level 4 + level 2 + level 1<br/>level\
            \ 8  = persistence of person records ON/OFF is supported<br/>level 12\
            \ = 8 + 4<br/>level 16 = access through web gui ON/OFF is supported<br/>level\
            \ 28 = 16 + 8 + 4<br/>level 31 = 16 + 8 + 4 + 2 + 1<br>level 32 = identity\
            \ upload on sync ON/OFF is supported"
          format: int32
        update-level:
          type: integer
          description: "[optional][int][default=0] If config is > 0, indicates device\
            \ providing the feed is capable of update, <br/>level 0  =  no update\
            \ capability (default)<br/>level 1  =  software update capability<br/>level\
            \ 2  =  firmware update capability"
          format: int32
        web-gui-level:
          type: integer
          description: "[optional] Specifies the capabilities of the client.  If this\
            \ is not specified then the default values are used.<br/>[optional][int][default=0]\
            \ If config is > 0, indicates device providing the feed is capable web\
            \ gui<br/>level 0  =  (default) no view is available<br/>level 1  =  Live\
            \ view is available<br/>level 2  =  People view is available<br/>level\
            \ 4  =  Event view is available<br/>level 8  =  Operation settings is\
            \ available<br/>level 16 =  System settings is available<br/>level 32\
            \ =  Security settings is available"
          format: int32
  securitySchemes:
    Authentication:
      type: apiKey
      name: X-RPC-AUTHORIZATION
      in: header

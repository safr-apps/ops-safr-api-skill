        recognizer.smile-duration:
          type: integer
          description: ranges from 0 to 1000 in milliseconds; default value 0
          format: int64
        recognizer.smile-identity-threshold-boost:
          type: number
          description: ranges from 0 to 1.0; default value 0.13
          format: float
        recognizer.smile-pre-delay:
          type: integer
          description: In milliseconds; default value 100ms
          format: int64
        recognizer.smile-rgb-action-min-recognitions-fake:
          type: integer
          description: The minimum number of consecutive 'fake' recognitions that
            are required in order to consider the face fake; Integer value defaults
            to 2.
          format: int32
        recognizer.smile-rgb-action-min-recognitions-live:
          type: integer

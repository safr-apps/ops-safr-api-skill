        input.stream.name:
          type: string
          description: "ONVIF, USB and VMS camera supported friendly name of the stream."
        input.stream.profile:
          type: string
          description: "ONVIF, USB and VMS camera profile id"
        input.stream.rtsp.transport:
          type: string
          description: "Transport to be used by RTSP, e.g. of udp, tcp or udp-multicast\

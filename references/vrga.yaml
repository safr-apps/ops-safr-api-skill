        in: query
        description: (optional) maximum wait time in seconds caller will wait for
          response before timing out. default = 5 seconds
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: noreply
        in: query
        description: "if set to 1, no response body is expected in response if response\
          \ is provided, it will be ignored. When set to 1, call will return immedietaly.\
          \ Will not long-poll (block). default = 0 (response is provided)"

          format: int32
        recognizer.pose-action-min-profile-confidence-start:
          type: number
          description: The maximum profile confidence to use when looking for the
            initial center pose.  Default value is 0.8.
          format: float
        recognizer.pose-action-min-profile-pose-yaw:
          type: number
          description: The minimum yaw threshold in either direction in which the
            face can turn when determining whether the face is in profile pose; default
            value 0.81
          format: float
        recognizer.pose-action-min-profile-similarity:
          type: number
          description: The minimum similarity score required when verifying the final
            profile pose; ranges from 0.0 to 1.0; default value 0.84.
          format: float
        recognizer.pose-action-min-transition-poses:
          type: integer
          description: The minimum number of samples between the initial center pose

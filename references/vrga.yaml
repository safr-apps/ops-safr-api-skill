        intercom.sip.server-address:
          type: string
          description: SIP server address; default value ''
        intercom.sip.server-realm:
          type: string
          description: SIP server realm; default value ''
        intercom.sip.transport:
          type: string
          description: SIP server address; default value 'tcp'; Possible values:<br>'udp'<br>'tcp'<br>'tls'
        intercom.sip.unlock-digit:
          type: string
          description: Unlock digit to used to unlock over SIP; default value '0'
        intercom.sip.username:
          type: string
          description: username used to register with SIP server; default value ''
        intercom.unlock.enabled:
          type: boolean
          description: "If False, unlock via intercom channel is disabled."
        intercom.video.enabled:
          type: boolean
          description: "If False, video is disabled.Video is always from SCAN to client. "
        intercom.video.linphone-connect-assist:
          type: boolean
          description: "If set to true, enables video connection mode that works more\

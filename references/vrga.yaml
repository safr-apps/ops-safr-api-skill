            \ final profile pose, a float between 0 and 1.0.  Default value 0.25. "
          format: float
        recognizer.pose-action-max-profile-pose-roll:
          type: number
          description: The maximum roll threshold in either direction in which the
            face can rotate when determining whether the face is in profile pose;
            default value 0.3
          format: float
        recognizer.pose-action-min-center-pose-quality:
          type: number
          description: "The minimum center pose quality to use when detecting the\
            \ initial center pose, a float between 0 and 1.0.  Default value 0.6."
          format: float
        recognizer.pose-action-min-detections-per-second:
          type: integer
          description: The minimum number of frames per second that is required during

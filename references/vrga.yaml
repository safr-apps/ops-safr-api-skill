          type: integer
          description: The number of faces recognition operations that have failed
            for some reason. This value is initially 0.
          format: int64
        recognizer.face-count:
          type: integer
          description: The number of faces that have been successfully recognized
            or reconfirmed. This value is initially 0.
          format: int64
        recognizer.latency:
          type: integer
          description: The time in milliseconds it takes to run a single recognition
            operation. This value is only sent while object recognition is active
            for an input stream.
          format: int64
        recognizer.skipped-count:
          type: integer
          description: The number of recognition operations that were skipped because
            at the time of recognition there were no available recognizers. This can
            indicate too much load on the machine. This value is initially 0.
          format: int64
        recognizer.trigger-count:
          type: integer
          description: The number of face recognition and reconfirmation operations
            that have been triggered so far. This value is initially 0.
          format: int64
        reporter.event-count:
          type: integer
          description: The number of events that have been reported. Only appears
            if reporting is turned on. This value is initially 0.
          format: int64
        w:
          type: integer
          description: The width of a video frame in pixels. This value is sent once
            the resolution of the input stream has become available.
          format: int64

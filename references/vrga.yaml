        in: header
        description: X-CLIENT-TYPE
        required: true
        schema:
          type: string
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: delta
        in: query
        description: |
          If set to 1, provided status includes only changes and any status not provided should be assumed as not changed from prior posting. All attributes in POST body are optional. default = 0 (full status update)
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: hops
        in: query
        description: (optional) Integer number of times status may be relayed through
          Operation Status configuration
        allowEmptyValue: false
        schema:

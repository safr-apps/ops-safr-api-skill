        recognizer.detect-sentiment:
          type: boolean
          description: Whether to detect sentiment. Default value is false.
        recognizer.detect-smile-action:
          type: boolean
          description: Default value false
        recognizer.identity-masked-threshold-offset:
          type: number
          description: Floating point value. Default value is 0.0.

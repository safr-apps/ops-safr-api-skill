          format: int32
        recognizer.mask-check-min-consecutive-occluded-no-mask-detections:
          type: integer
          description: Integer value indicating min consecutive occluded mask absence
            detections necessary for conclusive detection; default value is 2.
          format: int32
        recognizer.mask-check-min-mask-detection-size:
          type: integer
          description: Integer value indicating min mask detection size; default value

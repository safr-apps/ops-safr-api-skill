          format: float
        recognizer.mask-check-enabled:
          type: boolean
          description: Boolean value enabling mask check; default value is false.
        recognizer.mask-check-min-consecutive-mask-detections:
          type: integer
          description: Integer value indicating min consecutive mask detections necessary

      operationId: getImageStreamUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: clientId
        in: path
        description: (required) Identifier of the client for which we're opening up
          an image stream.
        required: true
        schema:
          type: string
      - name: feedId
        in: path
        description: (required) Identifier of the feed on the client for which we're
          opening up an image stream.
        required: true
        schema:
          type: string
      - name: frame-delay
        in: query
        description: (optional) Delay in milliseconds of the frames posted to the
          Object Server; default value is 30.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: maximum-frames
        in: query
        description: (optional) Max number of frames to post to the Object Server;
          default value is 3600.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: mode
        in: query
        description: "(optional) effects the value of feed's 'capture.mode', a string\
          \ value with default of '' which means no change<br/>rgb = provide video\
          \ feed from rgb camera sensor (visual spectrum)<br/>ir  = provide video\
          \ feed from ir camera sensor (ir spectrum)<br/>slp  = provide video feed\
          \ with structured light projection<br/>slp-forced  = provide video feed\
          \ with structured light projection forced"
        allowEmptyValue: false
        schema:
          type: string
      - name: overlay-level
        in: query
        description: "(optional) effects the value of feed's capture.overlay-level\
          \ property, an integer value with default -1. <br/>-1 = level overlay unchanged<br/>0\
          \ = overlay off<br/>1 = turn on overlay meta-data as separate stream to\
          \ be rendered by the client<br/>2 = turn on overlay rendered directly into\
          \ the video<br/>3 = turn on both level 1 and level 2 overlay"
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: shared
        in: query
        description: "(optional) The stream generated for Virgo and the client calling\
          \ this API will be shared among other clients.  As such, Virga will produce\
          \ a shared stream url for its configured CVOS instance."
        allowEmptyValue: false
        schema:
          type: boolean
      - name: size
        in: query
        description: (optional) Integer size of the image to be returned in the image
          stream; default value is 480.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: tenant
        in: query
        description: tenant
        allowEmptyValue: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/StreamResponse'
      deprecated: false
      security:
      - Authentication:
        - global
  /image_stream/{clientId}/{feedId}/{captureStreamId}:
    put:
      tags:
      - Stream Interfaces
      summary: Extends an Object Server Stream URL to which a Virgo instance can post
        images.
      description: "Extends an Object Server Stream URL to which a Virgo instance\
        \ can post images. This API must be called and the url must be sync'd to the\
        \ worker before maximum-frames number of images are posted to stream.  To\
        \ ensure the client continues posting to the stream, it is recommended that\
        \ API call is made around the time when  about half of the maximum-frames\
        \ are posted to the stream.   The number of frames posted can be estimated\
        \ like this: <br/><br/><div class=\"container\"><code class=\"java plain\"\
        > estimatedPostedFrameCount = Int((currentDate.timeIntervalSince(initialImageReceivedDate)\
        \ * min(configFramesPerSecond, videoFramesPerSecond) + 0.5)), <br/> where\
        \ <br/> configFramesPerSecond = 1 / (TimeInterval(configFrameDelay) / 1000)\
        \ <br/> initialImageReceivedDate is the date/time when the first image was\
        \ received. <br/> videoFramesPerSecond is the rate Virgo reports it's posting.\
        \ <br/> maxFrames is the maximum number of frames that is configured in Virga\
        \ as 'capture.max-frames'. <br/> configFrameDelay is the user configured frame\
        \ delay in Virga 'capture.frame-delay'. </code></div><br/><br/>Requires READ_PRIVILEGE."
      operationId: extendImageStreamUsingPUT
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: captureStreamId
        in: path
        description: (required) Identifier of the capture stream to extend.  This
          identifier is returned in the initial GET /image_stream API call.
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        description: (required) Identifier of the client for which we're opening up
          an image stream.
        required: true
        schema:
          type: string
      - name: feedId
        in: path
        description: (required) Identifier of the feed on the client for which we're
          opening up an image stream.
        required: true
        schema:
          type: string
      - name: frame-delay
        in: query
        description: (optional) Delay in milliseconds of the frames posted to the
          Object Server; default value is 30.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: maximum-frames
        in: query
        description: (optional) Max number of frames to post to the Object Server;
          default value is 3600.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: mode
        in: query
        description: "(optional) effects the value of feed's 'capture.mode', a string\
          \ value with default of '' which means no change<br/>rgb = provide video\
          \ feed from rgb camera sensor (visual spectrum)<br/>ir  = provide video\
          \ feed from ir camera sensor (ir spectrum)<br/>slp  = provide video feed\
          \ with structured light projection<br/>slp-forced  = provide video feed\
          \ with structured light projection forced"
        allowEmptyValue: false
        schema:
          type: string
      - name: overlay-level
        in: query
        description: "(optional) effects the value of feed's capture.overlay-level\
          \ property, an integer value with default -1. <br/>-1 = level overlay unchanged<br/>0\
          \ = overlay off<br/>1 = turn on overlay meta-data as separate stream to\
          \ be rendered by the client<br/>2 = turn on overlay rendered directly into\
          \ the video<br/>3 = turn on both level 1 and level 2 overlay"
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: shared
        in: query
        description: "(optional) The stream generated for Virgo and the client calling\
          \ this API will be shared among other clients.  As such, Virga will produce\
          \ a shared stream url for its configured CVOS instance."
        allowEmptyValue: false
        schema:
          type: boolean
      - name: size
        in: query
        description: (optional) Integer size of the image to be returned in the image
          stream; default value is 480.
        allowEmptyValue: false
        schema:
          type: integer
          format: int64
      - name: tenant
        in: query
        description: tenant
        allowEmptyValue: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/StreamResponse'
      deprecated: false
      security:
      - Authentication:
        - global

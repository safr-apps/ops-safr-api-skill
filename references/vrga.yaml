            played in this cased will be as configured in sound.card-scan-error.
        access.qr-code.auth-url:
          type: string
          description: |-
            Contains URL with which QR code will be authorized (validated). Used only when  access.qr-code.format is set to
            'APOTORO'. Default value ''.
        access.qr-code.enabled:
          type: boolean
          description: Indicates if qr-code input is enabled; Default value 'false'
        access.qr-code.format:
          type: string
          description: "Default value: 'Card-ID'; Possible values:<br>Card-ID<br>Card-ID-Hex<br>Card-UID-Mapped\
            \ + Wiegand-26-No-Parity<br>APOTORO<br>&nbsp;Card-ID, Card-ID-Hex:<br>&nbsp;&nbsp;Matches\
            \ accessCardId in person record as decimal when < 2^64 as hexadecimal\
            \ when >= 2^64<br>&nbsp;Card-UID-Text-Mapped:<br>&nbsp;&nbsp;Matches accessCardUID\
            \ in person record as text (verbatim)<br>&nbsp;Wiegand-26-No-Parity:<br>&nbsp;&nbsp;Numeric\
            \ is converted to binary value. Lowest 16 bits (0-15) are set as numeric\
            \ string to accessCardId<br>&nbsp;&nbsp;Bits 16-23 (8 bits) are set as\

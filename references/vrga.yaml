        dvr.webrtc.aws.secret-key:
          type: string
          description: String value defaulting to ''.
        enabled:
          type: boolean
          description: Whether the feed is enabled. A stream must be enabled in order
            for a task to be assigned.
        image.brightness:
          type: number
          description: "Sets brightness in range [0.0 - 1.0]. Default value is 0.5.\
            \ Requires image-level 4 capability"
          format: float
        image.color-saturation:
          type: number
          description: "Sets color saturation in range [0.0 - 1.0]. Default value\
            \ is 0.55. Requires image-level 4 capability"
          format: float
        image.contrast:
          type: number
          description: "Sets contrast in range [0.0 - 1.0]. Default value is 0.45.\
            \ Requires image-level 4 capability"
          format: float
        image.denoise:
          type: number
          format: float
        image.orientation:
          type: string
        image.sharpness:
          type: number
          description: "Sets sharpness in range [0.0 - 1.0]. Default value is 0.5.\
            \ Requires image-level 4 capability"
          format: float
        image.white-balance:
          type: number
          description: "Sets white balance to use for 'manual' white balance mode\
            \ in range [0.0 - 1.0]. Default value is 0.5. Requires image-level 6 capability"
          format: float
        image.white-balance-mode:
          type: string
          description: Sets white balance mode to 'auto' or 'manual'. Default value
            is 'auto'. Requires image-level 6 capability
        input.allow-every-nth-frame:
          type: number
          description: "Frame rate will be reduced by dropping frames per input.allow-every-nth-frame\
            \ setting, a  floating point value ranging 1.0 - 1000.0. The default value\
            \ is 1.0."
          format: float
        input.back-channel.mobotix.cash-point:
          type: string
          description: "Configures the 'Cash Point' identifier for a feed processing\
            \ a Mobotix camera stream. This enables mapping of the 'Cash Point' on\
            \ the SAFR Client, Mobotix Client and Mobotix Camera.  Defaults to 'None'."
        input.back-channel.type:
          type: string
          description: "For Mobotix back-channel processing, only settable for ONVIF\
            \ or rtsp types.   Possible values include 'None' or 'MobotixMX'. Defaults\
            \ to 'None'."
        input.contrast-enhancement.detection-only:
          type: boolean
          description: "When disabled, enhancement is done of full size input image\
            \ and it applies to all processing performed on the image.When enabled,\
            \ results in enhancement to be performed before each detector on image\
            \ size scaled down for the detector processing. Enhancement does not apply\
            \ to recognition. If contrast enhancement can be performed on GPU, it\
            \ is done before moving memory to CPU side.  If it could not be done on\
            \ GPU, memory is moved to CPU first.  Default value is false."
        input.contrast-enhancement.enabled:
          type: boolean
          description: Indicates whether to apply contrast enhancement algorithm;
            Default value is false.
        input.contrast-enhancement.exposure-boost:
          type: number
          description: Exposure boost parameter with contrast enhancement algorithm
            when enabled.  Range from -1.0 to 1.0.  Default value is 0.0.
          format: float
        input.contrast-enhancement.low-light-threshold:
          type: number
          description: Low light threshold passed to the contrast enhancement algorithm
            when enabled. Range from 0 to 100.0. Default value is 0.02.
          format: float
        input.crop-rectangle.enabled:
          type: boolean
          description: Whether to pass cropping parameters to camera capturing image.  Default
            value is false.
        input.crop-rectangle.height:
          type: number
          description: "Height of the cropping box passed to camera, a value relative\
            \ to the height of the image.  Default value is 1.0."
          format: float
        input.crop-rectangle.left:
          type: number
          description: "Left of the cropping box passed to camera, a value relative\
            \ to size of the image. e.g. 0.1 would be 10% of the image height from\
            \ the top.  Default value is 0.0."
          format: float
        input.crop-rectangle.top:
          type: number
          description: "Top of the cropping box passed to camera, a value relative\
            \ to the size of the image, e.g. 0.1 would be 10% of the image height\
            \ from the top.  Default value is 0.0."
          format: float
        input.crop-rectangle.width:
          type: number
          description: "Width of the cropping box passed to camera, a value relative\
            \ to the width of the image.  Default value is 1.0."
          format: float
        input.lens-correction.enabled:
          type: boolean
          description: Whether lens correction should be enabled.  Default value is
            false.
        input.lens-correction.k1:
          type: number
          description: The K1 lens correction factor.  Default value is 0.
          format: double
        input.lens-correction.k2:
          type: number
          description: The K2 lens correction factor.  Default value is 0.
          format: double
        input.loop:
          type: boolean
          description: Default value is false.
        input.metadata-port:
          type: integer
          description: Port used with Milestone VMS. Not sent by default.

          format: int32
        intercom.protocol:
          type: string
          description: String default value 'webrtc-kvs' Possible values:<br>'webrtc-kvs'<br>'sip'
        intercom.recipient:
          type: string
          description: Default "Operator"; Possible values:<br>"Disabled"<br>"Operator"<br>"Directory"<br>"Mobile"<br>"Extension"
        intercom.recipient.number:
          type: string

          type: boolean
          description: "If set, reporting on all enrolled will be prioritized over\
            \ performance or storage optimizations. Boolean defaults to false"
        reporter.delay:
          type: integer
          description: Delay in milliseconds until reporting a recognition event.
          format: int32
        reporter.enabled:
          type: boolean
          description: Whether to enable reporting services.
        reporter.events-date-timestamps-enabled:
          type: boolean
          description: Reports event date timestamp if enabled; Default value is true.
        reporter.events-initial-date-offset:
          type: integer
          description: When processing a video file for events this value can be used
            to set the initial date offset to use for the events being processed.
            By default video events use the timestamps.
          format: int64
        reporter.maximum-face-image-size:
          type: integer
          description: Integer value defaulting to 240
          format: int32
        reporter.maximum-scene-image-size:
          type: integer
          description: Integer value defaulting to 320
          format: int32
        reporter.minimum-event-duration-identified:
          type: integer
          description: Minimum length of an event before reporting an identified person
            in milliseconds.  Default value is 0.
          format: int32
        reporter.minimum-event-duration-stranger:
          type: integer
          description: Minimum length of an event before reporting an stranger in
            milliseconds.  Default value is 2000.
          format: int32
        reporter.minimum-event-duration-unidentified:
          type: integer
          description: Minimum length of an event before reporting an unidentified
            person in milliseconds. Events below this value will not be reported.
          format: int32
        reporter.minimum-event-portion-masked:
          type: number
          description: Floating point value; default value is 0.2
          format: float
        reporter.report-action-events-only:
          type: boolean
          description: Default value false.
        reporter.report-event-face:
          type: boolean
          description: Whether to report event face images to Object Server.
        reporter.report-event-scene:
          type: boolean
          description: Whether to save event scene image to Object Server.
        reporter.report-noconcern-nonaction-events:
          type: boolean
          description: Reports non-action events for people that are enrolled as no-concern;
            default value true
        reporter.report-secondary-events:
          type: boolean
          description: "Reports secondary events.  Secondary events are events that\
            \ are associated with a primary event via the rootEventId property in\
            \ the event. It is usually preferred to only report the primary events\
            \ and the secondary events need to only be reported if there is more detail\
            \ needed. If this is disabled then all events with a rootEventId property\
            \ set to a primary event will not be reported.  Only events with rootEventId\
            \ not set to anything will be reported, which are the primary events."
        reporter.report-signature:
          type: boolean
          description: "When true, events reported include face signatures recognized.\
            \ Default value is false."
        reporter.report-source-heading:
          type: boolean
          description: "When enabled, heading of the source capturing the event is\
            \ included in reported event."
        reporter.report-source-location:
          type: boolean
          description: "When enabled, GPS location (longitude and latitude) of the\
            \ source capturing the event is included in reported event."
        reporter.report-source-orientation:
          type: boolean
          description: "When enabled, orientation of the source capturing the event\
            \ is included in reported event."
        reporter.report-source-speed:
          type: boolean
          description: "When enabled, speed of the source capturing the event is included\
            \ in reported event."
        reporter.report-source-status:
          type: boolean
          description: "If true, source status is reported per configured interval;\
            \ boolean value defaults to false."
        reporter.report-source-status-interval:
          type: integer
          description: "Time interval in milliseconds between source status reports.\
            \  If set to 0, source status is reported as fast as possible.  Default\
            \ value is 10000 or ten seconds."
          format: int64
        reporter.report-source-userId:
          type: boolean
          description: "When set to true, userId in control of the source at the time\
            \ of event reporting is included in reported event."
        reporter.report-speculated-events:
          type: boolean
          description: "Reports events for speculated people. This means faces that\
            \ aren't a 100% match, but are close; defaults to true."
        reporter.report-stranger-events:
          type: boolean
          description: Reports events for people that are strangers. These are people
            not registered by the system after running facial recognition on the face;
            defaults to true.
        reporter.report-unrecognizable-events:
          type: boolean
          description: Reports events for people that are not recognizable; defaults
            to true.
        reporter.stranger-events.only-if-occluded:
          type: boolean
          description: stranger event to be reported only when face is occluded. Default
            value is false.
        reporter.stranger-maximum-age:
          type: integer
          description: Default value 0.
          format: int32
        reporter.stranger-minimum-age:
          type: integer
          description: Minimum age of strangers to report.  Default value 0.
          format: int32
        reporter.update-images:
          type: boolean
          description: Update the thumbnail images with higher quality images during
            the course of the event if possible.
        reporter.update-in-progress-event-interval:
          type: integer
          description: This specifies the interval time in which to update event properties
            that change.
          format: int64
        reporter.update-in-progress-event-properties:
          type: boolean
          description: "If this is enabled then any event properties that change will\
            \ be updated a the specified interval.  Many properties do change periodically,\
            \ such as images or other averages that are continually computed."

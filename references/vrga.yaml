            \ of noconcern<br>idClass if longer than specified <br>action long event\
            \ duration will have <br>actionId=\"loitering\" or \"delayed\" added to\
            \ it<br>according to this setting."
        reporter.always-report-on-all-enrolled:
          type: boolean
          description: "If set, reporting on all enrolled will be prioritized over\

        input.stream.url:
          type: string
          description: "Source url of the feed for IP Cameras. If this is empty and\
            \ stream id is empty, the configuration will exist but worker will not\
            \ report status on this feed."
        input.type:
          type: string
          description: "Type of the feed, e.g. Stream, Onvif, Avf"
        input.user-name:
          type: string
          description: ONVIF Camera Username
        input.video-clock.enabled:
          type: boolean
          description: Default value is false.
        intercom.audio.codec:
          type: string
          description: Intercom audio codec; default value 'auto'; Possible values:'auto'<br>'speex-8000'<br>'speex-16000'<br>'speex-32000'<br>'iLBC-8000'<br>'GSM-8000'<br>'PCMU-8000'<br>'PCMA-8000'<br>'G722-8000'<br>'opus-48000-2'
        intercom.aws.access-key:
          type: string
          description: AWS access key; String value defaulting to ''
        intercom.aws.channel-name:
          type: string
          description: AWS KVS signaling channel name; String value defaulting to
            ''
        intercom.aws.region:
          type: string
          description: AWS region code or '' when not set; String value defaulting
            to ''
        intercom.aws.secret-key:
          type: string
          description: AWS secret key; String value defaulting to ''
        intercom.enabled:
          type: boolean
          description: "If True, Intercom is enabled."
        intercom.incoming.enabled:
          type: boolean
          description: "If False, intercom call initiation is supported only from\
            \ SCAN device."
        intercom.max-ringing-duration:
          type: integer
          description: Maximum number of milliseconds intercom should be ringing before

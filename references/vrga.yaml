    post:
      tags:
      - Status Interfaces
      summary: "Update VirgoConfig instance status.  NOTE: this should only be called\
        \ by a Worker instance."
      description: Update the status of the Virgo instance. Called by a Worker process
        to update Virga with its feeds status.</br>No privileges are required; X-CLIENT-ID
        and X-CLIENT-TYPE headers are required.
      operationId: postVirgoStatusUsingPOST
      parameters:
      - name: X-CLIENT-ID
        in: header
        description: X-CLIENT-ID

          format: int32
        recognizer.maximum-clip-ratio:
          type: number
          description: Maximum clip ratio during recognition.  Default value is 0.2
          format: double
        recognizer.maximum-clip-ratio-identification:
          type: number
          description: Maximum clip ratio for identification during recognition.  Default
            value is 0.
          format: double
        recognizer.maximum-concurrent-recognitions:
          type: integer
          description: The maximum number of concurrent recognitions to allow. 0 means
            to automatically set this; default value is 0.
          format: int32
        recognizer.maximum-occlusion:
          type: number
          description: "Valid values are in the range of 0.0 - 1.0.  This is the maximum\
            \ occlusion value that is allowed when inserting new recognition candidate\
            \ images into the Cloud database.  If the face is occluded with a value\
            \ greater than this then the face will not be added, but if it is less\
            \ than or equal to this value then it will be added."
          format: float
        recognizer.maximum-pitch-identification:
          type: number
          description: This is the maximum pitch value used to determine if the face
            is looking straight.  The pitch value is the forward / backward movement
            of the face.  Default value is 0.4.
          format: float
        recognizer.maximum-roll-identification:
          type: number
          description: This is the maximum roll value used to determine if the face
            is looking straight.  The roll value is the side to side tilt movement
            of the face.  Default value is 0.15.
          format: float
        recognizer.maximum-yaw-identification:
          type: number
          description: This is the maximum yaw value used to determine if the face
            is looking straight.  The yaw value is the side to side movement of the
            face.  Default value is 0.4.
          format: float
        recognizer.minimum-center-pose-quality:
          type: number
          description: Minimum center pose quality.
          format: double
        recognizer.minimum-center-pose-quality-direct-gaze:
          type: number
          description: Default value 0.7
          format: float
        recognizer.minimum-center-pose-quality-identification:
          type: number
          description: Minimum center pose quality for identification during recognition.
          format: double
        recognizer.minimum-center-pose-quality-merging:
          type: number
          description: Minimum center pose quality for merging identities during recognition.
          format: double
        recognizer.minimum-face-contrast-quality:
          type: number
          description: Minimum face contrast quality in recognition.
          format: float
        recognizer.minimum-face-contrast-quality-identification:
          type: number
          description: Minimum face contrast quality for identification during recognition.
          format: float
        recognizer.minimum-face-contrast-quality-merging:
          type: number
          description: Minimum face contrast quality for merging with known identities

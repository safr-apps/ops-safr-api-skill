        tracker.enable-face-bounds-prediction:
          type: boolean
          description: "Enable face bounds prediction, which predicts which direction\
            \ the face is moving to maintain tracking; default value is true."
        tracker.enable-face-size-correlation:
          type: boolean
          description: "Enable face correlation of tracked faces, which compares detected\
            \ faces looking for a change in area; default value is true."
        tracker.enable-high-precision:
          type: boolean
          description: Boolean default value is false.
        tracker.failed-recognition-back-off-interval:
          type: integer
          description: "After making the initial recognition attempts as fast as possible\
            \ back up this amount for each subsequent recognition to slow down. This\
            \ goes on until the retry interval is reached; In milliseconds, default\
            \ value is 340."
          format: int64
        tracker.failed-recognition-retry-interval:
          type: integer
          description: The interval in which to run recognition requests if the face
            has not been recognized in milliseconds; default value is 1.
          format: int64
        tracker.identity-relearn-interval-days:
          type: integer
          description: Default value 0.
          format: int32
        tracker.identity-update-better-image:
          type: boolean
          description: Default value false.
        tracker.initial-recognition-attempts:
          type: integer
          description: The number of initial recognition attempts to make on an unrecognized
            person as fast as possible; default value is 3.
          format: int32
        tracker.max-position-change-relative-to-face:
          type: integer
          description: "The maximum position change, specified in percentage relative\
            \ to the object size, to continue tracking; default value is 115."
          format: int32
        tracker.max-position-change-relative-to-view:
          type: integer
          description: "The maximum position change, specified in percentage relative\
            \ to the view, to continue tracking; default value is 10."
          format: int32
        tracker.max-size-change-relative-to-face:
          type: integer
          description: "The maximum size change, specified in percentage relative\
            \ to the object size, to continue tracking; default value is 50."
          format: int32
        tracker.maximum-linger-frames:
          type: integer
          description: Determines for how many frames more we continue to keep a tracked
            face around after we have failed to detect it in the most recent frame.
          format: int32
        tracker.min-failed-recognitions-to-stop-tracking-identity:
          type: integer
          description: "When a face is being tracked recognitions are continually\
            \ confirming the identity. The identity is also being verified if it is\
            \ transferred from a person object.  In these cases, if the recognition\
            \ or verification fails thisnumber of consecutive times then the identity\
            \ will be reset and no longer associated with the face because we are\
            \ no longer sure it is the same identity."
          format: int32
        tracker.minimum-number-identical-recognitions-learn:
          type: integer
          description: Minimum number of identical recognitions required for learning.  Default
            value is 2.
          format: int32
        tracker.minimum-number-identical-recognitions-lock:
          type: integer
          description: Minimum number of identical recognitions before the tracker
            locks on to a person.
          format: int32
        tracker.minimum-required-consecutive-badge-detections:
          type: integer
          description: Minimum required consecutive badge detections. Default value
            is 1.
          format: int32
        tracker.minimum-required-consecutive-mask-detections:
          type: integer
          description: "The minimum required consecutive mask detections, an integer\
            \ value in range 1 .. 10.  Default value is 1."
          format: int32
        tracker.reconfirm-identity-in-video-on-every-key-frame:
          type: boolean
          description: When a key frame is encountered in a video file all the faces
            that are being tracked are marked as unconfirmed so that their identities
            are reconfirmed to make sure they are the same person.  This setting only
            applies to video files and not live video.  If a video file does not represent
            recorded live video then this can typically be set to true for better
            tracking during scene changes.
        tracker.reconfirmation-interval:
          type: integer
          description: The time in-between reconfirmation attempts. We reconfirm the
            identity of a tracked face from time to time after it has been recognized
            as a person X.
          format: int32
        tracker.stop-tracking-on-failed-re-recognition:
          type: boolean
          description: If recognition fails when re-recognizing a person then delete
            the identity that was created; default value is false.
        zoneNames:
          type: array
          description: Zone Names for zones
          items:
            type: string
        zones:
          type: array
          description: Zones including this feed.
          items:
            type: string

          format: float
        recognizer.detect-occlusion:
          type: boolean
          description: Whether to enable occlusion detection during recognition; default
            value is false.
        recognizer.detect-pose-action:
          type: boolean
          description: Whether to detect pose action.  Default value false.
        recognizer.detect-rgb-action:
          type: boolean
          description: Boolean value enables the RGB liveness recognizer and will

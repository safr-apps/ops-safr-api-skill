            \ It is known to cause audio issues with Genetec Sipelia. Default Boolean\
            \ false."
        intercom.voice-volume:
          type: number
          description: "Sets volume level for intercom voice in range [0.0  1.0];\
            \ default value is 0.75"
          format: float
        mode:
          type: string
          description: "Name of a filter to be applied to the feed to override settings.\
            \  Predefined modes include 'Recognition', 'Import', 'Similar', 'Secure\
            \ Access', 'Secure Access with Smile','Secure Access with RGB Liveness',\
            \ 'Secure Access with Smile and RGB Liveness', 'Registration Kiosk', 'Anonymous\
            \ Traffic Monitoring', 'Enrolled Monitoring', 'Enrolled and Anonymous\
            \ Traffic Monitoring', 'Enrolled and Unique Traffic Monitoring', 'Enrolled\
            \ and Stranger Monitoring'.  When defining a mode, this property also\
            \ represents the mode name."
        name:
          type: string
          description: "Name of the feed. When defining a mode, either name field\
            \ or mode field may be used to name the mode."

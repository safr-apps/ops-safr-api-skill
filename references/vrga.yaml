            disables.
          format: float
        recognizer.pose-action-max-cpq-jump-in-continuity:
          type: number
          description: The maximum change between samples while the pose is changing
            from center to profile; ranges from 0 to 1.0; default value 1.0 which
            disables.
          format: float
        recognizer.pose-action-max-profile-confidence-end:
          type: number
          description: When verifying the final profile pose this is the minimum confidence

            false.
        recognizer.detect-age:
          type: boolean
          description: Whether to detect age. Default value is false.
        recognizer.detect-gender:
          type: boolean
          description: Whether to detect gender.  Default value is false.
        recognizer.detect-identity:
          type: boolean
          description: Default value true
        recognizer.detect-mask:
          type: boolean
          description: If set to true then mask detection will be enabled; default

    Feed:
      title: Feed
      required:
      - name
      type: object
      properties:
        accelerator:
          type: string
          description: "Indicates whether to use GPU acceleration. Possible values\
            \ are 'cpu', 'gpu' and 'auto'. <br/>'cpu': use CPU exclusively. Feed fails\
            \ with an error if no CPU is available. <br/>'gpu': use GPU exclusively.\
            \ Virgo picks a GPU from the set of available GPUs. Feed fails with an\
            \ error if no GPU is available.<br/>'auto': use a GPU if possible and\
            \ fall back to CPU otherwise. Defaults to 'auto'."
        accelerator.gpu-frame-pool-size:
          type: integer
          description: This is the pool of frames allocated in GPU memory initially.
            </br>-2 means use the platform default to determine the best number of
            frames (Linux and Windows differ currently here). </br>-1 means use the
            decoder default (ffmpeg will figure this out)</br>0..N Use this number
            of frames. </br>The default value is -2.
          format: int32
        accelerator.gpu-id:
          type: integer
          description: The GPU identifier to use when GPU acceleration is in use.
            This is only used if the 'accelerator' property is set to gpu or auto
            (and gpu is used). If this is specified this will force the specific GPU
            to be used and if failure occurs it will fallback to CPU. This is an advanced
            setting that should only be used in very specific cases.
          format: int32
        access.card-auto-enroll.enabled:
          type: boolean
          description: "If True, Card auto-learning is enabled when card is used as\
            \ a second factor; defaults to False"
        access.card-byte-order:

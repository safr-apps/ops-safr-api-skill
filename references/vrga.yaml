        required: true
      responses:
        "200":
          description: OK
          content: {}
      deprecated: false
      security:
      - Authentication:
        - global
      x-codegen-request-body-name: request
  /config/worker/{clientId}:
    delete:
      tags:
      - Configuration Update Interfaces
      summary: Delete instance configuration state.
      description: "Delete an instance configuration.  With SUPER_CONFIG_PRIVILEGE,\
        \ user may delete configurations of different tenants. <br/></br>Requires\
        \ CONFIG_PRIVILEGE."
      operationId: deleteWorkerConfigurationUsingDELETE
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: clientId
        in: path
        description: Worker configuration to delete.
        required: true
        schema:
          type: string
      - name: tenant
        in: query
        description: Tenant of worker configuration to delete; must be a super admin
          if this is different than your own..
        allowEmptyValue: false
        schema:
          type: string
      responses:
        "204":
          description: No Content
          content: {}
      deprecated: false
      security:
      - Authentication:
        - global
  /config/zone/**:
    delete:
      tags:
      - Zones Interfaces
      summary: Delete a Zone
      description: Delete a single Zone<br/><br/>Requires CONFIG_PRIVILEGE.
      operationId: deleteZoneConfigsUsingDELETE
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: id
        in: query
        description: id
        schema:
          type: string
      requestBody:
        description: (required) path variable Zone name.
        content:
          '*/*':
            schema:
              type: string
        required: true
      responses:
        "200":
          description: OK
          content: {}
      deprecated: false
      security:
      - Authentication:
        - global
      x-codegen-request-body-name: zoneName
  /config/zones:
    get:
      tags:
      - Zones Interfaces
      summary: Query for Zone Details
      description: Query for Zone Details.  Returns all configured zones and their
        details regardless of whether feeds are assigned to these zones.<br/><br/>Requires
        READ_PRIVILEGE.
      operationId: getZoneConfigsUsingGET
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      - name: zone
        in: query
        description: "(optional) comma separated list of zone (e.g. ?zone=zone1,zone2)\
          \ or  repeated list of zone names (e.g. ?zone=zone1&feed=zone2) for which\
          \ to retrieve zone configs"
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GetZoneConfigsResponse'
      deprecated: false
      security:
      - Authentication:
        - global
    put:
      tags:
      - Zones Interfaces
      summary: Update Zone Details
      description: Update Zone Details.  Returns all configured zones and their details
        regardless of whether feeds are assigned to these zones.<br/><br/>Requires
        CONFIG_PRIVILEGE.
      operationId: putZoneConfigsUsingPUT
      parameters:
      - name: X-RPC-DIRECTORY
        in: header
        description: Header containing directory account id.
        required: true
        schema:
          type: string
          default: main
      requestBody:
        description: zoneConfigsRequest
        content:

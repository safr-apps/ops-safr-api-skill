          format: float
        recognizer.minimum-face-sharpness-quality:
          type: number
          description: Minimum face image sharpness quality.
          format: double
        recognizer.minimum-face-sharpness-quality-identification:
          type: number
          description: Minimum sharpness for identification during recognition.  Default
            value is 0.45.
          format: double
        recognizer.minimum-face-sharpness-quality-merging:
          type: number
          description: Minimum sharpness for merging identities during recognition.  Default
            value is 0.45.
          format: double
        recognizer.minimum-face-size:
          type: integer
          description: Minimum face size for recognition.
          format: int32
        recognizer.minimum-face-size-identification:
          type: integer
          description: Minimum face size for identification during recognition.
          format: int32
        recognizer.minimum-face-size-merging:
          type: integer
          description: Minimum face size for merging identities during recognition.
          format: int32
        recognizer.pose-action-max-cpq-jump-after-discontinuity:
          type: number
